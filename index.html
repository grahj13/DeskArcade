<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeskArcade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #8cff6a;
      --green-soft: #c8ffd8;
      --bg: #071106;
      --bg-deep: #020402;
      --panel: rgba(7, 24, 8, 0.94);
      --panel-hover: rgba(10, 32, 11, 0.98);
      --border: rgba(140,255,106,0.22);
      --border-strong: rgba(140,255,106,0.46);
      --frame-glow:
        0 0 18px rgba(140,255,106,0.08),
        0 0 36px rgba(140,255,106,0.05);
      --radius-large: 18px;
      --radius-medium: 14px;
      --radius-small: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--green);
      background:
        radial-gradient(circle at top, rgba(140,255,106,0.14), transparent 34%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      padding: 24px;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
    }

    .frame {
      border: 1px solid var(--border);
      background: rgba(4, 14, 5, 0.72);
      box-shadow: var(--frame-glow);
      padding: 18px;
      border-radius: var(--radius-large);
    }

    .hero {
      position: relative;
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(140,255,106,0.10);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(140,255,106,0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero > * {
      position: relative;
      z-index: 1;
    }

    .main-logo {
      display: block;
      max-width: 420px;
      width: 100%;
      height: auto;
      margin: 0 auto 14px;
      filter:
        drop-shadow(0 0 10px rgba(140,255,106,0.25))
        drop-shadow(0 0 22px rgba(140,255,106,0.12));
    }

    .subline {
      margin: 0;
      font-size: 13px;
      color: var(--green-soft);
      text-shadow: 0 0 10px rgba(140,255,106,0.12);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 150px;
      padding: 14px;
      text-decoration: none;
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: var(--radius-medium);
      background: var(--panel);
      box-shadow:
        inset 0 0 18px rgba(140,255,106,0.03),
        0 0 12px rgba(140,255,106,0.10);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      background: var(--panel-hover);
      border-color: var(--border-strong);
      animation: tilePulse 1.4s ease-in-out infinite;
    }

    .game-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      width: 100%;
      padding: 8px;
      border-radius: var(--radius-small);
    }

    .game-logo {
      max-width: 100%;
      max-height: 58px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 8px rgba(140,255,106,0.14));
      transition: transform 0.18s ease;
    }

    .game-card:hover .game-logo {
      transform: scale(1.04);
    }

    .logo-large .game-logo {
      max-height: 72px;
    }

    .logo-medium .game-logo {
      max-height: 64px;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: rgba(200,255,216,0.72);
    }

    @keyframes tilePulse {
      0% {
        box-shadow:
          inset 0 0 18px rgba(140,255,106,0.04),
          0 0 10px rgba(140,255,106,0.14),
          0 0 18px rgba(140,255,106,0.10);
      }
      50% {
        box-shadow:
          inset 0 0 22px rgba(140,255,106,0.05),
          0 0 18px rgba(140,255,106,0.22),
          0 0 30px rgba(140,255,106,0.14);
      }
      100% {
        box-shadow:
          inset 0 0 18px rgba(140,255,106,0.04),
          0 0 12px rgba(140,255,106,0.16),
          0 0 24px rgba(140,255,106,0.11);
      }
    }

.feedback-panel {
  margin-top: 24px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius-medium);
  background: var(--panel);
  box-shadow:
    inset 0 0 18px rgba(140,255,106,0.03),
    0 0 12px rgba(140,255,106,0.10);
}

.feedback-panel h2 {
  margin: 0 0 14px;
  font-size: 20px;
  text-transform: uppercase;
}

.feedback-panel label {
  display: block;
  margin: 12px 0 6px;
  font-size: 13px;
  color: var(--green-soft);
}

#gameSelect,
#feedbackBox {
  width: 100%;
  padding: 11px;
  background: #001507;
  color: var(--green);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-small);
  font-family: inherit;
}

#feedbackBox {
  min-height: 110px;
  resize: vertical;
}

#sendFeedbackBtn {
  margin-top: 14px;
  padding: 11px 16px;
  background: var(--green);
  color: #061206;
  border: none;
  border-radius: var(--radius-small);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
}

#sendFeedbackBtn:hover {
  filter: brightness(1.15);
}

#feedbackStatus {
  margin: 12px 0 0;
  font-size: 13px;
  color: var(--green-soft);
}
    
    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .frame {
        padding: 16px;
        border-radius: 14px;
      }

      .main-logo {
        max-width: 320px;
      }

      .hero {
        margin-bottom: 14px;
        padding-bottom: 12px;
      }

      .games-grid {
        gap: 12px;
      }

      .game-card {
        min-height: 140px;
        padding: 12px;
        border-radius: 12px;
      }

      .game-logo-wrap {
        min-height: 70px;
      }

      .game-logo {
        max-height: 52px;
      }

      .logo-large .game-logo {
        max-height: 64px;
      }

      .logo-medium .game-logo {
        max-height: 58px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="frame">

      <section class="hero">
        <img src="deskarcadelogo.png" alt="DeskArcade logo" class="main-logo">
        <p class="subline">Pick a game. Waste a few minutes.</p>
      </section>

      <section class="games-grid">
        <a class="game-card logo-large" href="games/keystorm/index.html" aria-label="Play KeyStorm">
          <div class="game-logo-wrap">
            <img src="games/keystorm/keystorm-logo.png" alt="KeyStorm logo" class="game-logo">
          </div>
        </a>

        <a class="game-card" href="games/snake/index.html" aria-label="Play Grid Viper">
          <div class="game-logo-wrap">
            <img src="games/snake/gridviperlogov2.png" alt="Grid Viper logo" class="game-logo">
          </div>
        </a>

        <a class="game-card" href="games/shockline/index.html" aria-label="Play Shockline">
          <div class="game-logo-wrap">
            <img src="games/shockline/shocklinelogo.png" alt="Shockline logo" class="game-logo">
          </div>
        </a>

        <a class="game-card" href="games/neonreels/index.html" aria-label="Play NeonReels">
          <div class="game-logo-wrap">
            <img src="games/neonreels/neonreelslogo.png" alt="NeonReels logo" class="game-logo">
          </div>
        </a>

        <a class="game-card" href="games/reacto/index.html" aria-label="Play Reacto">
          <div class="game-logo-wrap">
            <img src="games/reacto/reactologo.png" alt="Reacto logo" class="game-logo">
          </div>
        </a>

        <a class="game-card logo-large" href="games/perfect10/index.html" aria-label="Play Perfect 10">
          <div class="game-logo-wrap">
            <img src="games/perfect10/perfect10logo.png" alt="Perfect 10 logo" class="game-logo">
          </div>
        </a>

        <a class="game-card" href="games/lanedash/index.html" aria-label="Play Lane Dash">
          <div class="game-logo-wrap">
            <img src="games/lanedash/lanedashlogo.png" alt="Lane Dash logo" class="game-logo">
          </div>
        </a>

        <a class="game-card logo-medium" href="games/neonsearch/index.html" aria-label="Play Neon Search">
          <div class="game-logo-wrap">
            <img src="games/neonsearch/neonsearchlogo.png" alt="Neon Search logo" class="game-logo">
          </div>
        </a>

<a class="game-card logo-large" href="games/fracture/index.html" aria-label="Play Fracture">
         <div class="game-logo-wrap">
            <img src="games/fracture/fracturelogo.png" alt="Fracture logo" class="game-logo">
          </div>
          </a>
        
        <a class="game-card logo-large" href="games/signalscan/index.html" aria-label="Play Signal Scan">
          <div class="game-logo-wrap">
            <img src="games/signalscan/signalscanlogo.png" alt="Signal Scan logo" class="game-logo">
          </div>
        </a>

            <a class="game-card logo-large" href="games/wordforge/index.html" aria-label="Play Word Forge">
          <div class="game-logo-wrap">
            <img src="games/wordforge/wordforgelogo.png" alt="Word Forge logo" class="game-logo">
          </div>
        </a>

                    <a class="game-card logo-large" href="games/runexe/index.html" aria-label="Play Run.exe">
          <div class="game-logo-wrap">
            <img src="games/runexe/runexelogo.png" alt="Run.exe logo" class="game-logo">
          </div>
        </a>

        <a class="game-card logo-large" href="games/perfecttrace/index.html" aria-label="Play Perfect Trace">
          <div class="game-logo-wrap">
            <img src="games/perfecttrace/perfecttracelogo.png" alt="Perfect Trace logo" class="game-logo">
          </div>
        </a>

                <a class="game-card logo-large" href="games/pixelglide/index.html" aria-label="Play Pixel Glide">
          <div class="game-logo-wrap">
            <img src="games/pixelglide/pixelglidelogo.png" alt="Pixel Glide logo" class="game-logo">
          </div>
        </a>

                <a class="game-card logo-large" href="games/wordtrap/index.html" aria-label="Play Word Trap">
          <div class="game-logo-wrap">
            <img src="games/wordtrap/wordtraplogo.png" alt="Word Trap logo" class="game-logo">
          </div>
        </a>
        
      </section>
    <section class="feedback-panel">
  <h2>Feedback & Suggestions</h2>

  <label for="gameSelect">Game</label>
<select id="gameSelect">
  <option value="">Select a game</option>
  <option value="General">General</option>
  <option value="DeskArcade Home">Home Page</option>
  <option value="KeyStorm">KeyStorm</option>
  <option value="Grid Viper">Grid Viper</option>
  <option value="Shockline">Shockline</option>
  <option value="NeonReels">NeonReels</option>
  <option value="Reacto">Reacto</option>
  <option value="Perfect 10">Perfect 10</option>
  <option value="Lane Dash">Lane Dash</option>
  <option value="Neon Search">Neon Search</option>
  <option value="Fracture">Fracture</option>
  <option value="Signal Scan">Signal Scan</option>
  <option value="Word Forge">Word Forge</option>
  <option value="Run.exe">Run.exe</option>
  <option value="Perfect Trace">Perfect Trace</option>
  <option value="Pixel Glide">Pixel Glide</option>
  <option value="Word Trap">Word Trap</option>
</select>

  <label for="feedbackBox">Feedback/Suggestions</label>
  <textarea id="feedbackBox" placeholder="Drop your feedback here or suggestions here..."></textarea>

  <button id="sendFeedbackBtn">Send Feedback/Suggestion</button>
  <p id="feedbackStatus"></p>
</section>
      <footer class="footer">
        Built by Jason
      </footer>

    </div>
  </main>
  <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKN2_C2XJU8ozndhiZQmYYjoRzwrytxe3LcxsEjs6AeVIL_LY0K9fcUfN0sOJzJ2pC/exec";

  document.getElementById("sendFeedbackBtn").addEventListener("click", async () => {
    const game = document.getElementById("gameSelect").value;
    const feedback = document.getElementById("feedbackBox").value.trim();
    const status = document.getElementById("feedbackStatus");

    if (!game) {
      status.textContent = "Pick a game first.";
      return;
    }

    if (!feedback) {
      status.textContent = "Write something first.";
      return;
    }

    status.textContent = "Sending...";

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          game: game,
          page: document.title,
          feedback: feedback,
          userAgent: navigator.userAgent
        })
      });

      const result = await response.json();

      if (result.success) {
        document.getElementById("feedbackBox").value = "";
        status.textContent = "Thanks. Feedback sent.";
      } else {
        status.textContent = "Failed to send feedback.";
        console.error(result.error);
      }
    } catch (error) {
      status.textContent = "Failed to send feedback.";
      console.error(error);
    }
  });
</script>
</body>
</html>
