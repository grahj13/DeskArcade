<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskArcade</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #071106;
      --bg2: #020402;
      --panel: rgba(7, 24, 8, 0.92);
      --green: #8cff6a;
      --green-soft: #c8ffd9;
      --border: rgba(140,255,106,0.22);
      --border-strong: rgba(140,255,106,0.45);
      --shadow: 0 0 18px rgba(140,255,106,0.12);
      --shadow-strong: 0 0 24px rgba(140,255,106,0.22);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--green);
      background:
        radial-gradient(circle at top, rgba(140,255,106,0.10), transparent 38%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      padding: 28px 18px 40px;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(140,255,106,0.45);
    }

    .hero p {
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--green-soft);
    }

    .section-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    .section-bar h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--green-soft);
    }

    .game-count {
      font-size: 12px;
      color: rgba(200,255,217,0.75);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 190px;
      padding: 18px 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      text-decoration: none;
      color: var(--green);
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-strong);
      background: rgba(10, 32, 11, 0.98);
    }

    .game-logo {
      max-width: 170px;
      max-height: 72px;
      width: auto;
      height: auto;
      display: block;
      margin-bottom: 16px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(140,255,106,0.16));
    }

    .game-name {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .game-tag {
      font-size: 12px;
      color: var(--green-soft);
      opacity: 0.9;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: rgba(200,255,217,0.7);
    }

    @media (max-width: 700px) {
      .game-card {
        min-height: 170px;
      }

      .game-logo {
        max-width: 150px;
        max-height: 64px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>DeskArcade</h1>
      <p>Pick a game. Kill a few minutes. Try not to get caught.</p>
    </section>

    <div class="section-bar">
      <h2>Games</h2>
      <div class="game-count">8 live</div>
    </div>

    <section class="games-grid">
      <a class="game-card" href="games/keystorm/index.html">
        <img class="game-logo" src="games/keystorm/keystorm-logo.png" alt="KeyStorm logo">
        <div class="game-name">KeyStorm</div>
        <div class="game-tag">Typing</div>
      </a>

      <a class="game-card" href="games/snake/index.html">
        <div class="game-name">Grid Viper</div>
        <div class="game-tag">Arcade</div>
      </a>

      <a class="game-card" href="games/shockline/index.html">
        <div class="game-name">Shockline</div>
        <div class="game-tag">Precision</div>
      </a>

      <a class="game-card" href="games/neonreels/index.html">
        <img class="game-logo" src="games/neonreels/neonreelslogo.png" alt="NeonReels logo">
        <div class="game-name">NeonReels</div>
        <div class="game-tag">Slots</div>
      </a>

      <a class="game-card" href="games/reacto/index.html">
        <div class="game-name">Reacto</div>
        <div class="game-tag">Reaction</div>
      </a>

      <a class="game-card" href="games/perfect10/index.html">
        <img class="game-logo" src="games/perfect10/perfect10logo.png" alt="Perfect 10 logo">
        <div class="game-name">Perfect 10</div>
        <div class="game-tag">Timing</div>
      </a>

      <a class="game-card" href="games/lanedash/index.html">
        <img class="game-logo" src="games/lanedash/lanedashlogo.png" alt="Lane Dash logo">
        <div class="game-name">Lane Dash</div>
        <div class="game-tag">Dodge</div>
      </a>

      <a class="game-card" href="games/neonsearch/index.html">
        <img class="game-logo" src="games/neonsearch/neonsearchlogo.png" alt="Neon Search logo">
        <div class="game-name">Neon Search</div>
        <div class="game-tag">Wordsearch</div>
      </a>
    </section>

    <div class="footer">Built by Jason</div>
  </main>
</body>
</html>
