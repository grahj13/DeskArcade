<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaneDash | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#f97316;
  --accent-2:#fb923c;
  --red:#ef4444;
  --yellow:#f59e0b;
  --blue:#38bdf8;
}

body {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  overflow:hidden;
}

.game-shell {
  position:relative;
  z-index:1;
  width:min(860px, 100%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
  padding:14px 16px 16px;
}

.top-bar {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.top-spacer {
  width:150px;
  height:1px;
}

.game-logo {
  height:48px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  display:block;
  justify-self:center;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.arcade-link {
  justify-self:end;
}

.stats {
  display:flex;
  gap:10px;
  margin-bottom:8px;
}

.stat {
  flex:1;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:8px;
  background:var(--surface);
  text-align:center;
}

.stat span {
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:2px;
}

.stat strong {
  display:inline-block;
  font-family:var(--font-mono);
  font-size:1.25rem;
  color:var(--accent-text);
}

.stat.score-pop strong {
  animation:scorePop 0.18s ease;
}

@keyframes scorePop {
  0% { transform:scale(1); }
  50% { transform:scale(1.18); }
  100% { transform:scale(1); }
}

.game-area {
  position:relative;
  width:min(500px, 100%);
  margin:0 auto;
}

.game-area::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:var(--radius-md);
  pointer-events:none;
  z-index:2;
  box-shadow:inset 0 0 0 1px rgba(249,115,22,0.12);
}

canvas {
  width:100%;
  aspect-ratio:1 / 1;
  display:block;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:#0c0c17;
  box-shadow:inset 0 2px 12px rgba(0,0,0,0.55);
}

canvas.invincible {
  box-shadow:inset 0 2px 12px rgba(0,0,0,0.55), inset 0 0 24px rgba(249,115,22,0.08);
}

.overlay {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(6,6,12,0.6);
  border-radius:var(--radius-md);
  text-align:center;
}

.overlay.hidden {
  display:none;
}

.overlay-card {
  background:rgba(18,18,30,0.96);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:22px;
  max-width:400px;
  box-shadow:var(--shadow-1);
}

.overlay-card h2 {
  margin:0 0 8px;
  font-family:var(--font-display);
  font-size:1.8rem;
  color:var(--text);
}

.overlay-card p {
  color:var(--text-dim);
  line-height:1.6;
  font-size:0.95rem;
}

.overlay-card strong {
  font-family:var(--font-mono);
  color:var(--accent-text);
}

button {
  cursor:pointer;
  border:none;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  color:#fff;
  border-radius:var(--radius-sm);
  padding:11px 22px;
  font-family:var(--font-display);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.03em;
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:transform 0.18s ease, filter 0.18s ease;
}

button:hover {
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.flash-message {
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%, -50%);
  padding:12px 22px;
  border:1px solid var(--accent-border);
  border-radius:var(--radius-pill);
  background:rgba(12,12,23,0.92);
  color:var(--accent-text);
  font-family:var(--font-display);
  font-weight:600;
  letter-spacing:1px;
  opacity:0;
  pointer-events:none;
  box-shadow:0 8px 22px var(--accent-glow);
  transition:opacity 0.15s ease, transform 0.15s ease;
  z-index:3;
}

.flash-message.show {
  opacity:1;
  transform:translate(-50%, -60%) scale(1.05);
}

.target-hud {
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:min(88%, 340px);
  padding:8px 12px;
  border:1px solid var(--accent-border);
  border-radius:var(--radius-pill);
  background:rgba(8,8,16,0.88);
  z-index:3;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.2s ease;
}

.target-hud.visible {
  opacity:1;
}

.target-hud-label {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:6px;
  font-family:var(--font-display);
  font-size:0.72rem;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-dim);
}

.target-hud-label strong {
  font-family:var(--font-mono);
  color:var(--accent-text);
  letter-spacing:0;
  text-transform:none;
}

.target-bar {
  height:6px;
  border-radius:var(--radius-pill);
  background:rgba(255,255,255,0.08);
  overflow:hidden;
}

.target-bar-fill {
  height:100%;
  width:0%;
  border-radius:inherit;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow:0 0 10px var(--accent-glow);
  transition:width 0.22s ease;
}

.controls {
  margin-top:10px;
  text-align:center;
  color:var(--text-dim);
  font-size:0.85rem;
}

.footer {
  margin-top:10px;
  color:var(--text-faint);
  text-align:center;
  font-size:0.78rem;
}

@media (max-width:600px) {
  body {
    align-items:flex-start;
    overflow:auto;
  }

  .game-shell {
    padding:12px;
  }

  .top-bar {
    grid-template-columns:1fr;
    justify-items:center;
    gap:10px;
  }

  .top-spacer {
    display:none;
  }

  .game-logo {
    width:min(280px, 100%);
  }

  .arcade-link {
    justify-self:center;
  }
}
</style>
</head>

<body>
<div class="game-shell">

  <div class="top-bar">
    <div class="top-spacer" aria-hidden="true"></div>
    <img class="game-logo" src="lanedashlogo.png" alt="LaneDash logo">
    <a class="da-back arcade-link" href="../../index.html">Return to Arcade</a>
  </div>

  <div class="stats">
    <div class="stat" id="scoreStat">
      <span>Score</span>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <span>Best</span>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <span>Level</span>
      <strong id="level">1</strong>
    </div>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas" width="550" height="550"></canvas>

    <div class="target-hud" id="targetHud" aria-live="polite">
      <div class="target-hud-label">
        <span id="targetLabel">Reach 50 hops</span>
        <strong id="targetProgress">0 / 50</strong>
      </div>
      <div class="target-bar"><div class="target-bar-fill" id="targetBarFill"></div></div>
    </div>

    <div class="flash-message" id="flashMessage">LEVEL UP</div>

    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">LaneDash</h2>
        <p id="overlayText">
          Move forward to score. Dodge the traffic. Get greedy and you’ll get flattened.
        </p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>
  </div>

  <div class="controls">Arrow Keys or WASD · P to pause</div>

  <div class="footer">Created by JGDev</div>

  <div id="leaderboard"></div>

</div><script src="../../assets/leaderboard.js?v=6"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'lanedash', 'default');

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreStat = document.getElementById("scoreStat");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const levelEl = document.getElementById("level");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");
const flashMessage = document.getElementById("flashMessage");
const targetHud = document.getElementById("targetHud");
const targetLabel = document.getElementById("targetLabel");
const targetProgress = document.getElementById("targetProgress");
const targetBarFill = document.getElementById("targetBarFill");

const COLS = 11;
const SCORE_TARGET_STEP = 50;
const ROWS = 11;
const TILE = canvas.width / COLS;
const PLAYER_SCREEN_ROW = ROWS - 2;
const FORWARD_COOLDOWN = 105;
const LATERAL_COOLDOWN = 48;
const INVINCIBLE_MS = 165;
const SOFT_OPEN_HOPS = 14;

let player;
let lanes = [];
let cars = [];
let floaters = [];
let hopParticles = [];
let score = 0;
let best = Number(localStorage.getItem("lanedashBest")) || 0;
let level = 1;
let gameRunning = false;
let paused = false;
let animationId = null;
let lastMoveTime = 0;
let inputBuffer = null;
let screenShake = 0;
let nearMissCooldown = false;
let playerPop = 0;
let deathFlash = 0;
let deathFreeze = false;
let lastMove = "up";
let laneOffset = 0;
let invincibleUntil = 0;
let displayX = 0;
let lastFrame = 0;
let forwardStreak = 0;
let scoreTarget = SCORE_TARGET_STEP;

bestEl.textContent = best;

function nextScoreTarget(fromScore) {
  return Math.ceil((fromScore + 1) / SCORE_TARGET_STEP) * SCORE_TARGET_STEP;
}

function updateTargetHud() {
  if (!gameRunning || paused || deathFreeze) {
    targetHud.classList.remove("visible");
    return;
  }

  targetHud.classList.add("visible");
  const progress = Math.min(score, scoreTarget);
  const pct = scoreTarget > 0 ? (progress / scoreTarget) * 100 : 0;
  targetLabel.textContent = `Reach ${scoreTarget} hops`;
  targetProgress.textContent = `${score} / ${scoreTarget}`;
  targetBarFill.style.width = `${pct}%`;
}

function difficultyScale() {
  const ramp = Math.min(1, score / 55);
  const soft = score < SOFT_OPEN_HOPS ? 0.5 + score / SOFT_OPEN_HOPS * 0.35 : 1;
  return soft * (0.82 + ramp * 0.38);
}

function canMoveNow(dx, dy) {
  const now = performance.now();
  const cooldown = dy !== 0 ? FORWARD_COOLDOWN : LATERAL_COOLDOWN;
  return now - lastMoveTime >= cooldown;
}

function spawnFloater(text, x, y, color = "#fb923c") {
  floaters.push({ text, x, y, life: 1, color });
}

function spawnHopDust(x, y) {
  for (let i = 0; i < 6; i++) {
    hopParticles.push({
      x: x * TILE + TILE * 0.5,
      y: y * TILE + TILE * 0.72,
      vx: (Math.random() - 0.5) * 2.4,
      vy: -1.2 - Math.random() * 1.8,
      life: 1,
      size: 2 + Math.random() * 2.5
    });
  }
}

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function showFlash(text) {
  flashMessage.textContent = text;
  flashMessage.classList.add("show");

  setTimeout(() => {
    flashMessage.classList.remove("show");
  }, 650);
}

function pulseScore() {
  scoreStat.classList.remove("score-pop");
  void scoreStat.offsetWidth;
  scoreStat.classList.add("score-pop");
}

function createLane(worldY) {
  if (worldY === 0 || worldY % 5 === 0) {
    return {
      worldY,
      type:"safe",
      direction:0,
      speed:0,
      carCount:0
    };
  }

  const scale = difficultyScale();
  const tier = Math.floor(score / 20);

  return {
    worldY,
    type:"road",
    direction:randomChoice([-1, 1]),
    speed:(0.85 + Math.random() * 0.75 + tier * 0.09) * scale,
    carCount:Math.max(2, Math.round((2 + Math.random() * 1.2 + tier * 0.35) * scale))
  };
}

function buildStartingWorld() {
  lanes = [];
  cars = [];

  for (let i = 0; i < ROWS; i++) {
    const lane = createLane(i);
    lanes.push(lane);

    if (lane.type === "road") {
      spawnCarsFairly(lane);
    }
  }
}

function spawnCarsFairly(lane, protectCol = null) {
  const safeGapTiles = 3;
  const safeGapWidth = safeGapTiles * TILE;
  const laneWidth = canvas.width;
  const carCount = lane.carCount;
  const segmentWidth = laneWidth / carCount;

  let protectedGapStart = protectCol !== null
    ? protectCol * TILE
    : Math.floor(Math.random() * (COLS - safeGapTiles)) * TILE;
  const protectedGapEnd = protectedGapStart + safeGapWidth;

  for (let i = 0; i < carCount; i++) {
    const width = TILE * randomChoice([1.05, 1.2, 1.35]);
    let x = i * segmentWidth + Math.random() * (segmentWidth * 0.3);

    const overlapsProtectedGap =
      x < protectedGapEnd &&
      x + width > protectedGapStart;

    if (overlapsProtectedGap) {
      x += safeGapWidth + TILE * 0.4;

      if (x + width > laneWidth) {
        x = protectedGapStart - width - TILE * 0.5;
      }
    }

    cars.push({
      worldY:lane.worldY,
      x,
      width,
      height:TILE * 0.52,
      direction:lane.direction,
      speed:lane.speed * (0.94 + Math.random() * 0.12),
      color:randomChoice(["red", "yellow", "blue", "purple"])
    });
  }
}

function startGame() {
  paused = false;
  score = 0;
  level = 1;
  lastMoveTime = 0;
  inputBuffer = null;
  screenShake = 0;
  nearMissCooldown = false;
  playerPop = 0;
  deathFlash = 0;
  deathFreeze = false;
  lastMove = "up";
  laneOffset = 0;
  invincibleUntil = 0;
  forwardStreak = 0;
  scoreTarget = SCORE_TARGET_STEP;
  floaters = [];
  hopParticles = [];
  lastFrame = performance.now();

  player = {
    x:Math.floor(COLS / 2),
    worldY:0
  };
  displayX = player.x;

  buildStartingWorld();
  updateUI();

  overlayTitle.textContent = "LaneDash";
  overlayText.textContent = "Move forward to score. Dodge the traffic. Get greedy and you’ll get flattened.";
  startBtn.textContent = "Start Game";

  overlay.classList.add("hidden");
  gameRunning = true;

  cancelAnimationFrame(animationId);
  gameLoop();
}

function updateUI() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  levelEl.textContent = level;
  updateTargetHud();
}

function getScreenRow(worldY) {
  return PLAYER_SCREEN_ROW - (worldY - player.worldY);
}

function addNewLane() {
  const maxWorldY = Math.max(...lanes.map(lane => lane.worldY));
  const newLane = createLane(maxWorldY + 1);

  lanes.shift();
  lanes.push(newLane);

  cars = cars.filter(car => {
    const row = getScreenRow(car.worldY);
    return row >= -1 && row <= ROWS;
  });

  if (newLane.type === "road") {
    spawnCarsFairly(newLane);
  }
}

function queueMove(dx, dy) {
  if (!gameRunning || paused || deathFreeze) return;

  const newX = player.x + dx;
  if (dx !== 0 && (newX < 0 || newX >= COLS)) return;
  if (dy === 1 && player.worldY <= 0) return;

  if (!canMoveNow(dx, dy)) {
    inputBuffer = { dx, dy };
    return;
  }

  executeMove(dx, dy);
}

function executeMove(dx, dy) {
  if (!gameRunning || paused || deathFreeze) return;

  const newX = player.x + dx;
  if (dx !== 0 && (newX < 0 || newX >= COLS)) return;
  if (dy === 1 && player.worldY <= 0) return;

  lastMoveTime = performance.now();
  inputBuffer = null;

  if (dx === -1) lastMove = "left";
  if (dx === 1) lastMove = "right";
  if (dy === -1) lastMove = "up";
  if (dy === 1) lastMove = "down";

  if (dx !== 0) {
    player.x = newX;
    playerPop = 1;
  }

  if (dy === -1) {
    player.worldY++;
    score++;
    forwardStreak++;
    playerPop = 1.15;
    laneOffset = -TILE;
    invincibleUntil = performance.now() + INVINCIBLE_MS;
    pulseScore();
    spawnHopDust(player.x, PLAYER_SCREEN_ROW);
    spawnFloater("+1", player.x * TILE + TILE * 0.5, PLAYER_SCREEN_ROW * TILE + TILE * 0.35);
    if (forwardStreak >= 5 && forwardStreak % 5 === 0) {
      spawnFloater("STREAK " + forwardStreak, player.x * TILE + TILE * 0.5, PLAYER_SCREEN_ROW * TILE + TILE * 0.15, "#fbbf24");
    }

    const newLevel = 1 + Math.floor(score / 20);
    if (newLevel > level) {
      level = newLevel;
      showFlash("LEVEL " + level);
      screenShake = 4;
    }

    if (score >= scoreTarget) {
      showFlash("TARGET " + scoreTarget);
      scoreTarget = nextScoreTarget(score);
    }

    if (score > best) {
      best = score;
      localStorage.setItem("lanedashBest", best);
    }

    addNewLane();
  }

  if (dy === 1) {
    player.worldY--;
    forwardStreak = 0;
    playerPop = 0.85;
    laneOffset = TILE;
    invincibleUntil = performance.now() + INVINCIBLE_MS * 0.6;
    spawnHopDust(player.x, PLAYER_SCREEN_ROW);
  }

  updateUI();
  checkCollision();
}

function tryBufferedMove() {
  if (!inputBuffer || !gameRunning || paused || deathFreeze) return;
  const { dx, dy } = inputBuffer;
  if (!canMoveNow(dx, dy)) return;
  executeMove(dx, dy);
}

function updateCars(dt) {
  const scale = Math.min(2.2, dt / 16.67);
  cars.forEach(car => {
    car.x += car.speed * car.direction * scale;

    if (car.direction === 1 && car.x > canvas.width + TILE) {
      car.x = -car.width - Math.random() * 120;
    }

    if (car.direction === -1 && car.x < -car.width - TILE) {
      car.x = canvas.width + Math.random() * 120;
    }
  });
}

function rowY(row) {
  return row * TILE + laneOffset;
}

function getPlayerBox() {
  const px = (displayX + 0.5) * TILE;
  return {
    x:px - TILE * 0.24,
    y:rowY(PLAYER_SCREEN_ROW) + TILE * 0.2,
    w:TILE * 0.48,
    h:TILE * 0.56
  };
}

function checkNearMiss() {
  if (nearMissCooldown || deathFreeze) return;

  const p = getPlayerBox();

  for (const car of cars) {
    if (car.worldY !== player.worldY) continue;

    const carRow = getScreenRow(car.worldY);
    const c = {
      x:car.x + TILE * 0.04,
      y:rowY(carRow) + TILE * 0.26,
      w:car.width - TILE * 0.08,
      h:car.height - TILE * 0.06
    };

    const close =
      p.x < c.x + c.w + 12 &&
      p.x + p.w > c.x - 12 &&
      p.y < c.y + c.h + 6 &&
      p.y + p.h > c.y - 6;

    const hit =
      p.x < c.x + c.w &&
      p.x + p.w > c.x &&
      p.y < c.y + c.h &&
      p.y + p.h > c.y;

    if (close && !hit) {
      showFlash("CLOSE!");
      screenShake = 2;
      nearMissCooldown = true;

      setTimeout(() => {
        nearMissCooldown = false;
      }, 900);

      return;
    }
  }
}

function checkCollision() {
  if (deathFreeze || performance.now() < invincibleUntil) return;

  const p = getPlayerBox();

  for (const car of cars) {
    if (car.worldY !== player.worldY) continue;

    const carRow = getScreenRow(car.worldY);
    const c = {
      x:car.x + TILE * 0.06,
      y:rowY(carRow) + TILE * 0.28,
      w:car.width - TILE * 0.12,
      h:car.height - TILE * 0.08
    };

    const hit =
      p.x < c.x + c.w &&
      p.x + p.w > c.x &&
      p.y < c.y + c.h &&
      p.y + p.h > c.y;

    if (hit) {
      endGame();
      return;
    }
  }
}

function endGame() {
  if (deathFreeze) return;

  deathFreeze = true;
  deathFlash = 1;
  screenShake = 10;
  draw();

  setTimeout(() => {
    gameRunning = false;
    cancelAnimationFrame(animationId);
    targetHud.classList.remove("visible");

    overlayTitle.textContent = "Flattened.";
    overlayText.innerHTML = `
      Final score: <strong>${score}</strong><br>
      Best score: <strong>${best}</strong><br>
      Level reached: <strong>${level}</strong>
    `;
    startBtn.textContent = "Restart";
    overlay.classList.remove("hidden");
  }, 90);

  DeskArcadeLeaderboard.trySubmit('lanedash', score, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
}

function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, "#0a0a14");
  grad.addColorStop(1, "#0e0e1a");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  lanes.forEach(lane => {
    const row = getScreenRow(lane.worldY);
    if (row < -1 || row > ROWS) return;

    const y = rowY(row);

    if (lane.type === "safe") {
      ctx.fillStyle = row % 2 === 0 ? "#0f2418" : "#0c1f14";
      ctx.fillRect(0, y, canvas.width, TILE);
      ctx.fillStyle = "rgba(74,222,128,0.14)";
      ctx.fillRect(0, y + 2, canvas.width, TILE - 4);
      ctx.fillStyle = "rgba(74,222,128,0.28)";
      for (let i = 0; i < 7; i++) {
        ctx.fillRect((i * 73 + row * 11) % canvas.width, y + 10 + (i % 2) * 16, 8, 4);
      }
      ctx.strokeStyle = "rgba(74,222,128,0.42)";
      ctx.setLineDash([6, 10]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, y + TILE / 2);
      ctx.lineTo(canvas.width, y + TILE / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = "rgba(74,222,128,0.55)";
      ctx.lineWidth = 1;
      ctx.strokeRect(2, y + 2, canvas.width - 4, TILE - 4);
    } else {
      ctx.fillStyle = "#161622";
      ctx.fillRect(0, y, canvas.width, TILE);
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      ctx.fillRect(0, y, 6, TILE);
      ctx.fillRect(canvas.width - 6, y, 6, TILE);
      ctx.strokeStyle = "rgba(249,115,22,0.22)";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(0, y + TILE / 2);
      ctx.lineTo(canvas.width, y + TILE / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  });

  for (let col = 0; col <= COLS; col++) {
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.beginPath();
    ctx.moveTo(col * TILE, 0);
    ctx.lineTo(col * TILE, canvas.height);
    ctx.stroke();
  }
}

function roundRect(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCars() {
  cars.forEach(car => {
    const row = getScreenRow(car.worldY);

    if (row < -1 || row > ROWS) return;

    const y = rowY(row) + TILE * 0.24;
    const carHeight = car.height;
    const bodyRadius = 6;

    let fill = "#f43f5e";
    let glow = "rgba(244,63,94,0.5)";

    if (car.color === "yellow") {
      fill = "#fbbf24";
      glow = "rgba(251,191,36,0.45)";
    }

    if (car.color === "blue") {
      fill = "#38bdf8";
      glow = "rgba(56,189,248,0.45)";
    }

    if (car.color === "purple") {
      fill = "#a78bfa";
      glow = "rgba(167,139,250,0.45)";
    }

    ctx.save();

    // glow
    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;

    // main body
    ctx.fillStyle = fill;
    roundRect(ctx, car.x, y, car.width, carHeight, bodyRadius);
    ctx.fill();

    ctx.shadowBlur = 0;

    // darker inner body
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    roundRect(
      ctx,
      car.x + 4,
      y + 4,
      car.width - 8,
      carHeight - 8,
      Math.max(2, bodyRadius - 2)
    );
    ctx.fill();

    // windshield / cabin
    const cabinWidth = car.width * 0.34;
    const cabinHeight = carHeight * 0.38;
    const cabinX = car.direction === 1
      ? car.x + car.width * 0.5
      : car.x + car.width * 0.16;
    const cabinY = y + carHeight * 0.16;

    ctx.fillStyle = "rgba(220,245,255,0.85)";
    roundRect(ctx, cabinX, cabinY, cabinWidth, cabinHeight, 3);
    ctx.fill();

    // roof line
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    roundRect(
      ctx,
      car.x + 6,
      y + 5,
      car.width - 12,
      Math.max(4, carHeight * 0.12),
      3
    );
    ctx.fill();

    // headlights
    ctx.fillStyle = car.color === "yellow"
      ? "rgba(255,250,210,0.95)"
      : "rgba(255,245,200,0.95)";

    if (car.direction === 1) {
      roundRect(ctx, car.x + car.width - 5, y + 6, 3, 6, 1.5);
      ctx.fill();
      roundRect(ctx, car.x + car.width - 5, y + carHeight - 12, 3, 6, 1.5);
      ctx.fill();
    } else {
      roundRect(ctx, car.x + 2, y + 6, 3, 6, 1.5);
      ctx.fill();
      roundRect(ctx, car.x + 2, y + carHeight - 12, 3, 6, 1.5);
      ctx.fill();
    }

    // tail lights
    ctx.fillStyle = "rgba(255,70,70,0.8)";
    if (car.direction === 1) {
      roundRect(ctx, car.x + 2, y + 7, 2.5, 5, 1);
      ctx.fill();
      roundRect(ctx, car.x + 2, y + carHeight - 12, 2.5, 5, 1);
      ctx.fill();
    } else {
      roundRect(ctx, car.x + car.width - 4.5, y + 7, 2.5, 5, 1);
      ctx.fill();
      roundRect(ctx, car.x + car.width - 4.5, y + carHeight - 12, 2.5, 5, 1);
      ctx.fill();
    }

    // wheels
    ctx.fillStyle = "#111";
    roundRect(ctx, car.x + 7, y - 1, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + car.width - 15, y - 1, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + 7, y + carHeight - 2, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + car.width - 15, y + carHeight - 2, 8, 3, 1.5);
    ctx.fill();

    ctx.restore();
  });
}

function drawPlayer() {
  const popScale = 1 + playerPop * 0.1;
  const bounce = playerPop * 8;
  const invincible = performance.now() < invincibleUntil;
  const flicker = invincible ? (Math.sin(performance.now() * 0.04) > 0 ? 1 : 0.55) : 1;

  let tilt = 0;
  if (lastMove === "left") tilt = -0.18;
  if (lastMove === "right") tilt = 0.18;
  if (lastMove === "up") tilt = 0.06;
  if (lastMove === "down") tilt = -0.05;

  const centreX = (displayX + 0.5) * TILE;
  const centreY = rowY(PLAYER_SCREEN_ROW) + TILE * 0.5 - bounce;

  const bodyW = TILE * 0.36 * popScale;
  const bodyH = TILE * 0.34 * popScale;
  const headR = TILE * 0.16 * popScale;

  const headY = centreY - TILE * 0.22 * popScale;
  const bodyY = centreY + TILE * 0.06 * popScale;

  ctx.save();
  ctx.globalAlpha = flicker;

  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(centreX, centreY + TILE * 0.28, TILE * 0.22, TILE * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(centreX, centreY);
  ctx.rotate(tilt);
  ctx.translate(-centreX, -centreY);

  ctx.shadowColor = invincible ? "rgba(251,191,36,0.75)" : "rgba(249,115,22,0.7)";
  ctx.shadowBlur = invincible ? 22 : 18;

  ctx.strokeStyle = "#f97316";
  ctx.lineWidth = TILE * 0.07 * popScale;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(centreX - bodyW * 0.18, bodyY + bodyH * 0.35);
  ctx.lineTo(centreX - bodyW * 0.38, bodyY + bodyH * 0.7);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX + bodyW * 0.18, bodyY + bodyH * 0.35);
  ctx.lineTo(centreX + bodyW * 0.38, bodyY + bodyH * 0.7);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX - bodyW * 0.42, bodyY - bodyH * 0.05);
  ctx.lineTo(centreX - bodyW * 0.72, bodyY + bodyH * 0.18);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX + bodyW * 0.42, bodyY - bodyH * 0.05);
  ctx.lineTo(centreX + bodyW * 0.72, bodyY + bodyH * 0.18);
  ctx.stroke();

  ctx.fillStyle = "#f97316";
  ctx.fillRect(
    centreX - bodyW / 2,
    bodyY - bodyH / 2,
    bodyW,
    bodyH
  );

  ctx.beginPath();
  ctx.arc(centreX, headY, headR, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#0c0c17";
  ctx.fillRect(
    centreX - headR * 0.55,
    headY - headR * 0.15,
    headR * 1.1,
    headR * 0.28
  );

  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(
    centreX - headR * 0.45,
    headY - headR * 0.1,
    headR * 0.35,
    headR * 0.08
  );

  ctx.restore();
}

function drawDangerZone() {
  const lane = lanes.find(l => l.worldY === player.worldY);
  if (!lane || lane.type !== "road") return;

  const row = getScreenRow(player.worldY);
  const y = rowY(row);
  ctx.fillStyle = "rgba(239,68,68,0.08)";
  ctx.fillRect(0, y, canvas.width, TILE);
}

function drawHopParticles() {
  hopParticles.forEach(p => {
    ctx.fillStyle = `rgba(249,115,22,${p.life * 0.7})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
}

function drawFloaters() {
  floaters.forEach(f => {
    ctx.save();
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.font = `600 ${14 + (1 - f.life) * 4}px "Space Grotesk", sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y - (1 - f.life) * 22);
    ctx.restore();
  });
}

function drawDeathFlash() {
  if (deathFlash <= 0) return;

  ctx.fillStyle = `rgba(239,68,68,${deathFlash * 0.35})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function draw() {
  const shakeX = screenShake ? (Math.random() - 0.5) * screenShake : 0;
  const shakeY = screenShake ? (Math.random() - 0.5) * screenShake : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawDangerZone();
  drawCars();
  drawHopParticles();
  drawPlayer();
  drawFloaters();
  drawDeathFlash();

  ctx.restore();
}

function togglePause() {
  if (typeof DeskArcadeLeaderboard !== "undefined" && DeskArcadeLeaderboard.isModalOpen()) return;
  if (!gameRunning || deathFreeze) return;
  paused = !paused;
  if (paused) {
    inputBuffer = null;
    overlayTitle.textContent = "Paused";
    overlayText.textContent = "Press P to resume";
    overlay.classList.remove("hidden");
    targetHud.classList.remove("visible");
  } else {
    overlay.classList.add("hidden");
    updateTargetHud();
    lastFrame = performance.now();
    gameLoop();
  }
}

function gameLoop(now = performance.now()) {
  if (!gameRunning) return;

  const dt = Math.min(32, now - lastFrame || 16.67);
  lastFrame = now;

  if (paused) {
    draw();
    animationId = requestAnimationFrame(gameLoop);
    return;
  }

  displayX += (player.x - displayX) * Math.min(1, dt * 0.018);
  if (Math.abs(displayX - player.x) < 0.01) displayX = player.x;

  laneOffset += (0 - laneOffset) * Math.min(1, dt * 0.014);

  if (playerPop > 0) {
    playerPop *= Math.pow(0.68, dt / 16.67);
    if (playerPop < 0.04) playerPop = 0;
  }

  if (deathFlash > 0) {
    deathFlash *= Math.pow(0.7, dt / 16.67);
    if (deathFlash < 0.03) deathFlash = 0;
  }

  if (screenShake > 0) {
    screenShake *= Math.pow(0.82, dt / 16.67);
    if (screenShake < 0.35) screenShake = 0;
  }

  hopParticles = hopParticles.filter(p => {
    p.x += p.vx * (dt / 16.67);
    p.y += p.vy * (dt / 16.67);
    p.vy += 0.12 * (dt / 16.67);
    p.life -= 0.04 * (dt / 16.67);
    return p.life > 0;
  });

  floaters = floaters.filter(f => {
    f.life -= 0.028 * (dt / 16.67);
    return f.life > 0;
  });

  canvas.classList.toggle("invincible", performance.now() < invincibleUntil);

  if (!deathFreeze) {
    updateCars(dt);
    checkCollision();
    checkNearMiss();
    tryBufferedMove();
  }

  draw();
  animationId = requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", event => {
  if (typeof DeskArcadeLeaderboard !== "undefined" && DeskArcadeLeaderboard.isModalOpen()) return;

  if (event.key === "p" || event.key === "P" || event.key === "Escape") {
    if (gameRunning && !deathFreeze) {
      event.preventDefault();
      togglePause();
      return;
    }
  }

  if (paused || !gameRunning || deathFreeze) return;

  if (["ArrowUp", "w", "W"].includes(event.key)) {
    event.preventDefault();
    if (event.repeat) return;
    queueMove(0, -1);
  }

  if (["ArrowDown", "s", "S"].includes(event.key)) {
    event.preventDefault();
    if (event.repeat) return;
    queueMove(0, 1);
  }

  if (["ArrowLeft", "a", "A"].includes(event.key)) {
    event.preventDefault();
    queueMove(-1, 0);
  }

  if (["ArrowRight", "d", "D"].includes(event.key)) {
    event.preventDefault();
    queueMove(1, 0);
  }
});

startBtn.addEventListener("click", () => {
  if (!gameRunning) startGame();
});

player = {
  x:Math.floor(COLS / 2),
  worldY:0
};
displayX = player.x;
lastFrame = performance.now();

buildStartingWorld();
draw();
</script>
</body>
</html>
