<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaneDash | DeskArcade</title>

<style>
:root {
  --green:#8cff6a;
  --red:#ff6b4a;
  --yellow:#ffd86b;
  --blue:#7fdcff;
  --panel:rgba(7,24,8,0.94);
  --text-soft:#b9ffd2;
  --border-soft:rgba(140,255,106,0.35);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(140,255,106,0.14), transparent 35%),
    linear-gradient(180deg,#071106 0%,#020402 100%);
  color:var(--green);
  font-family:Consolas, Monaco, monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
  overflow:hidden;
}

.game-shell {
  width:min(860px, 100%);
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:18px;
  padding:14px 16px 16px;
  box-shadow:0 0 35px rgba(140,255,106,0.16);
}

.top-bar {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
  margin-bottom:12px;
}

.top-spacer {
  width:150px;
  height:1px;
}

.game-logo {
  width:min(320px, 100%);
  max-width:100%;
  display:block;
  justify-self:center;
  filter:
    drop-shadow(0 0 8px rgba(140,255,106,0.55))
    drop-shadow(0 0 18px rgba(140,255,106,0.5))
    drop-shadow(0 0 34px rgba(140,255,106,0.34))
    drop-shadow(0 0 14px rgba(255,216,107,0.22));
}

.arcade-link {
  justify-self:end;
  color:var(--green);
  text-decoration:none;
  border:1px solid var(--border-soft);
  padding:8px 14px;
  border-radius:999px;
  font-size:0.85rem;
  background:rgba(140,255,106,0.08);
  white-space:nowrap;
}

.arcade-link:hover {
  background:rgba(140,255,106,0.16);
}

.stats {
  display:flex;
  gap:10px;
  margin-bottom:8px;
}

.stat {
  flex:1;
  border:1px solid var(--border-soft);
  border-radius:12px;
  padding:8px;
  background:rgba(0,0,0,0.25);
  text-align:center;
}

.stat span {
  display:block;
  font-size:0.72rem;
  color:var(--text-soft);
}

.stat strong {
  display:inline-block;
  font-size:1.25rem;
}

.stat.score-pop strong {
  animation:scorePop 0.18s ease;
}

@keyframes scorePop {
  0% { transform:scale(1); }
  50% { transform:scale(1.18); }
  100% { transform:scale(1); }
}

.game-area {
  position:relative;
  width:min(500px, 100%);
  margin:0 auto;
}

canvas {
  width:100%;
  aspect-ratio:1 / 1;
  display:block;
  border:1px solid var(--border-soft);
  border-radius:16px;
  background:#031003;
  box-shadow:inset 0 0 25px rgba(140,255,106,0.12);
}

.overlay {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,0.55);
  border-radius:16px;
  text-align:center;
}

.overlay.hidden {
  display:none;
}

.overlay-card {
  background:rgba(7,24,8,0.96);
  border:1px solid var(--border-soft);
  border-radius:16px;
  padding:22px;
  max-width:400px;
  box-shadow:0 0 30px rgba(140,255,106,0.2);
}

.overlay-card h2 {
  margin:0 0 8px;
  font-size:1.8rem;
}

.overlay-card p {
  color:var(--text-soft);
  line-height:1.6;
  font-size:0.95rem;
}

.overlay-card strong {
  color:var(--green);
}

button {
  cursor:pointer;
  border:1px solid var(--green);
  background:rgba(140,255,106,0.12);
  color:var(--green);
  border-radius:999px;
  padding:10px 20px;
  font-family:inherit;
  font-weight:bold;
  box-shadow:0 0 14px rgba(140,255,106,0.2);
}

button:hover {
  background:rgba(140,255,106,0.22);
}

.flash-message {
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%, -50%);
  padding:12px 22px;
  border:1px solid var(--green);
  border-radius:999px;
  background:rgba(7,24,8,0.92);
  color:var(--green);
  font-weight:bold;
  letter-spacing:1px;
  opacity:0;
  pointer-events:none;
  box-shadow:0 0 25px rgba(140,255,106,0.35);
  transition:opacity 0.15s ease, transform 0.15s ease;
  z-index:3;
}

.flash-message.show {
  opacity:1;
  transform:translate(-50%, -60%) scale(1.05);
}

.controls {
  margin-top:10px;
  text-align:center;
  color:var(--text-soft);
  font-size:0.85rem;
}

.footer {
  margin-top:10px;
  color:var(--text-soft);
  text-align:center;
  font-size:0.78rem;
}

@media (max-width:600px) {
  body {
    align-items:flex-start;
    overflow:auto;
  }

  .game-shell {
    padding:12px;
  }

  .top-bar {
    grid-template-columns:1fr;
    justify-items:center;
    gap:10px;
  }

  .top-spacer {
    display:none;
  }

  .game-logo {
    width:min(280px, 100%);
  }

  .arcade-link {
    justify-self:center;
  }
}
</style>
</head>

<body>
<div class="game-shell">

  <div class="top-bar">
    <div class="top-spacer" aria-hidden="true"></div>
    <img class="game-logo" src="lanedashlogo.png" alt="LaneDash logo">
    <a class="arcade-link" href="../../index.html">Return to Arcade</a>
  </div>

  <div class="stats">
    <div class="stat" id="scoreStat">
      <span>Score</span>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <span>Best</span>
      <strong id="best">0</strong>
    </div>
    <div class="stat">
      <span>Level</span>
      <strong id="level">1</strong>
    </div>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas" width="550" height="550"></canvas>

    <div class="flash-message" id="flashMessage">LEVEL UP</div>

    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <h2 id="overlayTitle">LaneDash</h2>
        <p id="overlayText">
          Move forward to score. Dodge the traffic. Get greedy and you’ll get flattened.
        </p>
        <button id="startBtn">Start Game</button>
      </div>
    </div>
  </div>

  <div class="controls">Use Arrow Keys or WASD.</div>

  <div class="footer">Created by Jason / build v1.6</div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreStat = document.getElementById("scoreStat");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const levelEl = document.getElementById("level");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");
const flashMessage = document.getElementById("flashMessage");

const COLS = 11;
const ROWS = 11;
const TILE = canvas.width / COLS;
const PLAYER_SCREEN_ROW = ROWS - 2;

let player;
let lanes = [];
let cars = [];
let score = 0;
let best = Number(localStorage.getItem("lanedashBest")) || 0;
let level = 1;
let gameRunning = false;
let animationId = null;
let moveLocked = false;
let screenShake = 0;
let nearMissCooldown = false;
let playerPop = 0;
let deathFlash = 0;
let deathFreeze = false;
let lastMove = "up";

bestEl.textContent = best;

function randomChoice(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function showFlash(text) {
  flashMessage.textContent = text;
  flashMessage.classList.add("show");

  setTimeout(() => {
    flashMessage.classList.remove("show");
  }, 650);
}

function pulseScore() {
  scoreStat.classList.remove("score-pop");
  void scoreStat.offsetWidth;
  scoreStat.classList.add("score-pop");
}

function createLane(worldY) {
  if (worldY === 0 || worldY % 5 === 0) {
    return {
      worldY,
      type:"safe",
      direction:0,
      speed:0,
      carCount:0
    };
  }

  const difficultyBoost = level - 1;

  return {
    worldY,
    type:"road",
    direction:randomChoice([-1, 1]),
    speed:1.1 + Math.random() * 1.15 + difficultyBoost * 0.16,
    carCount:2 + Math.floor(Math.random() * 2) + Math.min(2, Math.floor(difficultyBoost / 2))
  };
}

function buildStartingWorld() {
  lanes = [];
  cars = [];

  for (let i = 0; i < ROWS; i++) {
    const lane = createLane(i);
    lanes.push(lane);

    if (lane.type === "road") {
      spawnCarsFairly(lane);
    }
  }
}

function spawnCarsFairly(lane) {
  const safeGapTiles = 2;
  const safeGapWidth = safeGapTiles * TILE;
  const laneWidth = canvas.width;
  const carCount = lane.carCount;
  const segmentWidth = laneWidth / carCount;

  const protectedGapStart = Math.floor(Math.random() * (COLS - safeGapTiles)) * TILE;
  const protectedGapEnd = protectedGapStart + safeGapWidth;

  for (let i = 0; i < carCount; i++) {
    const width = TILE * randomChoice([1.1, 1.25, 1.45]);
    let x = i * segmentWidth + Math.random() * (segmentWidth * 0.35);

    const overlapsProtectedGap =
      x < protectedGapEnd &&
      x + width > protectedGapStart;

    if (overlapsProtectedGap) {
      x += safeGapWidth + TILE * 0.5;

      if (x + width > laneWidth) {
        x = protectedGapStart - width - TILE * 0.6;
      }
    }

    cars.push({
      worldY:lane.worldY,
      x,
      width,
      height:TILE * 0.55,
      direction:lane.direction,
      speed:lane.speed * (0.92 + Math.random() * 0.16),
      color:randomChoice(["red", "yellow", "blue"])
    });
  }
}

function startGame() {
  score = 0;
  level = 1;
  moveLocked = false;
  screenShake = 0;
  nearMissCooldown = false;
  playerPop = 0;
  deathFlash = 0;
  deathFreeze = false;
  lastMove = "up";

  player = {
    x:Math.floor(COLS / 2),
    worldY:0
  };

  buildStartingWorld();
  updateUI();

  overlayTitle.textContent = "LaneDash";
  overlayText.textContent = "Move forward to score. Dodge the traffic. Get greedy and you’ll get flattened.";
  startBtn.textContent = "Start Game";

  overlay.classList.add("hidden");
  gameRunning = true;

  cancelAnimationFrame(animationId);
  gameLoop();
}

function updateUI() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  levelEl.textContent = level;
}

function getScreenRow(worldY) {
  return PLAYER_SCREEN_ROW - (worldY - player.worldY);
}

function addNewLane() {
  const maxWorldY = Math.max(...lanes.map(lane => lane.worldY));
  const newLane = createLane(maxWorldY + 1);

  lanes.shift();
  lanes.push(newLane);

  cars = cars.filter(car => {
    const row = getScreenRow(car.worldY);
    return row >= -1 && row <= ROWS;
  });

  if (newLane.type === "road") {
    spawnCarsFairly(newLane);
  }
}

function attemptMove(dx, dy) {
  if (!gameRunning || moveLocked || deathFreeze) return;

  const newX = player.x + dx;

  if (newX < 0 || newX >= COLS) return;

  if (dx === -1) lastMove = "left";
  if (dx === 1) lastMove = "right";
  if (dy === -1) lastMove = "up";
  if (dy === 1) lastMove = "down";

  moveLocked = true;
  setTimeout(() => {
    moveLocked = false;
  }, 95);

  if (dx !== 0) {
    player.x = newX;
    playerPop = 1;
  }

  if (dy === -1) {
    player.worldY++;
    score++;
    playerPop = 1;
    pulseScore();

    const newLevel = 1 + Math.floor(score / 20);

    if (newLevel > level) {
      level = newLevel;
      showFlash("LEVEL " + level);
      screenShake = 7;
    }

    if (score > best) {
      best = score;
      localStorage.setItem("lanedashBest", best);
    }

    addNewLane();
  }

  if (dy === 1 && player.worldY > 0) {
    player.worldY--;
    playerPop = 1;
  }

  updateUI();
  checkCollision();
}

function updateCars() {
  cars.forEach(car => {
    car.x += car.speed * car.direction;

    if (car.direction === 1 && car.x > canvas.width + TILE) {
      car.x = -car.width - Math.random() * 160;
    }

    if (car.direction === -1 && car.x < -car.width - TILE) {
      car.x = canvas.width + Math.random() * 160;
    }
  });
}

function getPlayerBox() {
  return {
    x:player.x * TILE + TILE * 0.22,
    y:PLAYER_SCREEN_ROW * TILE + TILE * 0.18,
    w:TILE * 0.56,
    h:TILE * 0.64
  };
}

function checkNearMiss() {
  if (nearMissCooldown || deathFreeze) return;

  const p = getPlayerBox();

  for (const car of cars) {
    if (car.worldY !== player.worldY) continue;

    const carRow = getScreenRow(car.worldY);
    const c = {
      x:car.x,
      y:carRow * TILE + TILE * 0.24,
      w:car.width,
      h:car.height
    };

    const close =
      p.x < c.x + c.w + 10 &&
      p.x + p.w > c.x - 10 &&
      p.y < c.y + c.h + 8 &&
      p.y + p.h > c.y - 8;

    const hit =
      p.x < c.x + c.w &&
      p.x + p.w > c.x &&
      p.y < c.y + c.h &&
      p.y + p.h > c.y;

    if (close && !hit) {
      showFlash("NEAR MISS");
      screenShake = 5;
      nearMissCooldown = true;

      setTimeout(() => {
        nearMissCooldown = false;
      }, 900);

      return;
    }
  }
}

function checkCollision() {
  if (deathFreeze) return;

  const p = getPlayerBox();

  for (const car of cars) {
    if (car.worldY !== player.worldY) continue;

    const carRow = getScreenRow(car.worldY);
    const c = {
      x:car.x,
      y:carRow * TILE + TILE * 0.24,
      w:car.width,
      h:car.height
    };

    const hit =
      p.x < c.x + c.w &&
      p.x + p.w > c.x &&
      p.y < c.y + c.h &&
      p.y + p.h > c.y;

    if (hit) {
      endGame();
      return;
    }
  }
}

function endGame() {
  if (deathFreeze) return;

  deathFreeze = true;
  deathFlash = 1;
  screenShake = 10;
  draw();

  setTimeout(() => {
    gameRunning = false;
    cancelAnimationFrame(animationId);

    overlayTitle.textContent = "Flattened.";
    overlayText.innerHTML = `
      Final score: <strong>${score}</strong><br>
      Best score: <strong>${best}</strong><br>
      Level reached: <strong>${level}</strong>
    `;
    startBtn.textContent = "Restart";
    overlay.classList.remove("hidden");
  }, 90);
}

function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  lanes.forEach(lane => {
    const row = getScreenRow(lane.worldY);

    if (row < -1 || row > ROWS) return;

    const y = row * TILE;

    ctx.fillStyle = lane.type === "safe"
      ? (row % 2 === 0 ? "#052007" : "#06270a")
      : "#101510";

    ctx.fillRect(0, y, canvas.width, TILE);

    ctx.strokeStyle = "rgba(140,255,106,0.12)";
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();

    if (lane.type === "road") {
      ctx.strokeStyle = "rgba(255,216,107,0.28)";
      ctx.setLineDash([14, 14]);
      ctx.beginPath();
      ctx.moveTo(0, y + TILE / 2);
      ctx.lineTo(canvas.width, y + TILE / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  for (let col = 0; col <= COLS; col++) {
    ctx.strokeStyle = "rgba(140,255,106,0.06)";
    ctx.beginPath();
    ctx.moveTo(col * TILE, 0);
    ctx.lineTo(col * TILE, canvas.height);
    ctx.stroke();
  }
}

function roundRect(ctx, x, y, width, height, radius) {
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCars() {
  cars.forEach(car => {
    const row = getScreenRow(car.worldY);

    if (row < -1 || row > ROWS) return;

    const y = row * TILE + TILE * 0.24;
    const carHeight = car.height;
    const bodyRadius = 6;

    let fill = "#ff6b4a";
    let glow = "rgba(255,107,74,0.55)";

    if (car.color === "yellow") {
      fill = "#ffd86b";
      glow = "rgba(255,216,107,0.5)";
    }

    if (car.color === "blue") {
      fill = "#7fdcff";
      glow = "rgba(127,220,255,0.5)";
    }

    ctx.save();

    // glow
    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;

    // main body
    ctx.fillStyle = fill;
    roundRect(ctx, car.x, y, car.width, carHeight, bodyRadius);
    ctx.fill();

    ctx.shadowBlur = 0;

    // darker inner body
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    roundRect(
      ctx,
      car.x + 4,
      y + 4,
      car.width - 8,
      carHeight - 8,
      Math.max(2, bodyRadius - 2)
    );
    ctx.fill();

    // windshield / cabin
    const cabinWidth = car.width * 0.34;
    const cabinHeight = carHeight * 0.38;
    const cabinX = car.direction === 1
      ? car.x + car.width * 0.5
      : car.x + car.width * 0.16;
    const cabinY = y + carHeight * 0.16;

    ctx.fillStyle = "rgba(220,245,255,0.85)";
    roundRect(ctx, cabinX, cabinY, cabinWidth, cabinHeight, 3);
    ctx.fill();

    // roof line
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    roundRect(
      ctx,
      car.x + 6,
      y + 5,
      car.width - 12,
      Math.max(4, carHeight * 0.12),
      3
    );
    ctx.fill();

    // headlights
    ctx.fillStyle = car.color === "yellow"
      ? "rgba(255,250,210,0.95)"
      : "rgba(255,245,200,0.95)";

    if (car.direction === 1) {
      roundRect(ctx, car.x + car.width - 5, y + 6, 3, 6, 1.5);
      ctx.fill();
      roundRect(ctx, car.x + car.width - 5, y + carHeight - 12, 3, 6, 1.5);
      ctx.fill();
    } else {
      roundRect(ctx, car.x + 2, y + 6, 3, 6, 1.5);
      ctx.fill();
      roundRect(ctx, car.x + 2, y + carHeight - 12, 3, 6, 1.5);
      ctx.fill();
    }

    // tail lights
    ctx.fillStyle = "rgba(255,70,70,0.8)";
    if (car.direction === 1) {
      roundRect(ctx, car.x + 2, y + 7, 2.5, 5, 1);
      ctx.fill();
      roundRect(ctx, car.x + 2, y + carHeight - 12, 2.5, 5, 1);
      ctx.fill();
    } else {
      roundRect(ctx, car.x + car.width - 4.5, y + 7, 2.5, 5, 1);
      ctx.fill();
      roundRect(ctx, car.x + car.width - 4.5, y + carHeight - 12, 2.5, 5, 1);
      ctx.fill();
    }

    // wheels
    ctx.fillStyle = "#111";
    roundRect(ctx, car.x + 7, y - 1, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + car.width - 15, y - 1, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + 7, y + carHeight - 2, 8, 3, 1.5);
    ctx.fill();
    roundRect(ctx, car.x + car.width - 15, y + carHeight - 2, 8, 3, 1.5);
    ctx.fill();

    ctx.restore();
  });
}

function drawPlayer() {
  const popScale = 1 + playerPop * 0.08;
  const bounce = playerPop * 6;

  let tilt = 0;
  if (lastMove === "left") tilt = -0.15;
  if (lastMove === "right") tilt = 0.15;
  if (lastMove === "up") tilt = 0.05;
  if (lastMove === "down") tilt = -0.04;

  const centreX = player.x * TILE + TILE * 0.5;
  const centreY = PLAYER_SCREEN_ROW * TILE + TILE * 0.5 - bounce;

  const bodyW = TILE * 0.36 * popScale;
  const bodyH = TILE * 0.34 * popScale;
  const headR = TILE * 0.16 * popScale;

  const headY = centreY - TILE * 0.22 * popScale;
  const bodyY = centreY + TILE * 0.06 * popScale;

  ctx.save();

  ctx.translate(centreX, centreY);
  ctx.rotate(tilt);
  ctx.translate(-centreX, -centreY);

  ctx.shadowColor = "rgba(140,255,106,0.85)";
  ctx.shadowBlur = 18;

  ctx.strokeStyle = "#8cff6a";
  ctx.lineWidth = TILE * 0.07 * popScale;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(centreX - bodyW * 0.18, bodyY + bodyH * 0.35);
  ctx.lineTo(centreX - bodyW * 0.38, bodyY + bodyH * 0.7);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX + bodyW * 0.18, bodyY + bodyH * 0.35);
  ctx.lineTo(centreX + bodyW * 0.38, bodyY + bodyH * 0.7);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX - bodyW * 0.42, bodyY - bodyH * 0.05);
  ctx.lineTo(centreX - bodyW * 0.72, bodyY + bodyH * 0.18);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(centreX + bodyW * 0.42, bodyY - bodyH * 0.05);
  ctx.lineTo(centreX + bodyW * 0.72, bodyY + bodyH * 0.18);
  ctx.stroke();

  ctx.fillStyle = "#8cff6a";
  ctx.fillRect(
    centreX - bodyW / 2,
    bodyY - bodyH / 2,
    bodyW,
    bodyH
  );

  ctx.beginPath();
  ctx.arc(centreX, headY, headR, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#020402";
  ctx.fillRect(
    centreX - headR * 0.55,
    headY - headR * 0.15,
    headR * 1.1,
    headR * 0.28
  );

  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(
    centreX - headR * 0.45,
    headY - headR * 0.1,
    headR * 0.35,
    headR * 0.08
  );

  ctx.restore();
}

function drawDangerZone() {
  ctx.fillStyle = "rgba(255,107,74,0.1)";
  ctx.fillRect(0, (ROWS - 1) * TILE, canvas.width, TILE);
}

function drawDeathFlash() {
  if (deathFlash <= 0) return;

  ctx.fillStyle = `rgba(255,107,74,${deathFlash * 0.35})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function draw() {
  const shakeX = screenShake ? (Math.random() - 0.5) * screenShake : 0;
  const shakeY = screenShake ? (Math.random() - 0.5) * screenShake : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();
  drawDangerZone();
  drawCars();
  drawPlayer();
  drawDeathFlash();

  ctx.restore();
}

function gameLoop() {
  if (!gameRunning) return;

  if (playerPop > 0) {
    playerPop *= 0.72;
    if (playerPop < 0.05) playerPop = 0;
  }

  if (deathFlash > 0) {
    deathFlash *= 0.7;
    if (deathFlash < 0.03) deathFlash = 0;
  }

  if (screenShake > 0) {
    screenShake *= 0.82;
    if (screenShake < 0.4) screenShake = 0;
  }

  if (!deathFreeze) {
    updateCars();
    checkCollision();
    checkNearMiss();
  }

  draw();
  animationId = requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", event => {
  if (["ArrowUp", "w", "W"].includes(event.key)) {
    event.preventDefault();
    attemptMove(0, -1);
  }

  if (["ArrowDown", "s", "S"].includes(event.key)) {
    event.preventDefault();
    attemptMove(0, 1);
  }

  if (["ArrowLeft", "a", "A"].includes(event.key)) {
    event.preventDefault();
    attemptMove(-1, 0);
  }

  if (["ArrowRight", "d", "D"].includes(event.key)) {
    event.preventDefault();
    attemptMove(1, 0);
  }
});

startBtn.addEventListener("click", () => {
  if (!gameRunning) startGame();
});

player = {
  x:Math.floor(COLS / 2),
  worldY:0
};

buildStartingWorld();
draw();
</script>
</body>
</html>
