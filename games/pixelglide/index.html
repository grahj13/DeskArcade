<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pixel Glide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">
  <style>
    :root {
      --accent: #6366f1;
      --accent-2: #818cf8;
      --danger: #ef4444;
      --gold: #f59e0b;
      --cyan: #38bdf8;
      --purple: #a78bfa;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 12px;
    }

    .shell {
      position: relative;
      width: min(96vw, 720px);
      max-height: 96vh;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand {
      min-width: 0;
    }

    .logo {
      height: 44px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      display: block;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
    }

    .brand p {
      margin: 0;
      color: var(--text-dim);
      font-size: 0.75rem;
    }

    .brand .da-back {
      margin-top: 8px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .top-right {
      display: flex;
      align-items: stretch;
      gap: 8px;
      flex-shrink: 0;
    }

    .score-card {
      min-width: 92px;
      padding: 8px 10px;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }

    .score-card div:first-child {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    .score-card div:last-child {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      color: var(--accent-text);
      font-weight: 700;
    }

    button.icon-btn {
      width: 42px;
      min-height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    button.icon-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    button.icon-btn.sound-off {
      opacity: 0.35;
      font-size: 0.82rem;
    }

    button.icon-btn.sound-off:hover {
      opacity: 0.65;
    }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: #0c0c17;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(96vh - 190px);
      min-height: 280px;
      background: #0c0c17;
      cursor: pointer;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
      pointer-events: none;
    }

    .panel {
      width: min(92%, 405px);
      max-height: calc(100% - 20px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 18px 16px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: rgba(12, 12, 23, 0.92);
      box-shadow: var(--shadow-1);
      backdrop-filter: blur(8px);
      scrollbar-width: thin;
      pointer-events: auto;
    }

    .panel::-webkit-scrollbar {
      width: 8px;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 99px;
    }

    .menu-logo {
      height: 44px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
    }

    .panel h2 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: clamp(1.25rem, 5vw, 1.85rem);
    }

    .panel p {
      margin: 7px 0;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .tiny {
      font-size: 0.72rem !important;
      color: var(--text-dim);
    }

    .kbd {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text);
      background: rgba(255,255,255,.08);
      font-family: var(--font-mono);
    }

    .statline { color: var(--gold); font-family: var(--font-mono); }
    .unlock { color: var(--cyan); }

    .skin-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
      margin: 10px 0 8px;
    }

    .skin-tile {
      padding: 6px 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 0.66rem;
      line-height: 1.15;
      min-height: 55px;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .skin-tile:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .skin-tile.active {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .skin-tile.locked {
      opacity: .38;
    }

    .skin-icon {
      display: block;
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-faint);
    }

    .pulse {
      margin-top: 10px;
      color: var(--accent-text);
      font-family: var(--font-display);
      font-weight: 600;
      animation: pulse 0.9s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: .45; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-height: 760px) {
      body { padding: 6px; }
      .shell { padding: 8px; }
      header { margin-bottom: 6px; }
      .logo { height: 36px; margin-bottom: 3px; }
      .brand p { font-size: .68rem; }
      .footer { display: none; }
      canvas { max-height: calc(100vh - 132px); min-height: 330px; }
      .overlay { padding: 10px; }
      .panel { padding: 13px 12px; max-height: calc(100% - 12px); }
      .menu-logo { height: 36px; margin-bottom: 6px; }
      .panel h2 { font-size: 1.35rem; margin-bottom: 5px; }
      .panel p { margin: 5px 0; font-size: .78rem; }
      .skin-grid { gap: 5px; margin: 7px 0; }
      .skin-tile { min-height: 47px; padding: 5px 4px; font-size: .58rem; }
      .skin-icon { font-size: .86rem; margin-bottom: 1px; }
    }

    @media (max-width: 430px) {
      .top-right { gap: 5px; }
      button.icon-btn { width: 38px; min-height: 38px; }
      .score-card { min-width: 76px; padding: 7px 8px; }
      .logo { height: 36px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <img src="pixelglidelogo.png" alt="Pixel Glide logo" class="logo">
        <p>Thread the gaps. Don’t clip the code.</p>
        <a class="da-back" href="../../index.html">Back to Arcade</a>
      </div>
      <div class="top-right">
        <button class="icon-btn" id="soundBtn" title="Sound on/off">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="Pause">Ⅱ</button>
        <div class="score-card" aria-live="polite"><div>BEST</div><div id="bestScore">0</div></div>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="640" height="360" aria-label="Pixel Glide game canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel" id="panel">
          <img src="pixelglidelogo.png" alt="Pixel Glide" class="menu-logo">
          <h2>Ready?</h2>
          <p>Tap, click, or press <span class="kbd">Space</span> to glide upward.</p>
          <p>Thread the gaps — desk break ends at 18 points or 75 seconds.</p>
          <p class="tiny"><span class="kbd">P</span> pause · <span class="kbd">M</span> sound · <span class="kbd">S</span> skin · <span class="kbd">T</span> theme</p>
          <p class="pulse">Press to start</p>
        </div>
      </div>
    </section>

    <div class="footer"><span>Created by JGDev</span></div>

    <div id="leaderboard"></div>
  </main>  <script src="../../assets/leaderboard.js?v=5"></script>
  <script>
    (() => {
      const lbPanel = document.getElementById('leaderboard');
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'pixelglide', 'default');

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const overlay = document.getElementById('overlay');
      const panel = document.getElementById('panel');
      const bestScoreEl = document.getElementById('bestScore');
      const soundBtn = document.getElementById('soundBtn');
      const pauseBtn = document.getElementById('pauseBtn');

      const W = canvas.width;
      const H = canvas.height;
      const groundH = 48;
      const TARGET_FPS = 60;
      const MIN_GATE_SPACING = 290;
      const COLLISION_PAD = 5;
      const SPAWN_INVINC_MS = 900;
      let lastFrameTime = performance.now();
      let shakePhase = 0;

      const keys = {
        best: 'pixelGlideBest',
        skin: 'pixelGlideSkin',
        sound: 'pixelGlideSound',
        theme: 'pixelGlideTheme',
        deaths: 'pgDeaths',
        score: 'pgScore',
        near: 'pgNear',
        combo: 'pgCombo'
      };

      let best = Number(localStorage.getItem(keys.best) || 0);
      let soundOn = localStorage.getItem(keys.sound) === 'on';
      let audioCtx = null;

      const DESK_BREAK_SCORE = 18;
      const DESK_BREAK_SEC = 75;
      let sessionStart = 0;

      const skins = [
        { name: 'Gold Finch', body: '#f59e0b', wing: '#6366f1', beak: '#ef4444', unlock: 0, type: 'bird' },
        { name: 'Cyan Byte', body: '#38bdf8', wing: '#f4f4f8', beak: '#f59e0b', unlock: 10, type: 'bird' },
        { name: 'Void Bat', body: '#a78bfa', wing: '#6366f1', beak: '#38bdf8', unlock: 20, type: 'bat' },
        { name: 'Redline', body: '#f43f5e', wing: '#f59e0b', beak: '#f4f4f8', unlock: 35, type: 'bird' },
        { name: 'Ghost Cube', body: '#f4f4f8', wing: '#38bdf8', beak: '#6366f1', unlock: 50, type: 'cube' },
        { name: 'Nano Drone', body: '#38bdf8', wing: '#a78bfa', beak: '#f59e0b', unlock: 65, type: 'drone' },
        { name: 'Toxic Bug', body: '#34d399', wing: '#f43f5e', beak: '#f59e0b', unlock: 80, type: 'bug' },
        { name: 'Cyber Rocket', body: '#ef4444', wing: '#38bdf8', beak: '#ffffff', unlock: 100, type: 'rocket' }
      ];

      const themes = [
        { name: 'Neon Grid', top: '#15152b', mid: '#0c0c17', bottom: '#08080f' },
        { name: 'Synthwave', top: '#2a0f3f', mid: '#1a1030', bottom: '#09030f' },
        { name: 'Toxic Reactor', top: '#0a2e2a', mid: '#08171a', bottom: '#04090c' },
        { name: 'Frozen Core', top: '#10293a', mid: '#08111c', bottom: '#02060b' }
      ];

      const stats = {
        totalDeaths: Number(localStorage.getItem(keys.deaths) || 0),
        totalScore: Number(localStorage.getItem(keys.score) || 0),
        totalNear: Number(localStorage.getItem(keys.near) || 0),
        bestCombo: Number(localStorage.getItem(keys.combo) || 0)
      };

      const achievements = [
        { id: 'score10', name: 'Thread The Needle', check: () => best >= 10 },
        { id: 'score25', name: 'System Survivor', check: () => best >= 25 },
        { id: 'combo5', name: 'Combo King', check: () => stats.bestCombo >= 5 },
        { id: 'near20', name: 'Risk Taker', check: () => stats.totalNear >= 20 }
      ];

      let skinIndex = Math.min(Number(localStorage.getItem(keys.skin) || 0), skins.length - 1);
      let themeIndex = Math.min(Number(localStorage.getItem(keys.theme) || 0), themes.length - 1);

      const state = {
        mode: 'ready',
        score: 0,
        frame: 0,
        speed: 2.75,
        shake: 0,
        flash: 0,
        combo: 0,
        runBestCombo: 0,
        comboTimer: 0,
        nearMisses: 0,
        gates: [],
        particles: [],
        stars: [],
        clouds: [],
        message: '',
        messageTimer: 0
      };

      const player = {
        x: Math.round(W * 0.22),
        y: H * 0.43,
        r: 15,
        hitR: 11,
        vy: 0,
        gravity: 0.34,
        lift: -6.65,
        rot: 0
      };

      bestScoreEl.textContent = best;
      function syncSoundBtn() {
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
        soundBtn.title = soundOn ? 'Sound on' : 'Sound off — click to enable';
        soundBtn.classList.toggle('sound-off', !soundOn);
      }
      syncSoundBtn();

      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      let lastBeepAt = 0;
      function beep(freq = 440, dur = 0.08, type = 'square', gain = 0.03) {
        if (!soundOn) return;
        const now = performance.now();
        if (now - lastBeepAt < 45) return;
        lastBeepAt = now;
        try {
          audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          g.gain.value = gain;
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start();
          g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function resetSky() {
        state.stars = Array.from({ length: 70 }, () => ({
          x: rand(0, W),
          y: rand(0, H - groundH),
          s: rand(0.5, 2.2),
          a: rand(0.18, 0.85)
        }));
        state.clouds = Array.from({ length: 6 }, () => ({
          x: rand(0, W),
          y: rand(55, H * 0.55),
          w: rand(45, 105),
          a: rand(0.04, 0.1)
        }));
      }

      function unlockedCount() {
        return skins.filter(s => best >= s.unlock).length;
      }

      function skinIcon(skin) {
        if (skin.type === 'bird') return '🐦';
        if (skin.type === 'bat') return '🦇';
        if (skin.type === 'cube') return '◼';
        if (skin.type === 'drone') return '✣';
        if (skin.type === 'bug') return '🐞';
        if (skin.type === 'rocket') return '🚀';
        return '◆';
      }

      function skinMenuHtml() {
        return `<div class="skin-grid">${skins.map((skin, index) => {
          const locked = best < skin.unlock;
          const active = index === skinIndex;
          return `<div class="skin-tile ${active ? 'active' : ''} ${locked ? 'locked' : ''}">
            <span class="skin-icon">${skinIcon(skin)}</span>
            <strong>${skin.name}</strong><br>
            ${locked ? `Unlock ${skin.unlock}` : active ? 'Selected' : 'Unlocked'}
          </div>`;
        }).join('')}</div>`;
      }

      function achievementHtml() {
        return `<div class="skin-grid">${achievements.map(a => {
          const unlocked = a.check();
          return `<div class="skin-tile ${unlocked ? 'active' : 'locked'}">
            <span class="skin-icon">${unlocked ? '🏆' : '🔒'}</span>
            <strong>${a.name}</strong>
          </div>`;
        }).join('')}</div>`;
      }

      function showOverlay(title, body, pulse = 'Press to start') {
        panel.innerHTML = `<img src="pixelglidelogo.png" alt="Pixel Glide" class="menu-logo"><h2>${title}</h2>${body}<p class="pulse">${pulse}</p>`;
        overlay.style.display = 'grid';
        panel.scrollTop = 0;
      }

      function hideOverlay() {
        overlay.style.display = 'none';
      }

      function resetGame() {
        state.mode = 'playing';
        state.score = 0;
        state.frame = 0;
        state.speed = 2.05;
        state.shake = 0;
        state.flash = 0;
        state.combo = 0;
        state.runBestCombo = 0;
        state.comboTimer = 0;
        state.nearMisses = 0;
        state.gates = [];
        state.particles = [];
        state.message = '';
        state.messageTimer = 0;
        state.invincibleUntil = performance.now() + SPAWN_INVINC_MS;
        player.y = H * 0.43;
        player.vy = 0;
        sessionStart = performance.now();
        lastFrameTime = performance.now();
        spawnGate(W + 160);
        spawnGate(W + 160 + MIN_GATE_SPACING);
        hideOverlay();
        beep(660, 0.07, 'square', 0.035);
      }

      function gapForScore() {
        if (state.score < 12) return 210 - state.score * 3;
        return Math.max(128, 180 - Math.floor((state.score - 12) / 8) * 4);
      }

      function speedForScore() {
        if (state.score < 12) return Math.min(3.2, 2.05 + state.score * 0.04);
        return Math.min(4.6, 3.2 + (state.score - 12) * 0.022);
      }

      function spawnGate(x) {
        const gap = gapForScore();
        const margin = 52;
        const centre = rand(margin + gap / 2, H - groundH - margin - gap / 2);
        const type = state.score >= 28 && Math.random() < 0.15 ? 'moving' : 'normal';
        const spawnX = x ?? W + 50;
        const last = state.gates[state.gates.length - 1];
        if (last && spawnX - last.x < MIN_GATE_SPACING) return;
        state.gates.push({
          x: spawnX,
          w: 68,
          gapY: centre - gap / 2,
          baseGapY: centre - gap / 2,
          gapH: gap,
          passed: false,
          near: false,
          pulse: rand(0, Math.PI * 2),
          type,
          amp: rand(10, 18),
          phase: rand(0, Math.PI * 2)
        });
      }

      function gateCollision(gate) {
        const pad = COLLISION_PAD;
        const left = gate.x + pad;
        const right = gate.x + gate.w - pad;
        const gapTop = gate.gapY + pad;
        const gapBottom = gate.gapY + gate.gapH - pad;
        const hr = player.hitR;
        const withinX = player.x + hr > left && player.x - hr < right;
        const hitsTop = player.y - hr < gapTop;
        const hitsBottom = player.y + hr > gapBottom;
        return withinX && (hitsTop || hitsBottom);
      }

      function burst(x, y, amount, colour) {
        for (let i = 0; i < amount; i++) {
          state.particles.push({
            x,
            y,
            vx: rand(-1.8, 1.2),
            vy: rand(-1.8, 1.8),
            life: rand(16, 32),
            max: 32,
            colour,
            size: rand(2, 5)
          });
        }
      }

      let lastFlapAt = 0;
      function flap() {
        const now = performance.now();
        if (state.mode === 'playing' && now - lastFlapAt < 110) return;
        if (state.mode === 'ready' || state.mode === 'gameover') {
          resetGame();
          lastFlapAt = now;
          player.vy = player.lift;
          burst(player.x - 10, player.y + 16, 8, '#818cf8');
          return;
        }
        if (state.mode === 'paused') {
          resume();
          return;
        }
        if (state.mode !== 'playing') return;
        lastFlapAt = now;
        player.vy = player.lift;
        burst(player.x - 12, player.y + 14, 5, '#818cf8');
        beep(520, 0.045, 'square', 0.025);
      }

      function changeSkin() {
        const count = unlockedCount();
        skinIndex = (skinIndex + 1) % count;
        localStorage.setItem(keys.skin, String(skinIndex));
        state.message = skins[skinIndex].name;
        state.messageTimer = 75;
        beep(760, 0.06, 'triangle', 0.025);
        if (state.mode === 'paused') renderPauseMenu();
        if (state.mode === 'gameover') renderDeathMenu('Wiped Out');
      }

      function cycleTheme() {
        themeIndex = (themeIndex + 1) % themes.length;
        localStorage.setItem(keys.theme, String(themeIndex));
        state.message = themes[themeIndex].name;
        state.messageTimer = 70;
        beep(620, 0.06, 'triangle', 0.025);
        if (state.mode === 'paused') renderPauseMenu();
        if (state.mode === 'gameover') renderDeathMenu('Wiped Out');
      }

      function toggleSound() {
        soundOn = !soundOn;
        localStorage.setItem(keys.sound, soundOn ? 'on' : 'off');
        syncSoundBtn();
        beep(620, 0.06, 'square', 0.025);
      }

      function renderPauseMenu() {
        showOverlay(
          'Paused',
          `<p>Current score: <strong class="statline">${state.score}</strong></p>
           <p>Skin: <span class="unlock">${skins[skinIndex].name}</span> · Theme: <span class="unlock">${themes[themeIndex].name}</span></p>
           ${skinMenuHtml()}
           <p class="tiny"><span class="kbd">S</span> change skin · <span class="kbd">T</span> theme · <span class="kbd">M</span> sound</p>`,
          'Press to resume'
        );
      }

      function pause() {
        if (state.mode !== 'playing') return;
        state.mode = 'paused';
        renderPauseMenu();
      }

      function resume() {
        if (state.mode === 'paused') {
          state.mode = 'playing';
          hideOverlay();
        }
      }

      function togglePause() {
        state.mode === 'paused' ? resume() : pause();
      }

      function renderDeathMenu(title) {
        showOverlay(
          title,
          `<p>Score: <strong class="statline">${state.score}</strong></p>
           <p>Best: <strong>${best}</strong></p>`,
          'Press to restart'
        );
      }

      function endDeskBreak(reason) {
        if (state.mode !== 'playing') return;
        state.mode = 'gameover';
        const oldBest = best;
        if (state.score > best) {
          best = state.score;
          localStorage.setItem(keys.best, String(best));
          bestScoreEl.textContent = best;
        }
        const newlyUnlocked = skins.find(s => oldBest < s.unlock && best >= s.unlock);
        state.unlockLine = newlyUnlocked ? `<p class="unlock">Unlocked: <strong>${newlyUnlocked.name}</strong></p>` : '';
        showOverlay(
          'Desk break done',
          `<p>${reason}</p>
           <p>Score: <strong class="statline">${state.score}</strong></p>
           <p>Best: <strong>${best}</strong>${state.unlockLine || ''}</p>`,
          'Press to play again'
        );
        DeskArcadeLeaderboard.trySubmit('pixelglide', state.score, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
      }

      function gameOver() {
        if (state.mode !== 'playing') return;
        state.mode = 'gameover';
        state.shake = 14;
        state.flash = 14;

        stats.totalDeaths++;
        stats.totalScore += state.score;
        stats.totalNear += state.nearMisses;
        stats.bestCombo = Math.max(stats.bestCombo, state.runBestCombo);
        localStorage.setItem(keys.deaths, stats.totalDeaths);
        localStorage.setItem(keys.score, stats.totalScore);
        localStorage.setItem(keys.near, stats.totalNear);
        localStorage.setItem(keys.combo, stats.bestCombo);

        burst(player.x, player.y, 32, '#ef4444');
        beep(110, 0.2, 'sawtooth', 0.04);

        const oldBest = best;
        if (state.score > best) {
          best = state.score;
          localStorage.setItem(keys.best, String(best));
          bestScoreEl.textContent = best;
        }

        const newlyUnlocked = skins.find(s => oldBest < s.unlock && best >= s.unlock);
        state.unlockLine = newlyUnlocked ? `<p class="unlock">Unlocked skin: <strong>${newlyUnlocked.name}</strong></p>` : '';
        renderDeathMenu('Wiped Out');

        DeskArcadeLeaderboard.trySubmit('pixelglide', state.score, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
      }

      function update(dt) {
        const step = clamp(dt / (1000 / TARGET_FPS), 0.5, 2.5);
        state.frame++;

        for (const star of state.stars) {
          star.x -= state.speed * step * (0.12 + star.s * 0.08);
          if (star.x < -4) {
            star.x = W + 4;
            star.y = rand(0, H - groundH);
          }
        }

        for (const cloud of state.clouds) {
          cloud.x -= state.speed * step * 0.08;
          if (cloud.x < -cloud.w) {
            cloud.x = W + rand(20, 120);
            cloud.y = rand(55, H * 0.55);
          }
        }

        state.particles = state.particles.filter(p => p.life > 0);
        for (const p of state.particles) {
          p.x += p.vx * step;
          p.y += p.vy * step;
          p.life -= step;
          p.vy += 0.03 * step;
        }

        if (state.messageTimer > 0) state.messageTimer -= step;
        if (state.comboTimer > 0) state.comboTimer -= step;
        else state.combo = 0;

        if (state.mode !== 'playing') return;

        state.speed = speedForScore();
        const elapsedSec = (performance.now() - sessionStart) / 1000;
        const timeLeft = DESK_BREAK_SEC - elapsedSec;
        if (timeLeft <= 8 && timeLeft > 0 && Math.floor(timeLeft) !== state._lastWarn) {
          state._lastWarn = Math.floor(timeLeft);
          state.message = `${Math.ceil(timeLeft)}s left`;
          state.messageTimer = 55;
        }
        if (state.score >= DESK_BREAK_SCORE - 3 && state.score < DESK_BREAK_SCORE) {
          state.message = `${DESK_BREAK_SCORE - state.score} to finish`;
          state.messageTimer = 45;
        }
        if (state.score >= DESK_BREAK_SCORE || elapsedSec >= DESK_BREAK_SEC) {
          endDeskBreak(state.score >= DESK_BREAK_SCORE ? 'Nice run — score target hit.' : 'Time\'s up — good desk break.');
          return;
        }

        player.vy += player.gravity * step;
        player.vy = Math.min(player.vy, 9.2);
        player.y += player.vy * step;
        player.rot = clamp(player.vy / 9, -0.55, 0.9);

        if (player.y - player.hitR < 0) {
          player.y = player.hitR;
          player.vy = 0;
        }

        const groundY = H - groundH - player.hitR - 2;
        if (player.y > groundY) {
          player.y = groundY;
          gameOver();
        }

        const invincible = performance.now() < state.invincibleUntil;

        for (const gate of state.gates) {
          gate.x -= state.speed * step;
          gate.pulse += 0.05 * step;
          if (gate.type === 'moving') {
            gate.gapY = gate.baseGapY + Math.sin(state.frame * 0.028 + gate.phase) * gate.amp;
          }

          if (!invincible && gateCollision(gate)) {
            gameOver();
            return;
          }

          const hr = player.hitR;
          const withinX = player.x + hr > gate.x && player.x - hr < gate.x + gate.w;
          const closeToTop = Math.abs((player.y - hr) - gate.gapY);
          const closeToBottom = Math.abs((gate.gapY + gate.gapH) - (player.y + hr));
          const hitsTop = player.y - hr < gate.gapY;
          const hitsBottom = player.y + hr > gate.gapY + gate.gapH;
          if (withinX && !gate.near && Math.min(closeToTop, closeToBottom) < 14 && !hitsTop && !hitsBottom) {
            gate.near = true;
            state.nearMisses++;
            state.combo++;
            state.runBestCombo = Math.max(state.runBestCombo, state.combo);
            state.comboTimer = 150;
            state.message = `CLOSE x${state.combo}`;
            state.messageTimer = 55;
            burst(player.x, player.y, 10, '#38bdf8');
          }

          if (!gate.passed && gate.x + gate.w < player.x - hr) {
            gate.passed = true;
            state.score++;
            burst(player.x - 24, player.y, 10, '#f59e0b');
            beep(700, 0.045, 'square', 0.024);
            if (state.score % 10 === 0) {
              state.message = 'SPEED UP';
              state.messageTimer = 70;
              state.shake = 4;
            }
          }
        }

        state.gates = state.gates.filter(g => g.x + g.w > -20);
        const lastGate = state.gates[state.gates.length - 1];
        if (!lastGate || lastGate.x < W - 220) {
          spawnGate(lastGate ? lastGate.x + MIN_GATE_SPACING : W + 50);
        }

        if (state.shake > 0) state.shake -= step;
        if (state.flash > 0) state.flash -= step;
      }

      function drawBackground() {
        const theme = themes[themeIndex];
        const grd = ctx.createLinearGradient(0, 0, 0, H);
        grd.addColorStop(0, theme.top);
        grd.addColorStop(0.52, theme.mid);
        grd.addColorStop(1, theme.bottom);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        for (const cloud of state.clouds) {
          ctx.globalAlpha = cloud.a;
          ctx.fillStyle = '#f4f4f8';
          ctx.fillRect(cloud.x, cloud.y, cloud.w, 10);
          ctx.fillRect(cloud.x + 18, cloud.y - 8, cloud.w * 0.35, 10);
          ctx.fillRect(cloud.x + cloud.w * 0.52, cloud.y - 5, cloud.w * 0.28, 10);
        }
        for (const star of state.stars) {
          ctx.globalAlpha = star.a;
          ctx.fillStyle = '#f4f4f8';
          ctx.fillRect(star.x, star.y, star.s, star.s);
        }
        ctx.restore();

        ctx.strokeStyle = 'rgba(99,102,241,.10)';
        ctx.lineWidth = 1;
        const gridOffset = (state.frame * state.speed * 0.55) % 34;
        for (let x = -34 + gridOffset; x < W; x += 34) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H - groundH);
          ctx.stroke();
        }
        for (let y = 0; y < H - groundH; y += 34) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
      }

      function drawGatePart(x, y, w, h, glow, type) {
        if (h <= 0) return;
        ctx.fillStyle = type === 'moving' ? '#1a1430' : '#15152b';
        ctx.fillRect(x, y, w, h);

        ctx.strokeStyle = type === 'moving' ? `rgba(167,139,250,${glow + 0.12})` : `rgba(99,102,241,${glow})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);

        ctx.fillStyle = type === 'moving' ? 'rgba(167,139,250,.18)' : 'rgba(99,102,241,.16)';
        for (let yy = y + 12; yy < y + h - 8; yy += 18) {
          ctx.fillRect(x + 10, yy, w - 20, 3);
        }

        ctx.fillStyle = type === 'moving' ? '#a78bfa' : '#6366f1';
        ctx.fillRect(x - 4, y + h - 10, w + 8, 10);
        ctx.fillRect(x - 4, y, w + 8, 10);
      }

      function drawGates() {
        for (const gate of state.gates) {
          const glow = 0.32 + Math.sin(gate.pulse) * 0.12;
          drawGatePart(gate.x, 0, gate.w, gate.gapY, glow, gate.type);
          drawGatePart(gate.x, gate.gapY + gate.gapH, gate.w, H - groundH - (gate.gapY + gate.gapH), glow, gate.type);
        }
      }

      function drawGround() {
        const y = H - groundH;
        ctx.fillStyle = '#08080f';
        ctx.fillRect(0, y, W, groundH);
        ctx.fillStyle = 'rgba(99,102,241,.25)';
        const offset = (state.frame * state.speed) % 28;
        for (let x = -28 + offset; x < W + 28; x += 28) {
          ctx.fillRect(x, y + 14, 15, 4);
          ctx.fillRect(x + 8, y + 38, 15, 4);
        }
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, y + 1);
        ctx.lineTo(W, y + 1);
        ctx.stroke();
      }

      function drawTrail() {
        const skin = skins[skinIndex];
        ctx.save();
        for (let i = 0; i < 6; i++) {
          ctx.globalAlpha = 0.12 - i * 0.018;
          ctx.fillStyle = skin.wing;
          ctx.fillRect(player.x - 14 - i * 8, player.y + i * 2, 12 - i, 6 - i * 0.5);
        }
        ctx.restore();
      }

      function drawPlayer() {
        const skin = skins[skinIndex];
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.rot);
        ctx.shadowColor = skin.wing;
        ctx.shadowBlur = 14;

        if (skin.type === 'bird') {
          ctx.fillStyle = skin.body;
          ctx.fillRect(-15, -12, 30, 24);
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff5d8';
          ctx.fillRect(-9, -8, 12, 8);
          ctx.fillStyle = skin.wing;
          ctx.fillRect(-20, 2, 12, 8);
          ctx.fillRect(-18, -3, 8, 5);
          ctx.fillStyle = skin.beak;
          ctx.fillRect(14, -3, 9, 6);
          ctx.fillStyle = '#08080f';
          ctx.fillRect(5, -7, 4, 4);
        }

        if (skin.type === 'bat') {
          ctx.fillStyle = skin.body;
          ctx.fillRect(-12, -10, 24, 20);
          ctx.fillStyle = skin.wing;
          ctx.beginPath();
          ctx.moveTo(-12, 0);
          ctx.lineTo(-30, -12);
          ctx.lineTo(-26, 10);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(12, 0);
          ctx.lineTo(30, -12);
          ctx.lineTo(26, 10);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-6, -4, 4, 4);
          ctx.fillRect(2, -4, 4, 4);
        }

        if (skin.type === 'cube') {
          ctx.fillStyle = skin.body;
          ctx.fillRect(-16, -16, 32, 32);
          ctx.strokeStyle = skin.wing;
          ctx.lineWidth = 4;
          ctx.strokeRect(-16, -16, 32, 32);
          ctx.fillStyle = skin.beak;
          ctx.fillRect(-6, -6, 12, 12);
        }

        if (skin.type === 'drone') {
          ctx.fillStyle = skin.body;
          ctx.fillRect(-14, -8, 28, 16);
          ctx.fillStyle = skin.wing;
          ctx.fillRect(-24, -18, 8, 8);
          ctx.fillRect(16, -18, 8, 8);
          ctx.fillRect(-24, 10, 8, 8);
          ctx.fillRect(16, 10, 8, 8);
          ctx.strokeStyle = '#f4f4f8';
          ctx.beginPath();
          ctx.moveTo(-20, -10);
          ctx.lineTo(-20, 14);
          ctx.moveTo(20, -10);
          ctx.lineTo(20, 14);
          ctx.stroke();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-5, -3, 10, 6);
        }

        if (skin.type === 'bug') {
          ctx.fillStyle = skin.body;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = skin.wing;
          ctx.beginPath();
          ctx.arc(-12, -12, 8, 0, Math.PI * 2);
          ctx.arc(12, -12, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = skin.beak;
          for (let i = -1; i <= 1; i += 2) {
            ctx.beginPath();
            ctx.moveTo(i * 10, 10);
            ctx.lineTo(i * 18, 18);
            ctx.stroke();
          }
        }

        if (skin.type === 'rocket') {
          ctx.fillStyle = skin.body;
          ctx.fillRect(-10, -18, 20, 36);
          ctx.fillStyle = skin.wing;
          ctx.beginPath();
          ctx.moveTo(-10, 10);
          ctx.lineTo(-24, 18);
          ctx.lineTo(-10, -2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(10, 10);
          ctx.lineTo(24, 18);
          ctx.lineTo(10, -2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-5, -10, 10, 10);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-6, 18, 12, 10);
        }

        ctx.restore();
      }

      function drawParticles() {
        ctx.save();
        for (const p of state.particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.max);
          ctx.fillStyle = p.colour;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
        ctx.restore();
      }

      function drawHUD() {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = 'bold 42px \'JetBrains Mono\', monospace';
        ctx.fillStyle = 'rgba(8,8,15,.45)';
        ctx.fillText(state.score, W / 2 + 3, 25 + 3);
        ctx.fillStyle = '#f4f4f8';
        ctx.fillText(state.score, W / 2, 25);

        ctx.font = 'bold 16px \'Space Grotesk\', sans-serif';
        ctx.fillStyle = '#f59e0b';
        if (state.combo > 0 && state.comboTimer > 0) ctx.fillText(`COMBO x${state.combo}`, W / 2, 91);

        if (state.messageTimer > 0) {
          ctx.font = 'bold 22px \'Space Grotesk\', sans-serif';
          ctx.fillStyle = state.message.includes('NEAR') ? '#38bdf8' : '#f59e0b';
          ctx.fillText(state.message, W / 2, 122);
        }
        ctx.restore();
      }

      function drawReadyGhost() {
        if (state.mode !== 'ready') return;
        player.y = H * 0.43 + Math.sin(state.frame * 0.045) * 8;
        player.rot = Math.sin(state.frame * 0.04) * 0.12;
      }

      function render(now) {
        const dt = clamp(now - lastFrameTime, 8, 50);
        lastFrameTime = now;
        update(dt);
        ctx.save();
        if (state.shake > 0) {
          shakePhase += 0.9;
          const s = state.shake * 0.35;
          ctx.translate(Math.sin(shakePhase) * s, Math.cos(shakePhase * 1.3) * s);
        }
        drawBackground();
        drawReadyGhost();
        drawGates();
        drawTrail();
        drawParticles();
        drawPlayer();
        drawGround();
        drawHUD();
        if (state.flash > 0) {
          ctx.fillStyle = `rgba(239,68,68,${state.flash / 45})`;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.restore();

        if (state.mode === 'playing' && performance.now() < state.invincibleUntil) {
          ctx.save();
          ctx.globalAlpha = 0.35 + Math.sin(state.frame * 0.2) * 0.15;
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.hitR + 4, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        requestAnimationFrame(render);
      }

      function handleKey(e) {
        if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
          if (e.repeat) return;
          e.preventDefault();
          flap();
        }
        if (e.code === 'KeyP') togglePause();
        if (e.code === 'KeyM') toggleSound();
        if (e.code === 'KeyS') changeSkin();
        if (e.code === 'KeyT') cycleTheme();
      }

      canvas.addEventListener('pointerdown', flap);
      panel.addEventListener('pointerdown', () => {
        if ((state.mode === 'paused' || state.mode === 'gameover') && panel.scrollHeight > panel.clientHeight) {
          const nearBottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 8;
          if (!nearBottom) return;
        }
        flap();
      });
      document.addEventListener('keydown', handleKey);
      soundBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSound(); });
      pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state.mode === 'playing') pause();
        lastFrameTime = performance.now();
      });

      resetSky();
      spawnGate(W + 260);
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
