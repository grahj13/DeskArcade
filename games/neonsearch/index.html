<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Search | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#8b5cf6;
  --accent-2:#a78bfa;
  --red:#ef4444;
  --yellow:#f59e0b;
  --blue:#38bdf8;
}

body {
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
}

.arcade-shell {
  position:relative;
  z-index:1;
  width:100%;
  max-width:1100px;
  height:100%;
  display:flex;
  flex-direction:column;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
  padding:16px;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

button {
  border:none;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  color:#fff;
  padding:9px 16px;
  border-radius:var(--radius-sm);
  font-family:var(--font-display);
  font-size:13px;
  font-weight:600;
  letter-spacing:0.03em;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:transform 0.18s ease, filter 0.18s ease;
}

button:hover {
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.header {
  text-align:center;
  margin-bottom:6px;
}

.game-logo {
  height:44px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  margin:auto;
  display:block;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.subtitle {
  font-size:0.85rem;
  color:var(--text-dim);
}

.game-panel {
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px;
  overflow:hidden;
}

.status-row {
  text-align:center;
  margin-bottom:6px;
  color:var(--text-dim);
}

.status-row span {
  font-family:var(--font-mono);
  color:var(--accent-text);
}

.main-game {
  flex:1;
  display:grid;
  grid-template-columns:1fr 260px;
  gap:12px;
  overflow:hidden;
}

.grid {
  height:100%;
  display:grid;
  grid-template-columns:repeat(12, 1fr);
  grid-template-rows:repeat(12, 1fr);
  gap:4px;
  user-select:none;
  touch-action:none;
  cursor:crosshair;
}

.cell {
  border:1px solid var(--border);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(0.7rem,1.5vw,1.1rem);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  transition:background 0.12s ease, border-color 0.12s ease;
}

.cell:hover {
  background:var(--accent-soft);
  border-color:var(--accent-border);
}

.cell.selected {
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  box-shadow:0 0 10px var(--accent-glow);
}

.cell.preview {
  background:color-mix(in srgb, var(--accent) 55%, transparent);
  border-color:var(--accent-border);
  color:#fff;
}

.cell.found {
  background:color-mix(in srgb, var(--accent) 30%, transparent);
  border-color:var(--accent-border);
  color:var(--accent-text);
}

.word-panel {
  overflow:auto;
  padding:4px 2px;
}

.word-list {
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.word-list li {
  font-family:var(--font-display);
  font-size:1.12rem;
  font-weight:700;
  letter-spacing:0.1em;
  color:var(--text);
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:var(--surface-strong);
  border:1px solid var(--border);
  transition:background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
}

.word-list li.found {
  text-decoration:line-through;
  color:var(--text-faint);
  opacity:0.45;
  border-color:transparent;
  background:transparent;
}

.message {
  text-align:center;
  color:var(--yellow);
  font-size:0.85rem;
}

.complete-overlay {
  position:fixed;
  inset:0;
  background:rgba(6,6,12,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.complete-box {
  background:var(--surface-strong);
  border:1px solid var(--border);
  padding:20px;
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-2);
  text-align:center;
}

.complete-box h2 {
  margin-top:0;
  font-family:var(--font-display);
  color:var(--text);
}

.complete-box .time {
  font-family:var(--font-mono);
  color:var(--accent-text);
  margin:8px 0 14px;
}

.message.bad {
  color:#ef4444;
}

@keyframes cellShake {
  0%, 100% { transform:translateX(0); }
  25% { transform:translateX(-3px); }
  75% { transform:translateX(3px); }
}

.cell.shake {
  animation:cellShake 0.25s ease;
}

</style>
</head>

<body>

<div class="arcade-shell">

  <div class="top-bar">
    <a class="da-back back-btn" href="../../index.html">Return to Arcade</a>
    <button onclick="newGame()">New Game</button>
  </div>

  <div class="header">
    <img src="neonsearchlogo.png" class="game-logo">
    <div class="subtitle">Drag across a word — or click first letter, then last</div>
  </div>

  <div class="game-panel">

    <div class="status-row">
      Found: <span id="found">0</span>/<span id="total">0</span>
      &nbsp;·&nbsp; <span id="timer">0:00</span>
      &nbsp;·&nbsp; Best: <span id="bestTime">--</span>
    </div>

    <div class="main-game">
      <div id="grid" class="grid"></div>

      <div class="word-panel">
        <ul id="words" class="word-list"></ul>
      </div>
    </div>

    <div id="message" class="message"></div>

  </div>

  <div id="leaderboard"></div>

</div>

<div id="complete" class="complete-overlay">
  <div class="complete-box">
    <h2>Puzzle Complete</h2>
    <p class="time" id="completeTime"></p>
    <button onclick="newGame()">New Game</button>
    <a class="da-back back-btn" href="../../index.html">Return</a>
  </div>
</div><script src="../../assets/leaderboard.js?v=5"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'neonsearch', 'default');

const size = 12;

const bank = [...new Set([
  "ARCADE","NEON","PIXEL","LASER","CYBER","MATRIX","ROBOT","BINARY","SERVER","CODING","SCRIPT","VECTOR","PORTAL","TURBO","ENGINE","MEMORY","CIRCUIT","LOGIN","SYSTEM","SCREEN","BUTTON",
  "PUZZLE","QUEST","LEVEL","PLAYER","WINNER","TARGET","BATTLE","RACING","RUNNER","CHASE","DRAGON","MAGIC","GHOST","STORM","FLASH","POWER","ENERGY","GALAXY","ROCKET","SPEED","GAMES","SCORE",
  "DESK","OFFICE","EMAIL","LAPTOP","MOUSE","CHAIR","COFFEE","MEETING","NOTES","PHONE","PAPER","STAPLE","BREAK","FOCUS","INBOX","TASKS",
  "FOREST","RIVER","OCEAN","CLOUD","FROST","FLAME","EAGLE","TIGER","WOLF","MAPLE","CORAL","BLOOM","MOSSY","CANYON","MEADOW","SUNSET",
  "PIZZA","BREAD","APPLE","GRAPE","MANGO","SUSHI","TACOS","BACON","CHEESE","COOKIE","MELON","PEACH","BERRY","TOAST","CREAM","SPICE",
  "SPORT","TRACK","MEDAL","TEAM","SPRINT","TENNIS","RUGBY","KICKS","CYCLE","CLIMB","JUMPS","RALLY",
  "LIGHT","DARK","SECRET","HIDDEN","CLOCK","MUSIC","DANCE","BOOKS","WORDS","SEARCH","BRICK","BLOCK","START","FINISH","QUICK","BRAVE",
  "CROWN","SWORD","SHIELD","STONE","WHEEL","SPACE","ORBIT","COMET","LUNAR","SOLAR","PHASE","ATLAS","FORGE","BLAZE","SPARK","GLOW",
  "PRISM","VIVID","VAULT","WALTZ","YACHT","ZESTY","JAZZY","OXIDE","QUART","BLINK","GRIND","SHIFT","CRISP","NORTH","SOUTH","EAST"
])];

let grid=[], words=[], placed=[], found=[], clickFirst=null;
let dragStart=null, dragActive=false, dragMoved=false;
let startTime=0, timerId=null, elapsedMs=0;
let bestMs=Number(localStorage.getItem("neonsearchBest"))||null;

const gridEl=document.getElementById("grid");
const wordsEl=document.getElementById("words");
const foundEl=document.getElementById("found");
const totalEl=document.getElementById("total");
const timerEl=document.getElementById("timer");
const bestTimeEl=document.getElementById("bestTime");
const completeTimeEl=document.getElementById("completeTime");
const msg=document.getElementById("message");
const complete=document.getElementById("complete");

if(bestMs) bestTimeEl.textContent=formatTime(bestMs);

function formatTime(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60), sec=s%60;
  return m+":"+String(sec).padStart(2,"0");
}

function flashMsg(text,isBad=false){
  msg.textContent=text;
  msg.className="message"+(isBad?" bad":"");
  clearTimeout(flashMsg._t);
  flashMsg._t=setTimeout(()=>{ if(msg.textContent===text) msg.textContent=""; }, 1800);
}

function startTimer(){
  if(timerId) clearInterval(timerId);
  startTime=Date.now();
  timerEl.textContent="0:00";
  timerId=setInterval(()=>{
    timerEl.textContent=formatTime(Date.now()-startTime);
  }, 250);
}

function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  elapsedMs=Date.now()-startTime;
}

newGame();

function newGame(){
  complete.style.display="none";
  let attempts=0;

  do{
    grid=Array.from({length:size},()=>Array(size).fill(""));
    words=[...bank].sort(()=>Math.random()-0.5).slice(0,14);
    placed=[]; found=[]; clickFirst=null;
    dragStart=null; dragActive=false; dragMoved=false;
    words.forEach(placeWord);
    attempts++;
  } while(placed.length<words.length && attempts<30);

  if(placed.length<words.length){
    words=placed.map(p=>p.word);
  }

  fill();
  draw();
  drawWords();
  update();
  flashMsg("Find all words — drag or click first & last letter");
  startTimer();
}

function placeWord(word){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  let placedFlag=false;

  for(let a=0;a<200 && !placedFlag;a++){
    let [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)];
    let r=Math.floor(Math.random()*size);
    let c=Math.floor(Math.random()*size);

    let ok=true;
    for(let i=0;i<word.length;i++){
      let nr=r+dr*i,nc=c+dc*i;
      if(nr<0||nc<0||nr>=size||nc>=size|| (grid[nr][nc] && grid[nr][nc]!=word[i])) ok=false;
    }

    if(ok){
      let cells=[];
      for(let i=0;i<word.length;i++){
        let nr=r+dr*i,nc=c+dc*i;
        grid[nr][nc]=word[i];
        cells.push([nr,nc]);
      }
      placed.push({word,cells});
      placedFlag=true;
    }
  }
}

function fill(){
  const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      if(!grid[r][c]) grid[r][c]=L[Math.floor(Math.random()*26)];
    }
  }
}

function getCell(r,c){
  return gridEl.children[r*size+c];
}

function cellFromPoint(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el || !el.classList.contains("cell")) return null;
  return { r:+el.dataset.r, c:+el.dataset.c, el };
}

function draw(){
  gridEl.innerHTML="";
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      let d=document.createElement("div");
      d.className="cell";
      d.textContent=grid[r][c];
      d.dataset.r=r;
      d.dataset.c=c;
      gridEl.appendChild(d);
    }
  }
}

function highlightPath(path, cls="selected"){
  clearHighlight(cls);
  if(!path) return;
  path.forEach(([r,c])=>getCell(r,c).classList.add(cls));
}

function clearHighlight(cls="selected"){
  gridEl.querySelectorAll("."+cls).forEach(e=>e.classList.remove(cls));
}

function clearSel(){
  clearHighlight("selected");
  clearHighlight("preview");
}

function drawWords(){
  wordsEl.innerHTML="";
  words.forEach(w=>{
    let li=document.createElement("li");
    li.textContent=w;
    li.id="w"+w;
    wordsEl.appendChild(li);
  });
  totalEl.textContent=words.length;
}

function resolveWord(path){
  if(!path || path.length<2){
    flashMsg("Select at least two letters", true);
    return;
  }

  let str=path.map(([r,c])=>grid[r][c]).join("");
  let rev=str.split("").reverse().join("");
  let match=placed.find(p=>(p.word===str||p.word===rev) && !found.includes(p.word));
  let word=match?match.word:null;
  let already=found.includes(str)||found.includes(rev);

  if(match && word){
    found.push(word);
    match.cells.forEach(([r,c])=>getCell(r,c).classList.add("found"));
    document.getElementById("w"+word).classList.add("found");
    flashMsg("Found: "+word);
    update();
    if(found.length===words.length){
      stopTimer();
      if(!bestMs || elapsedMs<bestMs){
        bestMs=elapsedMs;
        localStorage.setItem("neonsearchBest", String(bestMs));
        bestTimeEl.textContent=formatTime(bestMs);
      }
      completeTimeEl.textContent="Time: "+formatTime(elapsedMs)+(bestMs===elapsedMs?" — new best!":"");
      complete.style.display="flex";
      DeskArcadeLeaderboard.trySubmit('neonsearch', elapsedMs, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
    }
  } else if(already){
    flashMsg("Already found that word", true);
    path.forEach(([rr,cc])=>shakeCell(rr*size+cc));
  } else {
    flashMsg("Not on the list", true);
    path.forEach(([rr,cc])=>shakeCell(rr*size+cc));
  }
}

function submitSelection(start,end){
  let path=getPath(start,end);
  if(!path){
    flashMsg("Words must follow a straight line", true);
    pathCells(start,end).forEach(i=>shakeCell(i));
    clearSel();
    return;
  }
  resolveWord(path);
  clearSel();
}

function onPointerDown(e){
  if(e.button!==0) return;
  const hit=cellFromPoint(e.clientX,e.clientY);
  if(!hit) return;

  dragStart=[hit.r,hit.c];
  dragActive=true;
  dragMoved=false;
  if(clickFirst){
    getCell(clickFirst[0],clickFirst[1]).classList.add("selected");
  } else {
    clearSel();
    hit.el.classList.add("selected");
  }
  gridEl.setPointerCapture(e.pointerId);
  e.preventDefault();
}

function onPointerMove(e){
  if(!dragActive || !dragStart) return;
  const hit=cellFromPoint(e.clientX,e.clientY);
  if(!hit) return;

  if(hit.r!==dragStart[0] || hit.c!==dragStart[1]) dragMoved=true;

  const anchor=clickFirst && !dragMoved ? clickFirst : dragStart;
  const path=getPath(anchor,[hit.r,hit.c]);
  clearHighlight("preview");
  if(path){
    if(clickFirst) getCell(clickFirst[0],clickFirst[1]).classList.add("selected");
    path.forEach(([r,c])=>{
      const cell=getCell(r,c);
      if(clickFirst && clickFirst[0]===r && clickFirst[1]===c) return;
      cell.classList.remove("selected");
      cell.classList.add("preview");
    });
  } else if(clickFirst){
    getCell(clickFirst[0],clickFirst[1]).classList.add("selected");
  } else {
    getCell(dragStart[0],dragStart[1]).classList.add("selected");
  }
}

function onPointerUp(e){
  if(!dragActive) return;
  dragActive=false;
  try{ gridEl.releasePointerCapture(e.pointerId); }catch(_){}

  const hit=cellFromPoint(e.clientX,e.clientY);
  const end=hit?[hit.r,hit.c]:dragStart;

  if(dragMoved || (dragStart[0]!==end[0] || dragStart[1]!==end[1])){
    const anchor=clickFirst||dragStart;
    submitSelection(anchor,end);
    clickFirst=null;
  } else {
    clearSel();
    if(!clickFirst){
      clickFirst=[end[0],end[1]];
      getCell(end[0],end[1]).classList.add("selected");
    } else if(clickFirst[0]===end[0] && clickFirst[1]===end[1]){
      clickFirst=null;
    } else {
      submitSelection(clickFirst,end);
      clickFirst=null;
    }
  }

  dragStart=null;
  dragMoved=false;
}

gridEl.addEventListener("pointerdown", onPointerDown);
gridEl.addEventListener("pointermove", onPointerMove);
gridEl.addEventListener("pointerup", onPointerUp);
gridEl.addEventListener("pointercancel", onPointerUp);

function pathCells(a,b){
  const p=getPath(a,b);
  return p?p.map(([r,c])=>r*size+c):[];
}

function shakeCell(index){
  const cell=gridEl.children[index];
  if(!cell) return;
  cell.classList.remove("shake");
  void cell.offsetWidth;
  cell.classList.add("shake");
}

function getPath(a,b){
  let [r1,c1]=a,[r2,c2]=b;
  let dr=Math.sign(r2-r1), dc=Math.sign(c2-c1);

  if(!(r1==r2||c1==c2||Math.abs(r2-r1)==Math.abs(c2-c1))) return null;

  let len=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1;
  return Array.from({length:len},(_,i)=>[r1+dr*i,c1+dc*i]);
}

function update(){
  foundEl.textContent=found.length;
}
</script>

</body>
</html>
