<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reacto | DeskArcade</title>

<style>
:root {
  --green:#8cff6a;
  --red:#ff6b4a;
  --yellow:#ffd86b;
  --blue:#7fdcff;
  --bg:#020402;
  --panel:rgba(7,24,8,0.94);
  --text-soft:#b9ffd2;
  --border-soft:rgba(140,255,106,0.35);
}

* {
  box-sizing:border-box;
}

@keyframes logoGlow {
  0%, 100% {
    filter:
      drop-shadow(0 0 12px rgba(140,255,106,0.6))
      drop-shadow(0 0 28px rgba(140,255,106,0.3));
  }
  50% {
    filter:
      drop-shadow(0 0 20px rgba(140,255,106,0.9))
      drop-shadow(0 0 40px rgba(140,255,106,0.6));
  }
}

@keyframes buttonBreath {
  0%, 100% {
    transform:scale(1);
  }
  50% {
    transform:scale(1.025);
  }
}

@keyframes readyPulse {
  0%, 100% {
    transform:scale(1);
    box-shadow:
      0 0 30px rgba(140,255,106,0.7),
      0 14px 0 rgba(27,80,20,0.95),
      0 26px 30px rgba(0,0,0,0.55);
  }
  50% {
    transform:scale(1.045);
    box-shadow:
      0 0 55px rgba(140,255,106,1),
      0 14px 0 rgba(27,80,20,0.95),
      0 32px 40px rgba(0,0,0,0.65);
  }
}

@keyframes errorShake {
  0%, 100% { transform:translateX(0); }
  20% { transform:translateX(-8px); }
  40% { transform:translateX(8px); }
  60% { transform:translateX(-6px); }
  80% { transform:translateX(6px); }
}

@keyframes scorePop {
  0% {
    transform:scale(0.85);
    opacity:0.4;
  }
  100% {
    transform:scale(1);
    opacity:1;
  }
}

body {
  margin:0;
  min-height:100vh;
  font-family:Consolas, Monaco, monospace;
  background:
    radial-gradient(circle at top, rgba(140,255,106,0.16), transparent 35%),
    linear-gradient(180deg,#071106 0%,#020402 100%);
  color:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.arcade-shell {
  width:min(720px, 100%);
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:24px;
  padding:24px;
  box-shadow:
    0 0 25px rgba(140,255,106,0.18),
    inset 0 0 30px rgba(140,255,106,0.06);
  text-align:center;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.arcade-link {
  color:var(--green);
  text-decoration:none;
  border:1px solid var(--border-soft);
  padding:9px 14px;
  border-radius:999px;
  font-size:14px;
  background:rgba(140,255,106,0.08);
}

.arcade-link:hover {
  background:rgba(140,255,106,0.16);
  box-shadow:0 0 14px rgba(140,255,106,0.25);
}

.build {
  font-size:13px;
  color:var(--text-soft);
  opacity:0.75;
}

.logo {
  width:100%;
  max-width:520px;
  margin:0 auto 10px;
  display:block;
  animation:logoGlow 3s ease-in-out infinite;
}

.subtitle {
  margin:8px 0 26px;
  color:var(--text-soft);
  font-size:16px;
}

.status {
  min-height:28px;
  margin-bottom:18px;
  font-size:20px;
  color:var(--yellow);
  text-shadow:0 0 10px rgba(255,216,107,0.35);
}

.game-button {
  width:min(320px, 78vw);
  height:min(320px, 78vw);
  border-radius:50%;
  border:4px solid rgba(255,255,255,0.12);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.22), transparent 22%),
    linear-gradient(145deg,#ff866d,#b42c18);
  color:#160403;
  font-family:inherit;
  font-size:clamp(24px, 5vw, 46px);
  font-weight:900;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    0 0 22px rgba(255,107,74,0.45),
    0 14px 0 rgba(80,10,5,0.9),
    0 26px 30px rgba(0,0,0,0.55);
  transition:
    box-shadow 0.12s ease,
    filter 0.12s ease;
  animation:buttonBreath 2.4s ease-in-out infinite;
}

.game-button:hover {
  filter:brightness(1.08);
}

.game-button:active {
  transform:translateY(8px);
  box-shadow:
    0 0 18px rgba(255,107,74,0.35),
    0 6px 0 rgba(80,10,5,0.9),
    0 16px 22px rgba(0,0,0,0.5);
}

.game-button.ready {
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), transparent 22%),
    linear-gradient(145deg,#b7ff96,#3fc930);
  animation:readyPulse 0.65s ease-in-out infinite;
}

.game-button.ready:active {
  box-shadow:
    0 0 22px rgba(140,255,106,0.55),
    0 6px 0 rgba(27,80,20,0.95),
    0 16px 22px rgba(0,0,0,0.5);
}

.game-button.error {
  animation:errorShake 0.28s ease-in-out;
}

.results {
  margin-top:32px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.score-card {
  border:1px solid var(--border-soft);
  border-radius:16px;
  padding:16px;
  background:rgba(0,0,0,0.22);
}

.label {
  font-size:13px;
  color:var(--text-soft);
  opacity:0.75;
  margin-bottom:8px;
}

.value {
  font-size:30px;
  color:var(--green);
  text-shadow:0 0 12px rgba(140,255,106,0.45);
}

.value.pop {
  animation:scorePop 0.22s ease-out;
}

.note {
  margin-top:22px;
  font-size:13px;
  color:var(--text-soft);
  opacity:0.65;
}

@media (max-width:560px) {
  .top-bar {
    flex-direction:column;
  }

  .results {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main class="arcade-shell">

  <div class="top-bar">
    <a class="arcade-link" href="../../index.html">&larr; Return to Arcade</a>
    <div class="build">Created by Jason / build v1.0</div>
  </div>

  <img src="reactologo.png" alt="Reacto Logo" class="logo">

  <p class="subtitle">Wait for green. Then tap fast.</p>

  <div id="status" class="status">Press start when ready.</div>

  <button id="gameBtn" class="game-button">START</button>

  <section class="results">
    <div class="score-card">
      <div class="label">LAST REACTION</div>
      <div id="lastScore" class="value">--</div>
    </div>

    <div class="score-card">
      <div class="label">BEST REACTION</div>
      <div id="bestScore" class="value">--</div>
    </div>
  </section>

  <div class="note">Clicking before green is cheating. Don&apos;t be that person.</div>

</main>

<script>
let state = "idle";
let startTime = 0;
let timeout = null;

const gameBtn = document.getElementById("gameBtn");
const statusText = document.getElementById("status");
const lastScore = document.getElementById("lastScore");
const bestScore = document.getElementById("bestScore");

let bestTime = localStorage.getItem("reactoBestTime");

if (bestTime) {
  bestScore.textContent = Number(bestTime).toFixed(3) + "s";
}

function popScore(element) {
  element.classList.remove("pop");
  void element.offsetWidth;
  element.classList.add("pop");
}

function resetButton() {
  state = "idle";
  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  gameBtn.textContent = "START";
}

function startRound() {
  state = "waiting";
  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  gameBtn.textContent = "WAIT";
  statusText.textContent = "Wait for green...";
  lastScore.textContent = "--";

  const delay = Math.random() * 3000 + 2000;

  timeout = setTimeout(() => {
    state = "ready";
    gameBtn.classList.add("ready");
    gameBtn.textContent = "TAP!";
    statusText.textContent = "GO!";
    startTime = performance.now();
  }, delay);
}

function tooSoon() {
  clearTimeout(timeout);
  state = "idle";

  statusText.textContent = "Too soon. Resetting.";
  lastScore.textContent = "FAIL";
  popScore(lastScore);

  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  void gameBtn.offsetWidth;
  gameBtn.classList.add("error");

  setTimeout(() => {
    resetButton();
  }, 300);
}

function finishRound() {
  const reactionTime = (performance.now() - startTime) / 1000;
  const formattedTime = reactionTime.toFixed(3) + "s";

  lastScore.textContent = formattedTime;
  statusText.textContent = "Reaction recorded.";
  popScore(lastScore);

  if (!bestTime || reactionTime < Number(bestTime)) {
    bestTime = reactionTime;
    localStorage.setItem("reactoBestTime", bestTime);
    bestScore.textContent = formattedTime;
    statusText.textContent = "New best reaction!";
    popScore(bestScore);
  }

  resetButton();
}

gameBtn.addEventListener("click", () => {
  if (state === "idle") {
    startRound();
  } else if (state === "waiting") {
    tooSoon();
  } else if (state === "ready") {
    finishRound();
  }
});
</script>

</body>
</html>
