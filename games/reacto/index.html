<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reacto | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#ef4444;
  --accent-2:#f87171;
  --red:#ef4444;
  --yellow:#f59e0b;
  --blue:#38bdf8;
}

@keyframes readyPulse {
  0%, 100% {
    transform:scale(1);
    box-shadow:
      0 0 30px rgba(34,197,94,0.45),
      0 14px 0 rgba(11,58,27,0.95),
      0 26px 30px rgba(0,0,0,0.55);
  }
  50% {
    transform:scale(1.045);
    box-shadow:
      0 0 48px rgba(34,197,94,0.65),
      0 14px 0 rgba(11,58,27,0.95),
      0 32px 40px rgba(0,0,0,0.65);
  }
}

@keyframes errorShake {
  0%, 100% { transform:translateX(0); }
  20% { transform:translateX(-8px); }
  40% { transform:translateX(8px); }
  60% { transform:translateX(-6px); }
  80% { transform:translateX(6px); }
}

@keyframes scorePop {
  0% {
    transform:scale(0.85);
    opacity:0.4;
  }
  100% {
    transform:scale(1);
    opacity:1;
  }
}

body {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.arcade-shell {
  position:relative;
  z-index:1;
  width:min(720px, 100%);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
  padding:24px;
  text-align:center;
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.build {
  font-size:13px;
  color:var(--text-dim);
}

.logo {
  display:block;
  height:56px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  margin:0 auto 10px;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.subtitle {
  margin:8px 0 26px;
  color:var(--text-dim);
  font-size:16px;
}

.mode-bar {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:16px;
}

.mode-btn {
  padding:6px 14px;
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  background:var(--surface);
  color:var(--text-dim);
  font-family:var(--font-display);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.mode-btn:hover {
  border-color:var(--accent-border);
}

.mode-btn.active {
  border-color:var(--accent-border);
  background:var(--accent-soft);
  color:var(--accent-text);
}

.mode-btn:disabled {
  opacity:0.45;
  cursor:default;
}

.status {
  min-height:28px;
  margin-bottom:10px;
  font-family:var(--font-display);
  font-weight:600;
  font-size:20px;
  color:var(--yellow);
}

.round-dots {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:18px;
  min-height:10px;
}

.round-dot {
  width:10px;
  height:10px;
  border-radius:50%;
  border:1px solid var(--border-strong);
  background:var(--surface);
  transition:background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}

.round-dot.done {
  background:var(--accent);
  border-color:var(--accent-border);
}

.round-dot.current {
  background:var(--yellow);
  border-color:rgba(245,158,11,0.55);
  box-shadow:0 0 8px rgba(245,158,11,0.35);
}

.game-button {
  width:min(320px, 78vw);
  height:min(320px, 78vw);
  border-radius:50%;
  border:4px solid rgba(255,255,255,0.12);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.16), transparent 22%),
    linear-gradient(145deg,#b91c1c,#5f1414);
  color:#fde8e8;
  font-family:var(--font-display);
  font-size:clamp(24px, 5vw, 46px);
  font-weight:700;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    0 0 22px rgba(239,68,68,0.22),
    0 14px 0 rgba(54,8,8,0.95),
    0 26px 30px rgba(0,0,0,0.55);
  transition:
    box-shadow 0.12s ease,
    filter 0.12s ease;
}

.game-button.waiting {
  animation:none;
}

.game-button:hover {
  filter:brightness(1.08);
}

.game-button:active {
  transform:translateY(8px);
  box-shadow:
    0 0 18px rgba(239,68,68,0.18),
    0 6px 0 rgba(54,8,8,0.95),
    0 16px 22px rgba(0,0,0,0.5);
}

.game-button.ready {
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), transparent 22%),
    linear-gradient(145deg,#4ade80,#16a34a);
  color:#052e16;
  animation:readyPulse 0.65s ease-in-out infinite;
}

.game-button.ready:active {
  box-shadow:
    0 0 22px rgba(34,197,94,0.45),
    0 6px 0 rgba(11,58,27,0.95),
    0 16px 22px rgba(0,0,0,0.5);
}

.game-button.error {
  animation:errorShake 0.28s ease-in-out;
}

.results {
  margin-top:32px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}

.history-row {
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  min-height:28px;
}

.history-pill {
  padding:5px 10px;
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-dim);
}

.score-card {
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:16px;
  background:var(--surface);
}

.label {
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:8px;
}

.value {
  font-family:var(--font-mono);
  font-size:30px;
  font-weight:700;
  color:var(--accent-text);
}

.value.pop {
  animation:scorePop 0.22s ease-out;
}

.note {
  margin-top:22px;
  font-size:13px;
  color:var(--text-faint);
}

@media (max-width:560px) {
  .top-bar {
    flex-direction:column;
  }

  .results {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main class="arcade-shell">

  <div class="top-bar">
    <a class="da-back arcade-link" href="../../index.html">Return to Arcade</a>
    <div class="build">Created by JGDev</div>
  </div>

  <img src="reactologo.png" alt="Reacto Logo" class="logo">

  <p class="subtitle">Wait for green. Then tap fast.</p>

  <div class="mode-bar">
    <button type="button" class="mode-btn active" data-rounds="3">Quick (3)</button>
    <button type="button" class="mode-btn" data-rounds="5">Full (5)</button>
  </div>

  <div id="status" class="status">Press start when ready.</div>
  <div id="roundDots" class="round-dots"></div>

  <button id="gameBtn" class="game-button">START</button>

  <section class="results">
    <div class="score-card">
      <div class="label">LAST REACTION</div>
      <div id="lastScore" class="value">--</div>
    </div>

    <div class="score-card">
      <div class="label">BEST REACTION</div>
      <div id="bestScore" class="value">--</div>
    </div>

    <div class="score-card">
      <div class="label">SESSION AVG</div>
      <div id="avgScore" class="value">--</div>
    </div>
  </section>

  <div class="history-row" id="historyRow"></div>

  <div class="note">Auto-advances after each round · Space to start · Clicking before green resets the round</div>

  <div id="leaderboard"></div>

</main><script src="../../assets/leaderboard.js?v=7"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'reacto', 'default');

let totalRounds = 3;
let state = "idle";
let startTime = 0;
let timeout = null;
let advanceTimeout = null;
let roundNum = 0;
let sessionTimes = [];

const gameBtn = document.getElementById("gameBtn");
const statusText = document.getElementById("status");
const roundDots = document.getElementById("roundDots");
const modeBtns = document.querySelectorAll(".mode-btn");
const lastScore = document.getElementById("lastScore");
const bestScore = document.getElementById("bestScore");
const avgScore = document.getElementById("avgScore");
const historyRow = document.getElementById("historyRow");

let bestTime = localStorage.getItem("reactoBestTime");

if (bestTime) {
  bestScore.textContent = Number(bestTime).toFixed(3) + "s";
}

function popScore(element) {
  element.classList.remove("pop");
  void element.offsetWidth;
  element.classList.add("pop");
}

function updateHistory() {
  historyRow.innerHTML = "";
  sessionTimes.forEach((t, i) => {
    const pill = document.createElement("span");
    pill.className = "history-pill";
    pill.textContent = "R" + (i + 1) + ": " + t.toFixed(3) + "s";
    historyRow.appendChild(pill);
  });
}

function updateRoundDots() {
  roundDots.innerHTML = "";
  const inSession = roundNum > 0 || sessionTimes.length > 0 || state === "waiting" || state === "ready";
  if (!inSession && roundNum === 0 && sessionTimes.length === 0) return;

  for (let i = 0; i < totalRounds; i++) {
    const dot = document.createElement("span");
    dot.className = "round-dot";
    if (i < sessionTimes.length) dot.classList.add("done");
    else if (i === roundNum && state !== "idle") dot.classList.add("current");
    roundDots.appendChild(dot);
  }
}

function setModeButtonsEnabled(enabled) {
  modeBtns.forEach(btn => { btn.disabled = !enabled; });
}

function resetButton() {
  clearTimeout(advanceTimeout);
  state = "idle";
  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  gameBtn.classList.remove("waiting");
  gameBtn.textContent = roundNum === 0 ? "START" : "NEXT";
  updateRoundDots();
}

function startSession() {
  roundNum = 0;
  sessionTimes = [];
  avgScore.textContent = "--";
  setModeButtonsEnabled(false);
  updateHistory();
  startRound();
}

function startRound() {
  clearTimeout(advanceTimeout);
  state = "waiting";
  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  gameBtn.classList.add("waiting");
  gameBtn.textContent = "WAIT";
  statusText.textContent = "Round " + (roundNum + 1) + "/" + totalRounds + " — wait for green...";
  lastScore.textContent = "--";
  updateRoundDots();

  const delay = Math.random() * 3000 + 2000;

  timeout = setTimeout(() => {
    state = "ready";
    gameBtn.classList.remove("waiting");
    gameBtn.classList.add("ready");
    gameBtn.textContent = "TAP!";
    statusText.textContent = "GO!";
    startTime = performance.now();
    updateRoundDots();
  }, delay);
}

function tooSoon() {
  clearTimeout(timeout);
  state = "idle";

  statusText.textContent = "Too soon — round " + (roundNum + 1) + " failed.";
  lastScore.textContent = "FAIL";
  popScore(lastScore);

  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("error");
  void gameBtn.offsetWidth;
  gameBtn.classList.add("error");

  setTimeout(() => {
    resetButton();
    statusText.textContent = "Tap NEXT to retry this round.";
  }, 400);
}

function finishRound() {
  const reactionTime = (performance.now() - startTime) / 1000;
  const formattedTime = reactionTime.toFixed(3) + "s";

  lastScore.textContent = formattedTime;
  popScore(lastScore);
  sessionTimes.push(reactionTime);
  roundNum++;
  updateHistory();

  if (!bestTime || reactionTime < Number(bestTime)) {
    bestTime = reactionTime;
    localStorage.setItem("reactoBestTime", bestTime);
    bestScore.textContent = formattedTime;
    statusText.textContent = "New best reaction!";
    popScore(bestScore);
  }

  if (roundNum >= totalRounds) {
    const sessionBestMs = Math.round(Math.min(...sessionTimes) * 1000);
    DeskArcadeLeaderboard.trySubmit('reacto', sessionBestMs, { panel: lbPanel, boardKey: 'default' }).catch(() => {});

    const avg = sessionTimes.reduce((a, b) => a + b, 0) / totalRounds;
    avgScore.textContent = avg.toFixed(3) + "s";
    statusText.textContent = "Session complete — average " + avg.toFixed(3) + "s";
    roundNum = 0;
    sessionTimes = [];
    setModeButtonsEnabled(true);
    resetButton();
    gameBtn.textContent = "START";
    roundDots.innerHTML = "";
    return;
  }

  const avgSoFar = sessionTimes.reduce((a, b) => a + b, 0) / sessionTimes.length;
  avgScore.textContent = avgSoFar.toFixed(3) + "s";
  statusText.textContent = "Round " + roundNum + "/" + totalRounds + " done";
  state = "advancing";
  gameBtn.classList.remove("ready");
  gameBtn.classList.remove("waiting");
  gameBtn.textContent = "···";
  updateRoundDots();

  advanceTimeout = setTimeout(() => {
    startRound();
  }, 1200);
}

function handleAction() {
  if (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen()) return;

  if (state === "idle") {
    if (roundNum === 0 && sessionTimes.length === 0) startSession();
    else startRound();
  } else if (state === "waiting") {
    tooSoon();
  } else if (state === "ready") {
    finishRound();
  }
}

modeBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.disabled) return;
    totalRounds = Number(btn.dataset.rounds);
    modeBtns.forEach(b => b.classList.toggle("active", b === btn));
  });
});

gameBtn.addEventListener("click", handleAction);

document.addEventListener("keydown", (e) => {
  if (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen()) return;

  if (e.code === "Space") {
    e.preventDefault();
    handleAction();
  }
});
</script>

</body>
</html>
