<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Viper | DeskArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">

  <style>
    :root {
      --accent: #10b981;
      --accent-2: #34d399;
      --green: var(--accent);
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #38bdf8;
      --panel: var(--surface-strong);
      --text-soft: var(--text-dim);
      --border-soft: var(--border);
    }

    .logo-img {
      height: 52px;
      width: auto;
      max-width: min(420px, 55vw);
      display: block;
      object-fit: contain;
      flex-shrink: 1;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.55));
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      overflow-x: hidden;
    }

    .game-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .game-shell::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-border), transparent);
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      flex: 1;
      min-width: 0;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      color: var(--text);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .created-by {
      color: var(--text-faint);
      font-size: 0.78rem;
      text-align: right;
      white-space: nowrap;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 18px;
    }

    .game-card, .side-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 540px;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: inset 0 2px 12px rgba(0,0,0,0.55);
      background: #0c0c17;
    }

    .canvas-wrap.shake {
      animation: screenShake 0.28s ease-in-out;
    }

    @keyframes screenShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(4px, 2px); }
      100% { transform: translate(0, 0); }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(6,6,12,0.76);
      backdrop-filter: blur(4px);
      text-align: center;
      padding: 24px;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay-box {
      max-width: 420px;
      border: 1px solid var(--border);
      background: rgba(18,18,30,0.95);
      border-radius: var(--radius-md);
      padding: 22px;
      box-shadow: var(--shadow-2);
    }

    .overlay-title {
      font-family: var(--font-display);
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      color: var(--text);
    }

    .overlay-text {
      color: var(--text-soft);
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
      background: var(--surface);
    }

    .stat.level-flash {
      animation: levelFlash 0.45s ease-in-out;
    }

    .stat.score-pop {
      animation: scorePop 0.35s ease-out;
    }

    @keyframes levelFlash {
      0% { box-shadow: 0 0 0 rgba(251,191,36,0); }
      50% {
        border-color: rgba(251,191,36,0.85);
        box-shadow: 0 0 18px rgba(251,191,36,0.4);
      }
      100% { box-shadow: 0 0 0 rgba(251,191,36,0); }
    }

    @keyframes scorePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .canvas-wrap.running {
      box-shadow:
        inset 0 2px 12px rgba(0,0,0,0.55),
        0 0 0 1px var(--accent-border),
        0 0 28px var(--accent-glow);
    }

    .speed-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fbbf24;
      text-shadow: 0 0 24px rgba(251, 191, 36, 0.45);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 2;
    }

    .speed-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .stat-label {
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-text);
    }

    button {
      font-family: var(--font-display);
    }

    select {
      font-family: var(--font-ui);
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, border-color 0.12s ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .secondary-btn {
      color: var(--text);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      box-shadow: none;
    }

    .secondary-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      filter: none;
    }

    .side-card h2 {
      margin: 0 0 12px;
      font-family: var(--font-display);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .controls-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 9px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .key {
      display: inline-block;
      min-width: 32px;
      text-align: center;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      color: var(--text);
      background: rgba(255,255,255,0.06);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      margin-right: 5px;
    }

    .settings {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }

    label {
      color: var(--text-dim);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: rgba(10,10,20,0.7);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    select:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .message {
      margin-top: 14px;
      color: #fbbf24;
      min-height: 22px;
      font-size: 0.88rem;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 48px);
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .mobile-controls button {
      padding: 0;
      font-size: 1.1rem;
    }

    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }

    @media (max-width: 860px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }

      .game-shell {
        padding: 16px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .logo-img {
        height: 44px;
      }

      .created-by {
        text-align: left;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }

      .mobile-controls {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div class="brand-block">
        <img src="gridviperlogov2.png" alt="Grid Viper Logo" class="logo-img">
      </div>
      <div class="created-by">Created by JGDev</div>
    </header>

    <section class="main-grid">
      <div class="game-card">
        <div class="stat-row">
          <div class="stat">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
          </div>
          <div class="stat">
            <div class="stat-label" id="bestLabel">Best (Normal)</div>
            <div class="stat-value" id="best">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Speed</div>
            <div class="stat-value" id="speed">1</div>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="600" height="600" aria-label="Grid Viper Snake game board"></canvas>
          <div class="speed-banner" id="speedBanner" aria-hidden="true">SPEED UP</div>
          <div class="overlay" id="overlay">
            <div class="overlay-box">
              <div class="overlay-title" id="overlayTitle">Grid Viper</div>
              <div class="overlay-text" id="overlayText">Eat the data nodes. Avoid the walls. Do not crash into yourself. Simple game. Brutal when you get cocky.</div>
              <button id="overlayButton">Start Game</button>
            </div>
          </div>
        </div>

        <div class="mobile-controls" aria-label="Mobile controls">
          <button class="up" data-dir="up">▲</button>
          <button class="left" data-dir="left">◀</button>
          <button class="down" data-dir="down">▼</button>
          <button class="right" data-dir="right">▶</button>
        </div>
      </div>

      <aside class="side-card">
        <h2>Controls</h2>
        <ul class="controls-list">
          <li><span class="key">↑</span><span class="key">W</span> Move up</li>
          <li><span class="key">↓</span><span class="key">S</span> Move down</li>
          <li><span class="key">←</span><span class="key">A</span> Move left</li>
          <li><span class="key">→</span><span class="key">D</span> Move right</li>
          <li><span class="key">Space</span> Pause / resume</li>
          <li><span class="key">R</span> Restart</li>
        </ul>

        <div class="settings">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
            <option value="chaos">Chaos</option>
          </select>

          <label for="scoreTarget">Score Target</label>
          <select id="scoreTarget">
            <option value="0" selected>Free Play</option>
            <option value="50">Reach 50</option>
            <option value="100">Reach 100</option>
            <option value="200">Reach 200</option>
          </select>
        </div>

<div class="button-row">
  <button id="startBtn">Start</button>
  <button class="secondary-btn" id="pauseBtn">Pause</button>
  <button class="secondary-btn" id="resetBtn">Reset</button>
  <button class="secondary-btn" id="homeBtn">Return to Arcade</button>
</div>

        <div class="message" id="message">Ready.</div>

        <div id="leaderboard"></div>
      </aside>
    </section>
  </main>  <script src="../../assets/leaderboard.js?v=6"></script>
  <script>
    const lbPanel = document.getElementById('leaderboard');

    function lbBoardKey() {
      return difficultyEl ? difficultyEl.value : 'normal';
    }

    function refreshLeaderboard() {
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'snake', lbBoardKey());
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const bestLabelEl = document.getElementById('bestLabel');
    const scoreStat = scoreEl.closest('.stat');
    const speedEl = document.getElementById('speed');
    const messageEl = document.getElementById('message');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayButton = document.getElementById('overlayButton');
    const difficultyEl = document.getElementById('difficulty');
    const scoreTargetEl = document.getElementById('scoreTarget');
    const speedBannerEl = document.getElementById('speedBanner');
    const canvasWrap = document.querySelector('.canvas-wrap');
    const levelStat = speedEl.closest('.stat');

    refreshLeaderboard();

const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const homeBtn = document.getElementById('homeBtn');

    const gridSize = 24;
    const tileCount = canvas.width / gridSize;

    const difficultySettings = {
      easy: { baseDelay: 155, speedStep: 2, label: 'Easy' },
      normal: { baseDelay: 125, speedStep: 3, label: 'Normal' },
      hard: { baseDelay: 100, speedStep: 4, label: 'Hard' },
      chaos: { baseDelay: 78, speedStep: 5, label: 'Chaos' }
    };

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let bestScore = 0;
    let gameLoop;
    let renderLoop = null;
    let running = false;
    let paused = false;
    let gameOver = false;
    let currentDelay = difficultySettings.normal.baseDelay;
    let lastDisplayedLevel = 1;
    let runStartedAt = 0;
    let eatPopups = [];
    let speedBannerTimer = null;
    const SOFT_OPEN_MS = 4500;

    function getScoreTarget() {
      return Number(scoreTargetEl.value) || 0;
    }

    function showSpeedBanner(level) {
      speedBannerEl.textContent = `SPEED ${level}`;
      speedBannerEl.classList.add('show');
      speedBannerEl.setAttribute('aria-hidden', 'false');
      clearTimeout(speedBannerTimer);
      speedBannerTimer = setTimeout(() => {
        speedBannerEl.classList.remove('show');
        speedBannerEl.setAttribute('aria-hidden', 'true');
      }, 900);
    }

    function bestStorageKey(diff = difficultyEl.value) {
      return `gridViperBest_${diff}`;
    }

    function loadBestScore(diff = difficultyEl.value) {
      const stored = Number(localStorage.getItem(bestStorageKey(diff)) || 0);
      const legacy = Number(localStorage.getItem('gridViperBestScore') || 0);
      return Math.max(stored, legacy);
    }

    function saveBestScore() {
      localStorage.setItem(bestStorageKey(difficultyEl.value), String(bestScore));
    }

    function syncBestForDifficulty() {
      bestScore = loadBestScore();
      bestEl.textContent = bestScore;
      bestLabelEl.textContent = `Best (${difficultySettings[difficultyEl.value].label})`;
    }

    syncBestForDifficulty();

    function resetState() {
      snake = [
        { x: 12, y: 12 },
        { x: 11, y: 12 },
        { x: 10, y: 12 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      lastDisplayedLevel = 1;
      gameOver = false;
      paused = false;
      running = false;
      currentDelay = difficultySettings[difficultyEl.value].baseDelay;
      food = createFood();
      updateStats();
      messageEl.textContent = 'Ready.';
      draw();
    }

    function getSoftOpenProgress() {
      if (!runStartedAt) return 1;
      const elapsed = Date.now() - runStartedAt;
      if (elapsed >= SOFT_OPEN_MS) return 1;
      return elapsed / SOFT_OPEN_MS;
    }

    function getTickDelay() {
      const progress = getSoftOpenProgress();
      const eased = progress * progress;
      const slowMult = 1.65 - eased * 0.65;
      return Math.round(currentDelay * slowMult);
    }

    function updateStats() {
      scoreEl.textContent = score;
      bestEl.textContent = bestScore;

      const base = difficultySettings[difficultyEl.value].baseDelay;
      const speedLevel = Math.max(1, Math.round((base - currentDelay) / 12) + 1);

      speedEl.textContent = speedLevel;

      if (speedLevel > lastDisplayedLevel) {
        lastDisplayedLevel = speedLevel;
        messageEl.textContent = `SPEED ${speedLevel}`;
        flashLevel();
        showSpeedBanner(speedLevel);
      }
    }

    function flashScore() {
      scoreStat.classList.remove('score-pop');
      void scoreStat.offsetWidth;
      scoreStat.classList.add('score-pop');
    }

    function startRenderLoop() {
      cancelAnimationFrame(renderLoop);
      const frame = () => {
        if (running && !paused) {
          decayPopups();
          draw();
          renderLoop = requestAnimationFrame(frame);
        }
      };
      renderLoop = requestAnimationFrame(frame);
    }

    function stopRenderLoop() {
      cancelAnimationFrame(renderLoop);
      renderLoop = null;
    }

    function decayPopups() {
      eatPopups = eatPopups
        .map(p => ({ ...p, life: p.life - 0.04 }))
        .filter(p => p.life > 0);
    }

    function addEatPopup(x, y) {
      eatPopups.push({
        x: x * gridSize + gridSize / 2,
        y: y * gridSize + gridSize / 2,
        life: 1,
        text: '+10'
      });
    }

    function flashLevel() {
      levelStat.classList.remove('level-flash');
      void levelStat.offsetWidth;
      levelStat.classList.add('level-flash');
    }

    function shakeScreen() {
      canvasWrap.classList.remove('shake');
      void canvasWrap.offsetWidth;
      canvasWrap.classList.add('shake');
    }

    function showOverlay(title, text, buttonText) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayButton.textContent = buttonText;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function startGame() {
      if (gameOver) resetState();
      if (running && !paused) return;

      running = true;
      paused = false;
      runStartedAt = Date.now();
      eatPopups = [];
      canvasWrap.classList.add('running');
      hideOverlay();
      messageEl.textContent = 'Hunt the data node.';
      clearTimeout(gameLoop);
      startRenderLoop();
      tick();
    }

    function pauseGame() {
      if (!running || gameOver) return;
      paused = !paused;

      if (paused) {
        clearTimeout(gameLoop);
        stopRenderLoop();
        draw();
        messageEl.textContent = 'Paused.';
        showOverlay('Paused', 'Take a breath. Then get back to it.', 'Resume');
      } else {
        hideOverlay();
        messageEl.textContent = 'Back in the grid.';
        startRenderLoop();
        tick();
      }
    }

    function restartGame() {
      clearTimeout(gameLoop);
      stopRenderLoop();
      resetState();
      startGame();
    }

    function tick() {
      if (!running || paused || gameOver) return;
      update();
      gameLoop = setTimeout(tick, getTickDelay());
    }

    function update() {
      direction = nextDirection;
      const head = { ...snake[0] };
      head.x += direction.x;
      head.y += direction.y;

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame('Wall hit. The grid wins.');
        return;
      }

      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame('You ate yourself. Rookie mistake.');
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        addEatPopup(food.x, food.y);
        flashScore();
        messageEl.textContent = randomEatMessage();
        food = createFood();
        increaseSpeed();
        updateBestScore();

        const target = getScoreTarget();
        if (target > 0 && score >= target) {
          winGame(target);
          return;
        }
      } else {
        snake.pop();
      }

      updateStats();
    }

    function increaseSpeed() {
      const setting = difficultySettings[difficultyEl.value];
      currentDelay = Math.max(55, currentDelay - setting.speedStep);
    }

    function updateBestScore() {
      if (score > bestScore) {
        bestScore = score;
        saveBestScore();
      }
    }

    function winGame(target) {
      gameOver = true;
      running = false;
      clearTimeout(gameLoop);
      stopRenderLoop();
      canvasWrap.classList.remove('running');
      updateBestScore();
      updateStats();
      draw();
      messageEl.textContent = `Target reached — ${target} points.`;
      showOverlay('Target Hit', `You reached ${target} points. Final score: ${score}.`, 'Play Again');
      DeskArcadeLeaderboard.trySubmit('snake', score, { panel: lbPanel, boardKey: lbBoardKey() }).catch(() => {});
    }

    function endGame(reason) {
      gameOver = true;
      running = false;
      clearTimeout(gameLoop);
      stopRenderLoop();
      canvasWrap.classList.remove('running');
      shakeScreen();
      updateBestScore();
      updateStats();
      draw();
      messageEl.textContent = reason;
      showOverlay('Game Over', `${reason} Final score: ${score}.`, 'Play Again');
      DeskArcadeLeaderboard.trySubmit('snake', score, { panel: lbPanel, boardKey: lbBoardKey() }).catch(() => {});
    }

    function createFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake && snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
      return newFood;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawFood();
      drawSnake();
      drawEatPopups();
    }

    function drawBackground() {
      const grad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 40,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.72
      );
      grad.addColorStop(0, '#10101c');
      grad.addColorStop(1, '#080810');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(16,185,129,0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        const pos = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(52,211,153,0.12)';
      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          if ((x + y) % 2 === 0) continue;
          ctx.fillRect(x * gridSize + gridSize / 2 - 1, y * gridSize + gridSize / 2 - 1, 2, 2);
        }
      }
    }

    function drawSnake() {
      const dead = gameOver;
      snake.forEach((segment, index) => {
        const px = segment.x * gridSize;
        const py = segment.y * gridSize;
        const inset = index === 0 ? 2 : 3;
        const t = index / Math.max(snake.length - 1, 1);

        if (dead) {
          ctx.fillStyle = index === 0 ? '#f87171' : '#ef4444';
          ctx.shadowColor = '#ef4444';
        } else {
          ctx.fillStyle = index === 0 ? '#6ee7b7' : `rgb(${16 + t * 20}, ${185 - t * 40}, ${129 - t * 20})`;
          ctx.shadowColor = '#10b981';
        }

        ctx.shadowBlur = index === 0 ? 18 : 8;
        roundRect(px + inset, py + inset, gridSize - inset * 2, gridSize - inset * 2, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (index === 0 && !dead) {
          ctx.fillStyle = '#0c0c17';
          const eyeSize = 3;
          const eyeOne = getEyePosition(segment, 1);
          const eyeTwo = getEyePosition(segment, -1);
          ctx.fillRect(px + eyeOne.x, py + eyeOne.y, eyeSize, eyeSize);
          ctx.fillRect(px + eyeTwo.x, py + eyeTwo.y, eyeSize, eyeSize);
        }
      });
    }

    function getEyePosition(segment, side) {
      if (direction.x !== 0) {
        return {
          x: direction.x > 0 ? 16 : 5,
          y: side > 0 ? 7 : 15
        };
      }
      return {
        x: side > 0 ? 7 : 15,
        y: direction.y > 0 ? 16 : 5
      };
    }

    function drawFood() {
      const px = food.x * gridSize;
      const py = food.y * gridSize;
      const cx = px + gridSize / 2;
      const cy = py + gridSize / 2;
      const pulse = Math.sin(Date.now() / 140) * 2;
      const size = 11 + pulse;

      ctx.strokeStyle = 'rgba(251,191,36,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, size + 4, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(cx, cy - size);
      ctx.lineTo(cx + size, cy);
      ctx.lineTo(cx, cy + size);
      ctx.lineTo(cx - size, cy);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff7d6';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawEatPopups() {
      eatPopups.forEach(popup => {
        ctx.save();
        ctx.globalAlpha = popup.life;
        ctx.font = 'bold 16px "JetBrains Mono", monospace';
        ctx.fillStyle = '#6ee7b7';
        ctx.textAlign = 'center';
        ctx.fillText(popup.text, popup.x, popup.y - (1 - popup.life) * 28);
        ctx.restore();
      });
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function changeDirection(newDir) {
      if (!running || gameOver || paused) return;

      const goingUp = direction.y === -1;
      const goingDown = direction.y === 1;
      const goingLeft = direction.x === -1;
      const goingRight = direction.x === 1;

      if (newDir === 'up' && !goingDown) nextDirection = { x: 0, y: -1 };
      if (newDir === 'down' && !goingUp) nextDirection = { x: 0, y: 1 };
      if (newDir === 'left' && !goingRight) nextDirection = { x: -1, y: 0 };
      if (newDir === 'right' && !goingLeft) nextDirection = { x: 1, y: 0 };
    }

    function randomEatMessage() {
      const messages = [
        'Node consumed.',
        'Clean bite.',
        'Nom Nom Nom.',
        'You are getting longer. That is not always good.',
        'Nice. Do not get smug.',
        'Another one down.'
      ];
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function shouldIgnoreGameKeys(event) {
      if (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen()) return true;
      const tag = event.target && event.target.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    }

    document.addEventListener('keydown', (event) => {
      if (shouldIgnoreGameKeys(event)) return;

      const key = event.key.toLowerCase();

      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(key)) {
        event.preventDefault();
      }

      if (key === 'arrowup' || key === 'w') changeDirection('up');
      if (key === 'arrowdown' || key === 's') changeDirection('down');
      if (key === 'arrowleft' || key === 'a') changeDirection('left');
      if (key === 'arrowright' || key === 'd') changeDirection('right');
      if (key === ' ') pauseGame();
      if (key === 'r') restartGame();
    });

    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => changeDirection(button.dataset.dir));
    });

    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', pauseGame);
    resetBtn.addEventListener('click', () => {
      clearTimeout(gameLoop);
      stopRenderLoop();
      canvasWrap.classList.remove('running');
      runStartedAt = 0;
      eatPopups = [];
      resetState();
      showOverlay('Grid Viper', 'Eat the data nodes. Avoid the walls. Do not crash into yourself.', 'Start Game');
    });
    homeBtn.addEventListener('click', () => {
      window.location.href = '../../';
    });
    overlayButton.addEventListener('click', () => {
      if (paused) {
        pauseGame();
      } else {
        startGame();
      }
    });

    difficultyEl.addEventListener('change', () => {
      clearTimeout(gameLoop);
      stopRenderLoop();
      canvasWrap.classList.remove('running');
      runStartedAt = 0;
      eatPopups = [];
      resetState();
      syncBestForDifficulty();
      refreshLeaderboard();
      showOverlay('Difficulty Changed', `${difficultySettings[difficultyEl.value].label} mode loaded. Start when ready.`, 'Start Game');
    });

    resetState();
    draw();
  </script>
</body>
</html>
