<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shockline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#f59e0b;
  --accent-2:#fbbf24;
  --green:var(--accent);
  --red:#ef4444;
  --yellow:#fbbf24;
  --blue:#38bdf8;
  --panel:var(--surface-strong);
  --text-soft:var(--text-dim);
  --border-soft:var(--border);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.game-shell{
  width:min(1100px,100%);
  position:relative;
  border:1px solid var(--border);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
  border-radius:var(--radius-lg);
  padding:16px 18px;
}

.game-shell::before{
  content:"";
  position:absolute;
  top:0;
  left:10%;
  right:10%;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--accent-border), transparent);
  pointer-events:none;
}

.logo{
  display:block;
  height:56px;
  width:auto;
  max-width:min(420px,55vw);
  object-fit:contain;
  margin:0 auto 10px;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.subtitle{
  text-align:center;
  color:var(--text-dim);
  font-size:0.95rem;
  margin-bottom:6px;
}

.meta{
  text-align:center;
  font-size:0.8rem;
  color:var(--text-faint);
  margin-bottom:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:12px;
}

.stat{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px;
  background:var(--surface);
  text-align:center;
}

.stat-label{
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  color:var(--text-faint);
  letter-spacing:0.14em;
}

.stat-value{
  margin-top:4px;
  font-family:var(--font-mono);
  font-size:1.25rem;
  font-weight:700;
  color:var(--accent-text);
}

.status-ready{color:var(--accent-text);}
.status-charged{color:var(--blue);}
.status-active{color:var(--yellow);}
.status-shock{color:var(--red);}
.status-clear{color:#34d399;}

.game-area{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
    #0c0c17;
  background-size:28px 28px;
  overflow:hidden;
  box-shadow:inset 0 2px 12px rgba(0,0,0,0.55);
  transition:box-shadow 0.25s ease, border-color 0.25s ease;
}

.game-area.active{
  border-color:var(--accent-border);
  box-shadow:
    inset 0 2px 12px rgba(0,0,0,0.55),
    0 0 28px var(--accent-glow);
}

.game-area.charged{
  border-color:rgba(56,189,248,0.35);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  cursor:none;
  touch-action:none;
}

.message{
  text-align:center;
  margin:10px 0;
  color:var(--text-dim);
  font-size:0.95rem;
}

.message.shock-message{
  color:var(--red);
  animation:shockTextPulse 0.28s ease;
}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
}

button{
  font-family:var(--font-display);
  font-weight:600;
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text-dim);
  border-radius:var(--radius-pill);
  padding:8px 18px;
  cursor:pointer;
  letter-spacing:0.08em;
  text-transform:uppercase;
  transition:color 0.18s ease, border-color 0.18s ease, background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
}

button:hover{
  color:var(--text);
  border-color:var(--accent-border);
  background:var(--accent-soft);
  transform:translateY(-1px);
}

button.active{
  border-color:transparent;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  color:#fff;
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
}

.home-controls{
  margin-top:10px;
}

#homeBtn{
  color:var(--text-dim);
  border-color:var(--border-strong);
}

#homeBtn:hover{
  color:var(--text);
  border-color:var(--accent-border);
  background:var(--accent-soft);
}

.shake{ animation:shake 0.22s linear; }
.flash-fail{ animation:failFlash 0.3s ease; }
.flash-win{ animation:winFlash 0.65s ease; }

@keyframes shake{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-7px,3px);}
  40%{transform:translate(6px,-3px);}
  60%{transform:translate(-4px,2px);}
  80%{transform:translate(4px,-2px);}
}

@keyframes failFlash{
  50%{
    box-shadow:
      0 0 36px rgba(239,68,68,0.55),
      inset 0 0 36px rgba(239,68,68,0.18);
  }
}

@keyframes winFlash{
  30%{
    box-shadow:
      0 0 44px rgba(245,158,11,0.55),
      inset 0 0 40px rgba(245,158,11,0.22);
  }
  65%{
    box-shadow:
      0 0 32px rgba(251,191,36,0.45),
      inset 0 0 32px rgba(251,191,36,0.16);
  }
}

@keyframes shockTextPulse{
  0%{transform:scale(1);}
  45%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

@media (max-width:700px){
  .stats{grid-template-columns:1fr;}
  .game-shell{padding:12px;}
}
</style>
</head>

<body>
<main class="game-shell" id="shell">

<img src="shocklinelogo.png" class="logo" alt="Shockline Logo">

<div class="subtitle">Stay steady. Don’t break the line.</div>
<div class="meta">Created by JGDev</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">STATUS</div>
    <div class="stat-value status-ready" id="status">Ready</div>
  </div>
  <div class="stat">
    <div class="stat-label">TIME</div>
    <div class="stat-value" id="time">0.00s</div>
  </div>
  <div class="stat">
    <div class="stat-label" id="bestLabel">BEST NORMAL</div>
    <div class="stat-value" id="best">--</div>
  </div>
  <div class="stat">
    <div class="stat-label">ROUTE</div>
    <div class="stat-value" id="routeLabel">—</div>
  </div>
</div>

<div class="game-area" id="gameArea">
  <canvas id="game" width="920" height="430"></canvas>
</div>

<div class="message" id="message">
  Move into START, then press and hold. Leave START while holding to begin.
</div>

<div class="controls">
  <button id="easyBtn">Easy</button>
  <button id="normalBtn" class="active">Normal</button>
  <button id="hardBtn">Hard</button>
</div>

<div class="controls home-controls">
  <button id="homeBtn">Return to Arcade</button>
</div>

<div id="leaderboard"></div>

</main><script src="../../assets/leaderboard.js?v=7"></script>
<script>
const lbPanel = document.getElementById('leaderboard');

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const shell = document.getElementById("shell");
const gameArea = document.getElementById("gameArea");

const statusEl = document.getElementById("status");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const bestLabelEl = document.getElementById("bestLabel");
const routeLabelEl = document.getElementById("routeLabel");
const messageEl = document.getElementById("message");

const easyBtn = document.getElementById("easyBtn");
const normalBtn = document.getElementById("normalBtn");
const hardBtn = document.getElementById("hardBtn");
  const homeBtn = document.getElementById("homeBtn");

const ROUTES = [
  {
    name: "A",
    path: [
      {x:95,y:215},{x:185,y:135},{x:275,y:285},{x:390,y:145},
      {x:500,y:240},{x:615,y:120},{x:725,y:285},{x:825,y:210}
    ],
    startNode: {x:65,y:215,r:28},
    endNode: {x:855,y:210,r:28}
  },
  {
    name: "B",
    path: [
      {x:90,y:320},{x:200,y:280},{x:310,y:350},{x:420,y:200},
      {x:530,y:320},{x:640,y:180},{x:750,y:300},{x:830,y:220}
    ],
    startNode: {x:60,y:330,r:28},
    endNode: {x:860,y:215,r:28}
  },
  {
    name: "C",
    path: [
      {x:100,y:120},{x:210,y:200},{x:320,y:90},{x:430,y:260},
      {x:540,y:130},{x:650,y:250},{x:760,y:110},{x:820,y:200}
    ],
    startNode: {x:70,y:105,r:28},
    endNode: {x:850,y:205,r:28}
  }
];

let path = [];
let startNode = {x:0,y:0,r:28};
let endNode = {x:0,y:0,r:28};
let routeName = "A";

const settings = {
  easy:{safe:18,cursor:5},
  normal:{safe:13,cursor:5},
  hard:{safe:8,cursor:5}
};

let difficulty = "normal";
DeskArcadeLeaderboard.mountPanel(lbPanel, 'shockline', difficulty);
let mouse = {x:-100,y:-100};
let gameState = "ready";
let isMouseDown = false;
let hasLeftStart = false;
let startTime = 0;
let activatedAt = 0;
let elapsed = 0;
let best = null;
let progress = 0;
let sparks = [];
let failMarker = null;
const SOFT_OPEN_MS = 2800;
const softOpenBonus = { easy: 10, normal: 7, hard: 5 };

const segmentLengths = [];
let totalPathLength = 0;

function recomputePathMetrics(){
  segmentLengths.length = 0;
  totalPathLength = 0;
  for(let i = 0; i < path.length - 1; i++){
    const len = Math.hypot(path[i + 1].x - path[i].x, path[i + 1].y - path[i].y);
    segmentLengths.push(len);
    totalPathLength += len;
  }
}

function pickRandomRoute(){
  const route = ROUTES[Math.floor(Math.random() * ROUTES.length)];
  path = route.path;
  startNode = route.startNode;
  endNode = route.endNode;
  routeName = route.name;
  recomputePathMetrics();
  routeLabelEl.textContent = "Route " + routeName;
}

function getBestKey(){
  return `shocklineBest_${difficulty}`;
}

function loadBestForDifficulty(){
  best = localStorage.getItem(getBestKey());
  bestLabelEl.textContent = `BEST ${difficulty.toUpperCase()}`;
  bestEl.textContent = best ? Number(best).toFixed(2) + "s" : "--";
}

function setStatus(text, className){
  statusEl.textContent = text;
  statusEl.className = "stat-value " + className;
}

function getMousePos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x:(e.clientX - rect.left) * (canvas.width / rect.width),
    y:(e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function setPointerFromEvent(e){
  mouse = getMousePos(e);
}

canvas.addEventListener("mousemove", setPointerFromEvent);
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if(e.touches[0]) setPointerFromEvent(e.touches[0]);
}, { passive:false });

canvas.addEventListener("mousedown", e => {
  setPointerFromEvent(e);
  isMouseDown = true;

  if(gameState === "ready" && inNode(mouse,startNode)){
    startRun();
  }
});

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if(!e.touches[0]) return;
  setPointerFromEvent(e.touches[0]);
  isMouseDown = true;

  if(gameState === "ready" && inNode(mouse,startNode)){
    startRun();
  }
}, { passive:false });

function endPointer(){
  if(gameState === "playing" && hasLeftStart){
    isMouseDown = false;
    fail("You let go. Shock!");
    return;
  }

  if(gameState === "playing" && !hasLeftStart){
    reset();
    return;
  }

  isMouseDown = false;
}

window.addEventListener("mouseup", endPointer);
window.addEventListener("touchend", endPointer);
window.addEventListener("touchcancel", endPointer);

canvas.addEventListener("mouseleave", () => {
  if(gameState === "playing" && hasLeftStart){
    fail("You left the board. Shock!");
  }
});

function startRun(){
  gameState = "playing";
  hasLeftStart = false;
  activatedAt = 0;
  startTime = performance.now();
  elapsed = 0;
  progress = 0;
  sparks = [];
  gameArea.classList.remove("active");
  gameArea.classList.add("charged");
  setStatus("Charged","status-charged");
  messageEl.classList.remove("shock-message");
  messageEl.textContent = "Hold steady. Leave START while holding to activate the line.";
}

function reset(){
  pickRandomRoute();
  gameState = "ready";
  isMouseDown = false;
  hasLeftStart = false;
  activatedAt = 0;
  elapsed = 0;
  progress = 0;
  sparks = [];
  failMarker = null;
  gameArea.classList.remove("active", "charged");
  setStatus("Ready","status-ready");
  timeEl.textContent = "0.00s";
  messageEl.classList.remove("shock-message");
  messageEl.textContent = "Move into START, then press and hold. Leave START while holding to begin.";
}

function getSafeTolerance(){
  const base = settings[difficulty].safe;
  if (!hasLeftStart || !activatedAt) return base;
  const sinceActivate = performance.now() - activatedAt;
  if (sinceActivate >= SOFT_OPEN_MS) return base;
  const t = sinceActivate / SOFT_OPEN_MS;
  return base + softOpenBonus[difficulty] * (1 - t);
}

function pointAtProgress(t){
  const targetLen = t * totalPathLength;
  let travelled = 0;

  for(let i = 0; i < segmentLengths.length; i++){
    if(travelled + segmentLengths[i] >= targetLen){
      const segT = (targetLen - travelled) / segmentLengths[i];
      return {
        x: path[i].x + segT * (path[i + 1].x - path[i].x),
        y: path[i].y + segT * (path[i + 1].y - path[i].y)
      };
    }
    travelled += segmentLengths[i];
  }

  return { x: path[path.length - 1].x, y: path[path.length - 1].y };
}

function spawnSparks(x, y){
  for(let i = 0; i < 14; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3.5;
    sparks.push({
      x,
      y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1
    });
  }
}

function fail(text){
  if(gameState !== "playing") return;

  gameState = "failed";
  gameArea.classList.remove("active", "charged");
  const pathInfo = closestPathInfo(mouse);
  failMarker = pointAtProgress(pathInfo.progress);
  spawnSparks(failMarker.x, failMarker.y);
  setStatus("Shock!","status-shock");
  messageEl.textContent = text;
  messageEl.classList.remove("shock-message");
  void messageEl.offsetWidth;
  messageEl.classList.add("shock-message");

  triggerAnimation(shell,"shake");
  triggerAnimation(gameArea,"flash-fail");

  setTimeout(() => {
    messageEl.classList.remove("shock-message");
    reset();
  }, 800);
}

async function win(){
  if(gameState !== "playing") return;

  gameState = "won";
  progress = 1;
  gameArea.classList.remove("charged");
  setStatus("Clear!","status-clear");
  timeEl.textContent = elapsed.toFixed(2) + "s";

  triggerAnimation(gameArea,"flash-win");

  const isNewBest = !best || elapsed < Number(best);
  if(isNewBest){
    best = elapsed;
    localStorage.setItem(getBestKey(), best);
    bestEl.textContent = best.toFixed(2) + "s";
    messageEl.textContent = `New ${difficulty} best! ${elapsed.toFixed(2)}s`;
  } else {
    const prev = Number(best).toFixed(2);
    messageEl.textContent = `Clear in ${elapsed.toFixed(2)}s — best is ${prev}s`;
  }

  const winAt = Date.now();
  try {
    await DeskArcadeLeaderboard.trySubmit('shockline', Math.round(elapsed * 1000), { panel: lbPanel, boardKey: difficulty });
  } catch (_) {}

  while (Date.now() - winAt < 3000 || (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen())) {
    await new Promise(r => setTimeout(r, 100));
  }
  reset();
}

function triggerAnimation(element,className){
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}

function setDifficulty(level){
  difficulty = level;

  easyBtn.classList.toggle("active", level === "easy");
  normalBtn.classList.toggle("active", level === "normal");
  hardBtn.classList.toggle("active", level === "hard");

  loadBestForDifficulty();
  DeskArcadeLeaderboard.mountPanel(lbPanel, 'shockline', difficulty);
  reset();
  messageEl.textContent = `${level.charAt(0).toUpperCase() + level.slice(1)} mode selected. Start from the START node.`;
}

easyBtn.onclick = () => setDifficulty("easy");
normalBtn.onclick = () => setDifficulty("normal");
hardBtn.onclick = () => setDifficulty("hard");

homeBtn.onclick = () => {
  window.location.href = "../../";
};
  
function inNode(p,n){
  return Math.hypot(p.x - n.x, p.y - n.y) <= n.r;
}

function closestPathInfo(p){
  let closest = Infinity;
  let distanceAlong = 0;
  let travelledBefore = 0;

  for(let i=0; i<path.length-1; i++){
    const v = path[i];
    const w = path[i+1];
    const l2 = (w.x-v.x)**2 + (w.y-v.y)**2;

    let t = 0;
    if(l2 !== 0){
      t = ((p.x-v.x)*(w.x-v.x) + (p.y-v.y)*(w.y-v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
    }

    const projected = {
      x: v.x + t*(w.x-v.x),
      y: v.y + t*(w.y-v.y)
    };

    const d = Math.hypot(p.x-projected.x, p.y-projected.y);

    if(d < closest){
      closest = d;
      distanceAlong = travelledBefore + segmentLengths[i] * t;
    }

    travelledBefore += segmentLengths[i];
  }

  return {
    distance: closest,
    progress: Math.max(0, Math.min(1, distanceAlong / totalPathLength))
  };
}

function update(){
  if(gameState !== "playing") return;

  elapsed = (performance.now() - startTime) / 1000;
  timeEl.textContent = elapsed.toFixed(2) + "s";

  const pathInfo = closestPathInfo(mouse);
  progress = hasLeftStart ? pathInfo.progress : 0;

  if(!inNode(mouse, startNode)){
    if(!hasLeftStart){
      activatedAt = performance.now();
      gameArea.classList.remove("charged");
      gameArea.classList.add("active");
    }
    hasLeftStart = true;
    setStatus("Active","status-active");
  }

  if(hasLeftStart && !isMouseDown){
    fail("You let go. Shock!");
    return;
  }

  if(hasLeftStart && inNode(mouse, endNode)){
    win();
    return;
  }

  if(hasLeftStart && pathInfo.distance > getSafeTolerance()){
    fail("You broke the line. Shock!");
  }
}

function drawGrid(){
  const bg = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, 40,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.65
  );
  bg.addColorStop(0, "#10101c");
  bg.addColorStop(1, "#080810");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = "#f59e0b";
  ctx.lineWidth = 1;

  for(let x = 0; x <= canvas.width; x += 28){
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }

  for(let y = 0; y <= canvas.height; y += 28){
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawProgressTrail(){
  if(!hasLeftStart || progress <= 0) return;

  const endPoint = pointAtProgress(progress);
  const targetLen = progress * totalPathLength;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(path[0].x, path[0].y);

  let travelled = 0;
  for(let i = 0; i < segmentLengths.length; i++){
    const segEnd = travelled + segmentLengths[i];
    if(targetLen >= segEnd){
      ctx.lineTo(path[i + 1].x, path[i + 1].y);
    } else if(targetLen > travelled){
      const segT = (targetLen - travelled) / segmentLengths[i];
      ctx.lineTo(
        path[i].x + segT * (path[i + 1].x - path[i].x),
        path[i].y + segT * (path[i + 1].y - path[i].y)
      );
      break;
    } else {
      break;
    }
    travelled += segmentLengths[i];
  }

  ctx.strokeStyle = "rgba(52,211,153,0.22)";
  ctx.lineWidth = 10;
  ctx.shadowBlur = 14;
  ctx.shadowColor = "#34d399";
  ctx.stroke();

  ctx.strokeStyle = "#34d399";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 10;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(endPoint.x, endPoint.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = "#6ee7b7";
  ctx.fill();

  ctx.restore();
}

function drawSparks(){
  sparks = sparks.filter(spark => {
    spark.life -= 0.045;
    spark.x += spark.vx;
    spark.y += spark.vy;
    if(spark.life <= 0) return false;

    ctx.save();
    ctx.globalAlpha = spark.life;
    ctx.fillStyle = "#ef4444";
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ef4444";
    ctx.beginPath();
    ctx.arc(spark.x, spark.y, 2 + spark.life * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return true;
  });
}

function tracePath(){
  ctx.beginPath();
  ctx.moveTo(path[0].x,path[0].y);
  for(let i=1; i<path.length; i++){
    ctx.lineTo(path[i].x,path[i].y);
  }
}

function drawWire(){
  const safeGlowWidth = {
    easy: 36,
    normal: 24,
    hard: 14
  };

  const baseGlow = {
    easy: 34,
    normal: 24,
    hard: 14
  };

  const chargeBoost = hasLeftStart ? progress * 26 : 0;
  const activePulse = gameState === "playing" && hasLeftStart ? Math.sin(performance.now() / 120) * 3 : 0;
  const glowStrength = baseGlow[difficulty] + chargeBoost + activePulse;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  tracePath();
  ctx.strokeStyle = `rgba(245,158,11,${0.10 + progress * 0.10})`;
  ctx.lineWidth = safeGlowWidth[difficulty];
  ctx.shadowBlur = glowStrength;
  ctx.shadowColor = "#f59e0b";
  ctx.stroke();

  tracePath();
  ctx.strokeStyle = "#f59e0b";
  ctx.lineWidth = 6;
  ctx.shadowBlur = glowStrength + 4;
  ctx.shadowColor = "#f59e0b";
  ctx.stroke();

  tracePath();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#fde68a";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
}

function drawNode(node,label,color){
  ctx.save();

  const distanceToEnd = Math.hypot(mouse.x - endNode.x, mouse.y - endNode.y);
  const nearEndBoost = label === "END"
    ? Math.max(0, 1 - distanceToEnd / 180) * 34
    : 0;

  const progressBoost = label === "END" ? progress * 16 : 0;
  const startPulse = label === "START" && gameState === "ready"
    ? Math.sin(performance.now() / 220) * 4
    : 0;

  ctx.beginPath();
  ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(12,12,23,0.85)";
  ctx.fill();

  ctx.shadowBlur = 22 + nearEndBoost + progressBoost + startPulse;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = label === "END" && nearEndBoost > 0 ? 4 : 3;
  ctx.stroke();

  if(label === "START" && gameState === "playing" && !hasLeftStart){
    ctx.beginPath();
    ctx.arc(node.x, node.y, node.r + 6 + startPulse, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(56,189,248,0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();

    const safe = getSafeTolerance();
    ctx.beginPath();
    ctx.arc(node.x, node.y, safe, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(245,158,11,0.22)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.font = "bold 13px 'Space Grotesk', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, node.x, node.y);

  ctx.restore();
}

function getCursorStyle(pathInfo){
  if(gameState !== "playing" || !hasLeftStart){
    return { stroke: "#38bdf8", glow: "#38bdf8", blur: difficulty === "hard" ? 10 : 14 };
  }

  const safe = getSafeTolerance();
  const ratio = pathInfo.distance / safe;
  if(ratio > 0.88) return { stroke: "#ef4444", glow: "#ef4444", blur: 18 };
  if(ratio > 0.62) return { stroke: "#fbbf24", glow: "#fbbf24", blur: 14 };
  return { stroke: "#38bdf8", glow: "#38bdf8", blur: 14 };
}

function drawCursor(){
  const pathInfo = closestPathInfo(mouse);
  const style = getCursorStyle(pathInfo);
  const r = settings[difficulty].cursor;

  ctx.save();

  if(gameState === "playing" && hasLeftStart){
    const safe = getSafeTolerance();
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, safe, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(245,158,11,${0.12 + progress * 0.08})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
  ctx.fillStyle = "#0c0c17";
  ctx.fill();

  ctx.shadowBlur = style.blur;
  ctx.shadowColor = style.glow;
  ctx.strokeStyle = style.stroke;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

function drawFailMarker(){
  if(!failMarker) return;

  ctx.save();
  ctx.beginPath();
  ctx.arc(failMarker.x, failMarker.y, 10, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(239,68,68,0.35)";
  ctx.fill();
  ctx.strokeStyle = "#ef4444";
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 16;
  ctx.shadowColor = "#ef4444";
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(failMarker.x - 7, failMarker.y - 7);
  ctx.lineTo(failMarker.x + 7, failMarker.y + 7);
  ctx.moveTo(failMarker.x + 7, failMarker.y - 7);
  ctx.lineTo(failMarker.x - 7, failMarker.y + 7);
  ctx.strokeStyle = "#ef4444";
  ctx.lineWidth = 2;
  ctx.shadowBlur = 0;
  ctx.stroke();
  ctx.restore();
}

function drawHelpText(){
  ctx.save();

  ctx.fillStyle = "rgba(155,155,176,0.55)";
  ctx.font = "bold 11px 'Space Grotesk', sans-serif";
  ctx.textAlign = "right";
  ctx.fillText(`ROUTE ${routeName} · ${difficulty.toUpperCase()}`, canvas.width - 34, 28);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawGrid();
  drawHelpText();
  drawWire();
  drawProgressTrail();
  drawNode(startNode, "START", "#38bdf8");
  drawNode(endNode, "END", "#fbbf24");
  drawFailMarker();
  drawSparks();
  drawCursor();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loadBestForDifficulty();
reset();
loop();
</script>
</body>
</html>
