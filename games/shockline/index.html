<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shockline</title>

<style>
:root {
  --green:#8cff6a;
  --red:#ff6b4a;
  --yellow:#ffd86b;
  --blue:#7fdcff;
  --panel:rgba(7,24,8,0.94);
  --text-soft:#b9ffd2;
  --border-soft:rgba(140,255,106,0.35);
}

* { box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(140,255,106,0.14), transparent 34%),
    linear-gradient(180deg,#071106 0%,#020402 100%);
  color:var(--green);
  font-family:Consolas, Monaco, monospace;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.game-shell{
  width:min(1100px,100%);
  border:1px solid var(--border-soft);
  background:var(--panel);
  box-shadow:0 0 18px rgba(140,255,106,0.35), inset 0 0 28px rgba(140,255,106,0.08);
  border-radius:22px;
  padding:12px 18px 16px;
}

.logo{
  display:block;
  width:100%;
  max-width:100%;
  max-height:145px;
  object-fit:contain;
  margin:-4px auto 2px;
  filter:
    drop-shadow(0 0 10px rgba(140,255,106,0.45))
    drop-shadow(0 0 24px rgba(140,255,106,0.28));
  animation:logoPulse 3.2s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    filter:
      drop-shadow(0 0 8px rgba(140,255,106,0.35))
      drop-shadow(0 0 18px rgba(140,255,106,0.22));
    transform:scale(1);
  }
  50%{
    filter:
      drop-shadow(0 0 14px rgba(140,255,106,0.65))
      drop-shadow(0 0 34px rgba(140,255,106,0.42));
    transform:scale(1.015);
  }
}

.subtitle{
  text-align:center;
  color:var(--text-soft);
  font-size:0.95rem;
  margin-bottom:6px;
}

.meta{
  text-align:center;
  font-size:0.8rem;
  color:rgba(185,255,210,0.7);
  margin-bottom:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:12px;
}

.stat{
  border:1px solid var(--border-soft);
  border-radius:14px;
  padding:10px;
  background:rgba(0,0,0,0.22);
  text-align:center;
}

.stat-label{
  font-size:0.7rem;
  color:rgba(185,255,210,0.7);
  letter-spacing:0.12em;
}

.stat-value{
  margin-top:4px;
  font-size:1.25rem;
  text-shadow:0 0 10px rgba(140,255,106,0.35);
}

.status-ready{color:var(--green);}
.status-charged{color:var(--blue);}
.status-active{color:var(--yellow);}
.status-shock{color:var(--red);}
.status-clear{color:var(--green);}

.game-area{
  border:1px solid var(--border-soft);
  border-radius:18px;
  background:
    linear-gradient(rgba(140,255,106,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140,255,106,0.05) 1px, transparent 1px),
    rgba(0,0,0,0.38);
  background-size:28px 28px;
  overflow:hidden;
  box-shadow:inset 0 0 32px rgba(0,0,0,0.6);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  cursor:none;
}

.message{
  text-align:center;
  margin:10px 0;
  color:var(--text-soft);
  font-size:0.95rem;
}

.message.shock-message{
  color:var(--red);
  text-shadow:
    0 0 8px rgba(255,107,74,0.85),
    0 0 22px rgba(255,107,74,0.55);
  animation:shockTextPulse 0.28s ease;
}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
}

button{
  font-family:Consolas, Monaco, monospace;
  border:1px solid var(--green);
  background:rgba(140,255,106,0.08);
  color:var(--green);
  border-radius:999px;
  padding:8px 16px;
  cursor:pointer;
  letter-spacing:0.08em;
  text-transform:uppercase;
  box-shadow:0 0 12px rgba(140,255,106,0.16);
}

button:hover,
button.active{
  .home-controls {
  margin-top: 10px;
}

#homeBtn {
  border-color: var(--blue);
  color: var(--blue);
  box-shadow: 0 0 12px rgba(127,220,255,0.25);
}

#homeBtn:hover {
  background: var(--blue);
  color: #061006;
  box-shadow: 0 0 22px rgba(127,220,255,0.55);
}
  background:var(--green);
  color:#061006;
  box-shadow:0 0 22px rgba(140,255,106,0.45);
}

.shake{ animation:shake 0.22s linear; }
.flash-fail{ animation:failFlash 0.3s ease; }
.flash-win{ animation:winFlash 0.65s ease; }

@keyframes shake{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-7px,3px);}
  40%{transform:translate(6px,-3px);}
  60%{transform:translate(-4px,2px);}
  80%{transform:translate(4px,-2px);}
}

@keyframes failFlash{
  50%{
    box-shadow:
      0 0 42px rgba(255,107,74,0.75),
      inset 0 0 42px rgba(255,107,74,0.25);
  }
}

@keyframes winFlash{
  30%{
    box-shadow:
      0 0 70px rgba(140,255,106,0.95),
      inset 0 0 58px rgba(140,255,106,0.35);
  }
  65%{
    box-shadow:
      0 0 42px rgba(255,216,107,0.75),
      inset 0 0 46px rgba(255,216,107,0.22);
  }
}

@keyframes shockTextPulse{
  0%{transform:scale(1);}
  45%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

@media (max-width:700px){
  .stats{grid-template-columns:1fr;}
  .game-shell{padding:12px;}
}
</style>
</head>

<body>
<main class="game-shell" id="shell">

<img src="shocklinelogo.png" class="logo" alt="Shockline Logo">

<div class="subtitle">Stay steady. Don’t break the line.</div>
<div class="meta">Created by Jason / build v1.2</div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">STATUS</div>
    <div class="stat-value status-ready" id="status">Ready</div>
  </div>
  <div class="stat">
    <div class="stat-label">TIME</div>
    <div class="stat-value" id="time">0.00s</div>
  </div>
  <div class="stat">
    <div class="stat-label" id="bestLabel">BEST NORMAL</div>
    <div class="stat-value" id="best">--</div>
  </div>
</div>

<div class="game-area" id="gameArea">
  <canvas id="game" width="920" height="430"></canvas>
</div>

<div class="message" id="message">
  Move into START, then press and hold. Leave START while holding to begin.
</div>

<div class="controls">
  <button id="easyBtn">Easy</button>
  <button id="normalBtn" class="active">Normal</button>
  <button id="hardBtn">Hard</button>
</div>

<div class="controls home-controls">
  <button id="homeBtn">Arcade</button>
</div>

</main>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const shell = document.getElementById("shell");
const gameArea = document.getElementById("gameArea");

const statusEl = document.getElementById("status");
const timeEl = document.getElementById("time");
const bestEl = document.getElementById("best");
const bestLabelEl = document.getElementById("bestLabel");
const messageEl = document.getElementById("message");

const easyBtn = document.getElementById("easyBtn");
const normalBtn = document.getElementById("normalBtn");
const hardBtn = document.getElementById("hardBtn");
  const homeBtn = document.getElementById("homeBtn");

const path = [
  {x:95,y:215},
  {x:185,y:135},
  {x:275,y:285},
  {x:390,y:145},
  {x:500,y:240},
  {x:615,y:120},
  {x:725,y:285},
  {x:825,y:210}
];

const startNode = {x:65,y:215,r:28};
const endNode = {x:855,y:210,r:28};

const settings = {
  easy:{safe:18,cursor:5},
  normal:{safe:13,cursor:5},
  hard:{safe:8,cursor:5}
};

let difficulty = "normal";
let mouse = {x:-100,y:-100};
let gameState = "ready";
let isMouseDown = false;
let hasLeftStart = false;
let startTime = 0;
let elapsed = 0;
let best = null;
let progress = 0;

const segmentLengths = [];
let totalPathLength = 0;

for(let i=0; i<path.length-1; i++){
  const len = Math.hypot(path[i+1].x-path[i].x, path[i+1].y-path[i].y);
  segmentLengths.push(len);
  totalPathLength += len;
}

function getBestKey(){
  return `shocklineBest_${difficulty}`;
}

function loadBestForDifficulty(){
  best = localStorage.getItem(getBestKey());
  bestLabelEl.textContent = `BEST ${difficulty.toUpperCase()}`;
  bestEl.textContent = best ? Number(best).toFixed(2) + "s" : "--";
}

function setStatus(text, className){
  statusEl.textContent = text;
  statusEl.className = "stat-value " + className;
}

function getMousePos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x:(e.clientX - rect.left) * (canvas.width / rect.width),
    y:(e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

canvas.addEventListener("mousemove", e => {
  mouse = getMousePos(e);
});

canvas.addEventListener("mousedown", e => {
  mouse = getMousePos(e);
  isMouseDown = true;

  if(gameState === "ready" && inNode(mouse,startNode)){
    startRun();
  }
});

window.addEventListener("mouseup", () => {
  if(gameState === "playing" && hasLeftStart){
    isMouseDown = false;
    fail("You let go. Shock!");
    return;
  }

  if(gameState === "playing" && !hasLeftStart){
    reset();
    return;
  }

  isMouseDown = false;
});

canvas.addEventListener("mouseleave", () => {
  if(gameState === "playing" && hasLeftStart){
    fail("You left the board. Shock!");
  }
});

function startRun(){
  gameState = "playing";
  hasLeftStart = false;
  startTime = performance.now();
  elapsed = 0;
  progress = 0;
  setStatus("Charged","status-charged");
  messageEl.classList.remove("shock-message");
  messageEl.textContent = "Hold steady. Leave START while holding to activate the line.";
}

function reset(){
  gameState = "ready";
  isMouseDown = false;
  hasLeftStart = false;
  elapsed = 0;
  progress = 0;
  setStatus("Ready","status-ready");
  timeEl.textContent = "0.00s";
  messageEl.classList.remove("shock-message");
  messageEl.textContent = "Move into START, then press and hold. Leave START while holding to begin.";
}

function fail(text){
  if(gameState !== "playing") return;

  gameState = "failed";
  setStatus("Shock!","status-shock");
  messageEl.textContent = text;
  messageEl.classList.remove("shock-message");
  void messageEl.offsetWidth;
  messageEl.classList.add("shock-message");

  triggerAnimation(shell,"shake");
  triggerAnimation(gameArea,"flash-fail");

  setTimeout(() => {
    messageEl.classList.remove("shock-message");
    reset();
  }, 800);
}

function win(){
  if(gameState !== "playing") return;

  gameState = "won";
  progress = 1;
  setStatus("Clear!","status-clear");
  timeEl.textContent = elapsed.toFixed(2) + "s";
messageEl.textContent = `Finished! Time: ${elapsed.toFixed(2)}s`;

  triggerAnimation(gameArea,"flash-win");

  if(!best || elapsed < Number(best)){
    best = elapsed;
    localStorage.setItem(getBestKey(), best);
    bestEl.textContent = best.toFixed(2) + "s";
messageEl.textContent = `New ${difficulty} best! ${elapsed.toFixed(2)}s`;
  }

  setTimeout(reset, 3000);
}

function triggerAnimation(element,className){
  element.classList.remove(className);
  void element.offsetWidth;
  element.classList.add(className);
}

function setDifficulty(level){
  difficulty = level;

  easyBtn.classList.toggle("active", level === "easy");
  normalBtn.classList.toggle("active", level === "normal");
  hardBtn.classList.toggle("active", level === "hard");

  loadBestForDifficulty();
  reset();
  messageEl.textContent = `${level.charAt(0).toUpperCase() + level.slice(1)} mode selected. Start from the START node.`;
}

easyBtn.onclick = () => setDifficulty("easy");
normalBtn.onclick = () => setDifficulty("normal");
hardBtn.onclick = () => setDifficulty("hard");

homeBtn.onclick = () => {
  window.location.href = "../../index.html";
};
  
function inNode(p,n){
  return Math.hypot(p.x - n.x, p.y - n.y) <= n.r;
}

function closestPathInfo(p){
  let closest = Infinity;
  let distanceAlong = 0;
  let travelledBefore = 0;

  for(let i=0; i<path.length-1; i++){
    const v = path[i];
    const w = path[i+1];
    const l2 = (w.x-v.x)**2 + (w.y-v.y)**2;

    let t = 0;
    if(l2 !== 0){
      t = ((p.x-v.x)*(w.x-v.x) + (p.y-v.y)*(w.y-v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
    }

    const projected = {
      x: v.x + t*(w.x-v.x),
      y: v.y + t*(w.y-v.y)
    };

    const d = Math.hypot(p.x-projected.x, p.y-projected.y);

    if(d < closest){
      closest = d;
      distanceAlong = travelledBefore + segmentLengths[i] * t;
    }

    travelledBefore += segmentLengths[i];
  }

  return {
    distance: closest,
    progress: Math.max(0, Math.min(1, distanceAlong / totalPathLength))
  };
}

function update(){
  if(gameState !== "playing") return;

elapsed = (performance.now() - startTime) / 1000;

if (gameState === "playing") {
  timeEl.textContent = elapsed.toFixed(2) + "s";
}

  const pathInfo = closestPathInfo(mouse);
  progress = hasLeftStart ? pathInfo.progress : 0;

  if(!inNode(mouse,startNode)){
    hasLeftStart = true;
    setStatus("Active","status-active");
  }

  if(hasLeftStart && !isMouseDown){
    fail("You let go. Shock!");
    return;
  }

  if(hasLeftStart && inNode(mouse,endNode)){
    win();
    return;
  }

  if(hasLeftStart && pathInfo.distance > settings[difficulty].safe){
    fail("You broke the line. Shock!");
  }
}

function drawGrid(){
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = "#8cff6a";
  ctx.lineWidth = 1;

  for(let x=0; x<=canvas.width; x+=28){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,canvas.height);
    ctx.stroke();
  }

  for(let y=0; y<=canvas.height; y+=28){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(canvas.width,y);
    ctx.stroke();
  }

  ctx.restore();
}

function tracePath(){
  ctx.beginPath();
  ctx.moveTo(path[0].x,path[0].y);
  for(let i=1; i<path.length; i++){
    ctx.lineTo(path[i].x,path[i].y);
  }
}

function drawWire(){
  const safeGlowWidth = {
    easy: 36,
    normal: 24,
    hard: 14
  };

  const baseGlow = {
    easy: 34,
    normal: 24,
    hard: 14
  };

  const chargeBoost = hasLeftStart ? progress * 26 : 0;
  const activePulse = gameState === "playing" && hasLeftStart ? Math.sin(performance.now() / 120) * 3 : 0;
  const glowStrength = baseGlow[difficulty] + chargeBoost + activePulse;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  tracePath();
  ctx.strokeStyle = `rgba(140,255,106,${0.10 + progress * 0.10})`;
  ctx.lineWidth = safeGlowWidth[difficulty];
  ctx.shadowBlur = glowStrength;
  ctx.shadowColor = "#8cff6a";
  ctx.stroke();

  tracePath();
  ctx.strokeStyle = "#8cff6a";
  ctx.lineWidth = 6;
  ctx.shadowBlur = glowStrength + 4;
  ctx.shadowColor = "#8cff6a";
  ctx.stroke();

  tracePath();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#d8ffce";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
}

function drawNode(node,label,color){
  ctx.save();

  const distanceToEnd = Math.hypot(mouse.x - endNode.x, mouse.y - endNode.y);
  const nearEndBoost = label === "END"
    ? Math.max(0, 1 - distanceToEnd / 180) * 34
    : 0;

  const progressBoost = label === "END" ? progress * 16 : 0;

  ctx.beginPath();
  ctx.arc(node.x,node.y,node.r,0,Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fill();

  ctx.shadowBlur = 22 + nearEndBoost + progressBoost;
  ctx.shadowColor = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = label === "END" && nearEndBoost > 0 ? 4 : 3;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = color;
  ctx.font = "bold 13px Consolas, Monaco, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label,node.x,node.y);

  ctx.restore();
}

function drawCursor(){
  ctx.save();

  ctx.beginPath();
  ctx.arc(mouse.x,mouse.y,settings[difficulty].cursor,0,Math.PI*2);
  ctx.fillStyle = "#071106";
  ctx.fill();

  ctx.shadowBlur = difficulty === "hard" ? 10 : 14;
  ctx.shadowColor = "#7fdcff";
  ctx.strokeStyle = "#7fdcff";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

function drawHelpText(){
  ctx.save();

  ctx.fillStyle = "rgba(185,255,210,0.42)";
  ctx.font = "bold 11px Consolas, Monaco, monospace";
  ctx.textAlign = "left";
  ctx.fillText("HOLD CLICK + TRACE THE LINE", 34, 28);

  ctx.textAlign = "right";
  ctx.fillText(`MODE: ${difficulty.toUpperCase()}`, canvas.width - 34, 28);

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawGrid();
  drawHelpText();
  drawWire();
  drawNode(startNode,"START","#7fdcff");
  drawNode(endNode,"END","#ffd86b");
  drawCursor();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loadBestForDifficulty();
reset();
loop();
</script>
</body>
</html>
