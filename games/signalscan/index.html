<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Scan | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root{
  --accent:#14b8a6;
  --accent-2:#2dd4bf;
  --green:var(--accent);
  --green-soft:var(--text-dim);
  --yellow:#f59e0b;
  --red:#ef4444;
  --panel:var(--surface);
}

.digit.wrong{
  background:rgba(239,68,68,0.3);
  color:#fff;
}

.board-correct{
  box-shadow:0 0 0 1px var(--accent-border), 0 8px 22px var(--accent-glow);
  border-radius:var(--radius-md);
}

.board-wrong{
  box-shadow:0 0 0 1px rgba(239,68,68,0.45), 0 8px 22px rgba(239,68,68,0.22);
  border-radius:var(--radius-md);
}

body{
  color:var(--text);
  font-family:var(--font-ui);
  display:flex;
  justify-content:center;
  padding:20px;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:1000px;
  width:100%;
  padding:22px 24px;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
}

.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.secondary{
  box-shadow:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border-strong);
  padding:10px 18px;
  border-radius:var(--radius-sm);
  background:var(--surface);
  color:var(--text);
  font-family:var(--font-display);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.03em;
  cursor:pointer;
  transition:border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

.secondary:hover{
  border-color:var(--accent-border);
  background:var(--accent-soft);
  transform:translateY(-1px);
}

.logo{
  text-align:center;
}

.logo img{
  height:54px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.subtitle{
  text-align:center;
  color:var(--text-dim);
}

.creator{
  text-align:center;
  margin-bottom:20px;
  font-size:0.8rem;
  color:var(--text-faint);
}

.panel{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:28px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}

.stat{
  text-align:center;
  padding:14px;
  border-radius:var(--radius-md);
  border:1px solid var(--border);
  background:var(--surface);
}

.stat span{
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:2px;
}

.stat strong{
  font-family:var(--font-mono);
  font-size:1.5rem;
  font-weight:700;
  color:var(--accent-text);
}

.message{
  text-align:center;
  color:var(--yellow);
  margin-bottom:15px;
}

.digit-board{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  min-height:140px;
}

.digit{
  width:50px;
  height:50px;
  border-radius:var(--radius-sm);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-weight:700;
  font-size:1.7rem;
  color:var(--accent-text);
  border:1px solid var(--border);
  background:linear-gradient(180deg, #0b0b15, #07070f);
}

.digit.target{
  color:var(--yellow);
  background:rgba(245,158,11,0.16);
  border-color:rgba(245,158,11,0.45);
  box-shadow:0 0 0 1px rgba(245,158,11,0.25);
}

.digit.hidden{
  opacity:0;
  transition:0.35s;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.25);}
  100%{transform:scale(1);}
}

.digit.pulse{animation:pulse 0.35s;}

.countdown{
  position:absolute;
  top:15px;
  right:20px;
  font-family:var(--font-mono);
  font-weight:700;
  font-size:2.2rem;
  color:var(--yellow);
  opacity:0;
}

.countdown.urgent{
  color:var(--red);
  transform:scale(1.2);
}

.answer-area{
  display:none;
  text-align:center;
  margin-top:20px;
}

.answer-area.active{display:block;}

input{
  font-family:var(--font-mono);
  font-size:1.4rem;
  padding:12px;
  width:240px;
  text-align:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);
  background:rgba(10,10,20,0.7);
  color:var(--text);
  transition:border-color 0.18s ease, box-shadow 0.18s ease;
}

input:focus{
  outline:none;
  border-color:var(--accent-border);
  box-shadow:0 0 0 3px var(--accent-soft);
}

.controls{
  text-align:center;
  margin-top:10px;
}

button{
  padding:12px 22px;
  margin:5px;
  border:none;
  border-radius:var(--radius-sm);
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  color:#fff;
  font-family:var(--font-display);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.03em;
  cursor:pointer;
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  transition:transform 0.18s ease, filter 0.18s ease;
}

button:hover:not(:disabled){
  transform:translateY(-1px);
  filter:brightness(1.08);
}

button:disabled{opacity:0.5;cursor:default;}

.history{
  margin-top:18px;
  text-align:center;
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--text-dim);
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
<a class="arcade-btn da-back" href="../../index.html">Back to Arcade</a>
<button class="secondary" onclick="resetGame()">Reset</button>
</div>

<div class="logo">
<img src="signalscanlogo.png">
</div>

<div class="subtitle">Memorise highlighted digits → type left to right</div>
<div class="creator">Created by JGDev</div>

<div class="panel">

<div id="countdown" class="countdown"></div>

<div class="stats">
<div class="stat"><span>ROUND</span><strong id="round">1</strong></div>
<div class="stat"><span>STREAK</span><strong id="streak">0</strong></div>
<div class="stat"><span>BEST</span><strong id="best">0</strong></div>
<div class="stat"><span>TIME</span><strong id="time">4.0s</strong></div>
</div>

<div id="message" class="message">Press Start</div>

<div id="digitBoard" class="digit-board"></div>

<div id="answerArea" class="answer-area">
<input id="answerInput" placeholder="Enter digits">
</div>

<div class="controls">
<button id="startBtn">Start</button>
<button id="submitBtn" disabled>Submit</button>
<button id="nextBtn" style="display:none;">Next</button>
</div>

<div id="history" class="history">None yet</div>

<div id="leaderboard"></div>

</div>
</div><script src="../../assets/leaderboard.js?v=4"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'signalscan', 'default');

let round = 1;
let streak = 0;
let best = Number(localStorage.getItem("signalscanBest")) || 0;

let digits = [];
let targets = [];
let answer = "";
let accepting = false;
let history = [];

// DOM
const startBtn = document.getElementById("startBtn");
const submitBtn = document.getElementById("submitBtn");
const answerInput = document.getElementById("answerInput");
const answerArea = document.getElementById("answerArea");
const digitBoard = document.getElementById("digitBoard");
const message = document.getElementById("message");
const historyEl = document.getElementById("history");
const countdownEl = document.getElementById("countdown");
const nextBtn = document.getElementById("nextBtn");

// ---------- SETTINGS ----------
function getTotal(){ return Math.min(22 + round * 3, 60); }
function getTargets(){ return Math.min(3 + Math.floor(round * 0.8), 12); }
function getTime(){ return round <= 5 ? 4000 : Math.max(4000 - (round * 80), 1800); }

// ---------- UI ----------
function updateUI(){
  document.getElementById("round").textContent = round;
  document.getElementById("streak").textContent = streak;
  document.getElementById("best").textContent = best;
  document.getElementById("time").textContent = (getTime()/1000).toFixed(1) + "s";
}

// ---------- GENERATE ----------
function generate(){
  digits = [];
  targets = [];

  for(let i=0;i<getTotal();i++){
    digits.push(Math.floor(Math.random()*10));
  }

  while(targets.length < getTargets()){
    let r = Math.floor(Math.random()*digits.length);
    if(!targets.includes(r)) targets.push(r);
  }

  targets.sort((a,b)=>a-b);
  answer = targets.map(i=>digits[i]).join("");
}

// ---------- RENDER ----------
function render(hidden=false){
  digitBoard.innerHTML = "";

  digits.forEach((d,i)=>{
    const el = document.createElement("div");
    el.className = "digit";

    if(targets.includes(i)) el.classList.add("target");
    if(hidden) el.classList.add("hidden");

    el.textContent = hidden ? "" : d;
    digitBoard.appendChild(el);
  });
}

// ---------- PULSE ----------
function pulse(){
  document.querySelectorAll(".digit").forEach((el,i)=>{
    if(targets.includes(i)){
      el.classList.add("pulse");
      setTimeout(()=>el.classList.remove("pulse"), 300);
    }
  });
}

// ---------- END COUNTDOWN ----------
function endCountdown(){
  return new Promise(resolve => {

    let count = 3;
    countdownEl.classList.remove("urgent");
    countdownEl.style.opacity = 1;
    countdownEl.textContent = count;

    const int = setInterval(()=>{
      count--;

      if(count > 0){
        countdownEl.textContent = count;

        if(count === 1){
          countdownEl.classList.add("urgent");
        }
      }
      else if(count === 0){
        countdownEl.textContent = "GO";
      }
      else{
        clearInterval(int);
        countdownEl.style.opacity = 0;
        countdownEl.classList.remove("urgent");
        resolve();
      }

    }, 500);
  });
}

// ---------- ROUND FLOW ----------
async function nextRound(){
  accepting = false;
  submitBtn.disabled = true;
  nextBtn.style.display = "none";
  answerArea.classList.remove("active");

  digitBoard.classList.remove("board-correct","board-wrong");

  generate();
  render();
  updateUI();

  answerInput.value = "";
  answerInput.maxLength = answer.length;

  message.textContent = "Memorise " + answer.length + " highlighted digits in order";

  await new Promise(r => setTimeout(r, getTime() - 2000));

  await endCountdown();

  pulse();
  await new Promise(r => setTimeout(r, 300));

  render(true);

  answerArea.classList.add("active");
  answerInput.focus();
  submitBtn.disabled = false;
  accepting = true;

  message.textContent = "Enter digits left → right";
}

// ---------- SUBMIT ----------
function submit(){
  if(!accepting) return;

  accepting = false;
  const val = answerInput.value;
  submitBtn.disabled = true;

  render(false);

  digitBoard.classList.remove("board-correct","board-wrong");

  if(val === answer){
    digitBoard.classList.add("board-correct");
    streak++;
    round++;

    if(round - 1 > best){
      best = round - 1;
      localStorage.setItem("signalscanBest", String(best));
    }

    message.textContent = "✔ Correct";

    DeskArcadeLeaderboard.trySubmit('signalscan', best, { panel: lbPanel, boardKey: 'default' }).catch(() => {});

  } else {
    digitBoard.classList.add("board-wrong");

    // highlight correct digits
    targets.forEach(i => {
      digitBoard.children[i].classList.add("wrong");
    });

    streak = 0;
    round = 1;

    message.textContent = "✖ Incorrect";
  }

  history.unshift(val === answer ? "✓ " + answer : "✗ " + val + " → " + answer);
  history = history.slice(0,5);
  historyEl.textContent = history.join(" | ");

  updateUI();

  nextBtn.style.display = "inline-block";
}

// ---------- RESET ----------
function resetGame(){
  round = 1;
  streak = 0;
  history = [];

  digitBoard.innerHTML = "";
  answerArea.classList.remove("active");

  startBtn.style.display = "inline-block";
  nextBtn.style.display = "none";

  message.textContent = "Press Start";

  updateUI();
}

// ---------- EVENTS ----------
startBtn.onclick = ()=>{
  startBtn.style.display = "none";
  nextRound();
};

submitBtn.onclick = submit;

nextBtn.onclick = nextRound;

answerInput.addEventListener("input", () => {
  answerInput.value = answerInput.value.replace(/\D/g, "");
});

answerInput.addEventListener("keydown", e => {
  if (e.key === "Enter") submit();
});

updateUI();
</script>

</body>
</html>
