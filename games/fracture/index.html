<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fracture | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#a855f7;
  --accent-2:#c084fc;
  --red:#ef4444;
  --yellow:#f59e0b;
  --blue:#38bdf8;
  --purple:var(--accent);
  --green:var(--accent);
  --panel:var(--surface);
  --text-soft:var(--text-dim);
  --border-soft:var(--border);
}

body {
  color:var(--text);
  font-family:var(--font-ui);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
  padding-top:16px;
}

.arcade-wrap {
  position:relative;
  z-index:1;
  width:min(1080px, 96vw);
  padding:16px 18px 14px;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
}

.top-bar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  padding:0 4px;
}

.game-logo {
  height:52px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text);
  padding:10px 18px;
  border-radius:var(--radius-sm);
  font-family:var(--font-display);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.03em;
  cursor:pointer;
  text-decoration:none;
  transition:border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

.btn:hover {
  border-color:var(--accent-border);
  background:var(--accent-soft);
  transform:translateY(-1px);
}

#startBtn {
  border:none;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  color:#fff;
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
}

#startBtn:hover {
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.top-bar > .btn {
  border-radius:var(--radius-pill);
  padding:9px 16px;
  font-family:var(--font-ui);
  font-size:13px;
  color:var(--text-dim);
}

.top-bar > .btn:hover {
  color:var(--text);
}

.game-shell {
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:10px;
}

.hud {
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
  margin-bottom:8px;
}

.hud-card {
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius-md);
  padding:8px;
  text-align:center;
}

.hud-card span {
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  margin-bottom:3px;
}

.hud-card strong {
  font-family:var(--font-mono);
  font-size:17px;
  font-weight:700;
  color:var(--accent-text);
}

.canvas-wrap {
  position:relative;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
  background:#0c0c17;
}

.canvas-wrap.shake {
  animation:screenShake 0.16s ease-in-out;
}

.canvas-wrap.danger {
  animation:dangerPulse 0.8s ease-in-out infinite;
}

@keyframes screenShake {
  0%, 100% { transform:translate(0,0); }
  25% { transform:translate(-3px,2px); }
  50% { transform:translate(3px,-2px); }
  75% { transform:translate(-2px,-1px); }
}

@keyframes dangerPulse {
  0%, 100% { box-shadow:0 0 0 1px rgba(239,68,68,0.25), 0 8px 22px rgba(239,68,68,0.16); }
  50% { box-shadow:0 0 0 1px rgba(239,68,68,0.5), 0 8px 22px rgba(239,68,68,0.3); }
}

canvas {
  display:block;
  width:100%;
  height:auto;
}

.overlay {
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.72);
  text-align:center;
  padding:20px;
}

.overlay.hidden {
  display:none;
}

.overlay-box {
  border:1px solid var(--border-strong);
  background:rgba(14,14,24,0.96);
  border-radius:var(--radius-lg);
  padding:24px;
  max-width:500px;
  box-shadow:var(--shadow-2);
}

.overlay-box h2 {
  margin:0 0 10px;
  font-family:var(--font-display);
  font-size:32px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:3px;
  color:var(--accent-text);
}

.overlay-box p {
  color:var(--text-dim);
  line-height:1.45;
}

.controls {
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.footer-note {
  margin-top:7px;
  text-align:center;
  color:var(--text-faint);
  font-size:12px;
}

.power-note {
  min-height:16px;
  margin-top:7px;
  text-align:center;
  color:var(--yellow);
  font-size:13px;
}

@media (max-width:700px) {
  body {
    overflow:auto;
    padding-top:10px;
  }

  .hud {
    grid-template-columns:repeat(2, 1fr);
  }

  .top-bar {
    align-items:flex-start;
  }

  .game-logo {
    max-width:260px;
  }
}
</style>
</head>

<body>
<div class="arcade-wrap">
  <div class="top-bar">
    <div class="title-block">
      <img class="game-logo" src="fracturelogo.png" alt="Fracture logo">
    </div>
    <a class="btn" href="../../index.html">Return to Arcade</a>
  </div>

  <div class="game-shell">
    <div class="hud">
      <div class="hud-card"><span>Score</span><strong id="score">0</strong></div>
      <div class="hud-card"><span>Lives</span><strong id="lives">3</strong></div>
      <div class="hud-card"><span>Level</span><strong id="level">1</strong></div>
      <div class="hud-card"><span>Balls</span><strong id="balls">0</strong></div>
      <div class="hud-card"><span>Power</span><strong id="power">None</strong></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="1000" height="540"></canvas>

      <div id="overlay" class="overlay">
        <div class="overlay-box">
          <h2 id="overlayTitle">Fracture</h2>
          <p id="overlayText">
            Use the left and right arrow keys to move the paddle. Break every breakable block to clear the level.
          </p>
          <div class="controls">
            <button class="btn" id="startBtn">Start Game</button>
            <a class="btn" href="../../index.html">Return to Arcade</a>
          </div>
        </div>
      </div>
    </div>

    <div class="power-note" id="message"></div>
    <div class="footer-note">Created by Jason / build v1.5</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script src="../../assets/deskarcade-config.js"></script>
<script src="../../assets/leaderboard.js"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'fracture', 'default');

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const canvasWrap = document.querySelector(".canvas-wrap");

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const ballsEl = document.getElementById("balls");
const powerEl = document.getElementById("power");
const messageEl = document.getElementById("message");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("startBtn");

let keys = {};
let score = 0;
let best = Number(localStorage.getItem("fractureBest")) || 0;
let lives = 3;
let level = 1;
let running = false;
let paused = false;
let levelReady = false;
let animationId = null;
let lastBrickWarningShown = false;

const paddle = {
  x: canvas.width / 2 - 70,
  y: canvas.height - 44,
  w: 140,
  baseW: 140,
  h: 14,
  speed: 15
};

let balls = [];
let bricks = [];
let powerups = [];
let particles = [];

let powerState = {
  wide:false,
  slow:false,
  multi:false
};

let powerTimers = {
  wide:null,
  slow:null,
  multi:null
};

const levels = [
  { rows:4, cols:9, speed:4.3, strong:0.00, explosive:0.00, speedBrick:0.00, solid:0.00 },
  { rows:5, cols:10, speed:4.6, strong:0.04, explosive:0.015, speedBrick:0.015, solid:0.00 },
  { rows:6, cols:11, speed:4.95, strong:0.10, explosive:0.05, speedBrick:0.04, solid:0.025 },
  { rows:7, cols:12, speed:5.3, strong:0.15, explosive:0.08, speedBrick:0.07, solid:0.05 },
  { rows:7, cols:13, speed:5.7, strong:0.20, explosive:0.11, speedBrick:0.10, solid:0.075 }
];

const powerTypes = [
  { name:"WIDE", color:"#38bdf8" },
  { name:"SLOW", color:"#fbbf24" },
  { name:"LIFE", color:"#34d399" },
  { name:"MULTI", color:"#f43f5e" }
];

document.addEventListener("keydown", e => {
  if ((e.key === "p" || e.key === "P" || e.key === "Escape") && running && !levelReady) {
    paused = !paused;
    messageEl.textContent = paused ? "Paused — press P to resume" : "";
    return;
  }

  keys[e.key] = true;

  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

startBtn.addEventListener("click", () => {
  if (!running && !levelReady) {
    startGame();
    return;
  }

  if (levelReady) {
    beginLevel();
  }
});

function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  running = true;
  levelReady = true;
  clearAllPowers();
  prepareLevel();
  showLevelIntro();
  updateHud();
  gameLoop();
}

function prepareLevel() {
  paddle.x = canvas.width / 2 - paddle.w / 2;
  powerups = [];
  particles = [];
  balls = [];
  lastBrickWarningShown = false;
  canvasWrap.classList.remove("danger");
  createBricks();
  updateHud();
  draw();
}

function showLevelIntro() {
  overlayTitle.textContent = level === 1 ? "Ready?" : `Level ${level}`;
  overlayText.textContent =
    level === 1
      ? "Use the arrow keys to move. Break every block. No panic, just control."
      : `Level ${level} starts faster. Score: ${score}. Keep it clean.`;
  startBtn.textContent = level === 1 ? "Start Level 1" : `Start Level ${level}`;
  overlay.classList.remove("hidden");
}

function beginLevel() {
  levelReady = false;
  overlay.classList.add("hidden");
  spawnBall();

  if (level === 1) {
    showMessage("Level 1 — warm up");
  } else {
    showMessage(`Level ${level} — speed increased`);
  }

  updateHud();
}

function getLevelConfig() {
  return levels[Math.min(level - 1, levels.length - 1)];
}

function spawnBall(extra = false) {
  const config = getLevelConfig();
  const speed = powerState.slow ? config.speed * 0.72 : config.speed;
  const dir = extra ? (Math.random() > 0.5 ? 1 : -1) : 1;

  balls.push({
    x: paddle.x + paddle.w / 2,
    y: paddle.y - 18,
    r: 8,
    dx: speed * (extra ? 0.85 : 0.65) * dir,
    dy: -speed
  });
}

function createBricks() {
  bricks = [];

  const config = getLevelConfig();
  const gap = 10;
  const top = 58;
  const side = 52;
  const brickW = (canvas.width - side * 2 - gap * (config.cols - 1)) / config.cols;
  const brickH = 24;

  let specialCount = 0;
  const maxSpecials = level === 1 ? 0 : level === 2 ? 1 : Infinity;

  for (let r = 0; r < config.rows; r++) {
    for (let c = 0; c < config.cols; c++) {
      let type = "normal";
      let hp = 1;

      if (specialCount < maxSpecials) {
        const roll = Math.random();

        if (roll < config.solid) {
          type = "solid";
          hp = Infinity;
          specialCount++;
        } else if (roll < config.solid + config.explosive) {
          type = "explosive";
          specialCount++;
        } else if (roll < config.solid + config.explosive + config.speedBrick) {
          type = "speed";
          specialCount++;
        } else if (roll < config.solid + config.explosive + config.speedBrick + config.strong) {
          type = "strong";
          hp = 2;
          specialCount++;
        }
      }

      bricks.push({
        x: side + c * (brickW + gap),
        y: top + r * (brickH + gap),
        w: brickW,
        h: brickH,
        row: r,
        hp,
        maxHp: hp,
        type,
        alive: true
      });
    }
  }

  ensureBreakableBricks();
}

function ensureBreakableBricks() {
  const breakable = bricks.filter(b => b.type !== "solid");
  if (breakable.length > 0) return;

  const brick = bricks[Math.floor(Math.random() * bricks.length)];
  brick.type = "normal";
  brick.hp = 1;
  brick.maxHp = 1;
}

function gameLoop() {
  if (!paused) update();
  draw();

  if (running) {
    animationId = requestAnimationFrame(gameLoop);
  }
}

function update() {
  if (levelReady || paused) return;

  if (keys.ArrowLeft) paddle.x -= paddle.speed;
  if (keys.ArrowRight) paddle.x += paddle.speed;

  paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

  updateBalls();
  updatePowerups();
  updateParticles();
  checkTension();

  if (getBreakableRemaining() === 0) {
    completeLevel();
  }
}

function updateBalls() {
  balls.forEach(ball => {
    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.x - ball.r <= 0 || ball.x + ball.r >= canvas.width) {
      ball.dx *= -1;
      ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
    }

    if (ball.y - ball.r <= 0) {
      ball.dy *= -1;
      ball.y = ball.r;
    }

    if (
      ball.y + ball.r >= paddle.y &&
      ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w &&
      ball.dy > 0
    ) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const edgeHit = Math.abs(hit) > 0.78;

      ball.dx = hit * 7.2;
      ball.dy = -Math.abs(ball.dy);

      if (!powerState.slow) {
        ball.dx *= 1.004;
        ball.dy *= 1.004;
      }

      ball.y = paddle.y - ball.r;

      if (edgeHit) {
        showMessage("Clutch save!");
        makeParticles(ball.x, ball.y, "#fbbf24", 14);
      }
    }

    bricks.forEach(brick => {
      if (!brick.alive) return;

      if (
        ball.x + ball.r > brick.x &&
        ball.x - ball.r < brick.x + brick.w &&
        ball.y + ball.r > brick.y &&
        ball.y - ball.r < brick.y + brick.h
      ) {
        ball.dy *= -1;
        handleBrickHit(brick, ball);
      }
    });
  });

  balls = balls.filter(ball => ball.y - ball.r < canvas.height + 40);

  if (balls.length === 0) {
    lives--;
    updateHud();

    if (lives <= 0) {
      endGame();
    } else {
      spawnBall();
      showMessage(lives === 1 ? "Last life. No messing about." : "Ball lost. Focus up.");
    }
  }
}

function handleBrickHit(brick, ball) {
  if (brick.type === "solid") {
    score += 2;
    screenShake();
    makeParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, "#8a8a8a", 5);
    updateHud();
    return;
  }

  brick.hp--;
  score += 10;

  makeParticles(
    brick.x + brick.w / 2,
    brick.y + brick.h / 2,
    getBrickColor(brick),
    brick.type === "explosive" ? 14 : 8
  );

  if (brick.type === "speed") {
    speedUpBall(ball, 1.08);
    showMessage("Speed brick!");
  }

  if (brick.type === "strong" && brick.hp === 1) {
    showMessage("Strong brick cracked!");
  }

  if (brick.hp <= 0) {
    brick.alive = false;
    score += 20;

    if (brick.type === "explosive") {
      explodeBrick(brick);
      showMessage("Bomb brick!");
    }

    screenShake();

    if (Math.random() < 0.07) {
      dropPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
    }
  }

  updateHud();
}

function explodeBrick(sourceBrick) {
  bricks.forEach(brick => {
    if (!brick.alive || brick.type === "solid" || brick === sourceBrick) return;

    const dx = Math.abs((brick.x + brick.w / 2) - (sourceBrick.x + sourceBrick.w / 2));
    const dy = Math.abs((brick.y + brick.h / 2) - (sourceBrick.y + sourceBrick.h / 2));

    if (dx < sourceBrick.w * 1.55 && dy < sourceBrick.h * 1.9) {
      brick.alive = false;
      score += 12;
      makeParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, getBrickColor(brick), 10);

      if (Math.random() < 0.035) {
        dropPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
      }
    }
  });
}

function speedUpBall(ball, amount) {
  ball.dx *= amount;
  ball.dy *= amount;

  const maxSpeed = 8.8;
  const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);

  if (currentSpeed > maxSpeed) {
    const scale = maxSpeed / currentSpeed;
    ball.dx *= scale;
    ball.dy *= scale;
  }
}

function dropPowerup(x, y) {
  const roll = Math.random();
  let type;

  if (roll < 0.36) type = powerTypes.find(p => p.name === "WIDE");
  else if (roll < 0.68) type = powerTypes.find(p => p.name === "SLOW");
  else if (roll < 0.94) type = powerTypes.find(p => p.name === "MULTI");
  else type = powerTypes.find(p => p.name === "LIFE");

  powerups.push({
    x,
    y,
    w: 64,
    h: 22,
    dy: 2.4,
    type
  });
}

function updatePowerups() {
  powerups.forEach(p => {
    p.y += p.dy;

    if (
      p.y + p.h >= paddle.y &&
      p.y <= paddle.y + paddle.h &&
      p.x + p.w / 2 >= paddle.x &&
      p.x - p.w / 2 <= paddle.x + paddle.w
    ) {
      activatePower(p.type.name);
      p.caught = true;
    }
  });

  powerups = powerups.filter(p => !p.caught && p.y < canvas.height + 40);
}

function activatePower(type) {
  if (type === "WIDE") {
    powerState.wide = true;
    paddle.w = 210;
    showMessage("Powerup: paddle widened");

    clearTimeout(powerTimers.wide);
    powerTimers.wide = setTimeout(() => {
      powerState.wide = false;
      paddle.w = paddle.baseW;
      updateHud();
    }, 10000);
  }

  if (type === "SLOW") {
    powerState.slow = true;

    balls.forEach(b => {
      b.dx *= 0.72;
      b.dy *= 0.72;
    });

    showMessage("Powerup: ball slowed");

    clearTimeout(powerTimers.slow);
    powerTimers.slow = setTimeout(() => {
      powerState.slow = false;

      balls.forEach(b => {
        b.dx *= 1.22;
        b.dy *= 1.22;
      });

      updateHud();
    }, 8000);
  }

  if (type === "LIFE") {
    lives++;
    showMessage("Powerup: extra life");
  }

  if (type === "MULTI") {
    powerState.multi = true;
    spawnBall(true);
    spawnBall(true);
    showMessage("Powerup: multi-ball");

    clearTimeout(powerTimers.multi);
    powerTimers.multi = setTimeout(() => {
      powerState.multi = false;
      updateHud();
    }, 3000);
  }

  updateHud();
}

function clearAllPowers() {
  Object.keys(powerTimers).forEach(key => {
    if (powerTimers[key]) clearTimeout(powerTimers[key]);
    powerTimers[key] = null;
  });

  powerState.wide = false;
  powerState.slow = false;
  powerState.multi = false;
  paddle.w = paddle.baseW;
  updateHud();
}

function completeLevel() {
  levelReady = true;
  balls = [];
  powerups = [];
  clearAllPowers();
  canvasWrap.classList.remove("danger");

  if (level >= levels.length) {
    winGame();
    return;
  }

  overlayTitle.textContent = "Level Clear";
  overlayText.textContent = `Nice work. Score: ${score}. Next up: Level ${level + 1}.`;
  startBtn.textContent = `Start Level ${level + 1}`;
  overlay.classList.remove("hidden");

  level++;
  prepareLevel();
}

function endGame() {
  running = false;
  levelReady = false;
  cancelAnimationFrame(animationId);
  canvasWrap.classList.remove("danger");

  overlayTitle.textContent = "Game Over";
  overlayText.textContent = `Final score: ${score}. Best: ${best}. You reached level ${level}.`;
  startBtn.textContent = "Play Again";
  overlay.classList.remove("hidden");

  DeskArcadeLeaderboard.trySubmit('fracture', score, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
}

function winGame() {
  running = false;
  levelReady = false;
  cancelAnimationFrame(animationId);
  canvasWrap.classList.remove("danger");

  overlayTitle.textContent = "Grid Fractured";
  overlayText.textContent = `You cleared every level. Final score: ${score}.`;
  startBtn.textContent = "Play Again";
  overlay.classList.remove("hidden");

  DeskArcadeLeaderboard.trySubmit('fracture', score, { panel: lbPanel, boardKey: 'default' }).catch(() => {});
}

function getBreakableRemaining() {
  return bricks.filter(b => b.alive && b.type !== "solid").length;
}

function checkTension() {
  const remaining = getBreakableRemaining();

  if (remaining === 1 && !lastBrickWarningShown) {
    lastBrickWarningShown = true;
    showMessage("Final brick!");
  }

  if (lives === 1 && running) {
    canvasWrap.classList.add("danger");
  } else {
    canvasWrap.classList.remove("danger");
  }
}

function showMessage(text) {
  messageEl.textContent = text;

  setTimeout(() => {
    if (messageEl.textContent === text) {
      messageEl.textContent = "";
    }
  }, 2600);
}

function screenShake() {
  canvasWrap.classList.remove("shake");
  void canvasWrap.offsetWidth;
  canvasWrap.classList.add("shake");
}

function makeParticles(x, y, color, amount = 8) {
  for (let i = 0; i < amount; i++) {
    particles.push({
      x,
      y,
      dx:(Math.random() - 0.5) * 4.5,
      dy:(Math.random() - 0.5) * 4.5,
      life:24,
      color
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.dx;
    p.y += p.dy;
    p.life--;
  });

  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBricks();
  drawPaddle();
  drawBalls();
  drawPowerups();
  drawParticles();
}

function drawBricks() {
  bricks.forEach(brick => {
    if (!brick.alive) return;

    const color = getBrickColor(brick);
    const damagedStrong = brick.type === "strong" && brick.hp === 1;

    ctx.save();

    ctx.shadowBlur = brick.type === "solid" ? 6 : damagedStrong ? 8 : 16;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.globalAlpha = brick.type === "solid" ? 0.5 : damagedStrong ? 0.45 : 0.82;

    roundedRect(brick.x, brick.y, brick.w, brick.h, 7);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.strokeStyle = damagedStrong ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = damagedStrong ? 2 : 1;
    ctx.stroke();

    if (damagedStrong) {
      ctx.beginPath();
      ctx.moveTo(brick.x + 8, brick.y + brick.h - 6);
      ctx.lineTo(brick.x + brick.w * 0.4, brick.y + 7);
      ctx.lineTo(brick.x + brick.w * 0.58, brick.y + brick.h - 7);
      ctx.lineTo(brick.x + brick.w - 8, brick.y + 6);
      ctx.strokeStyle = "rgba(10,10,18,0.75)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (brick.type === "explosive" || brick.type === "speed" || brick.type === "solid") {
      ctx.font = "bold 17px 'Space Grotesk', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (brick.type === "explosive") {
        ctx.fillText("💣", brick.x + brick.w / 2, brick.y + brick.h / 2 + 1);
      }

      if (brick.type === "speed") {
        ctx.fillStyle = "#0c0c17";
        ctx.fillText("⚡", brick.x + brick.w / 2, brick.y + brick.h / 2 + 1);
      }

      if (brick.type === "solid") {
        ctx.fillText("🧱", brick.x + brick.w / 2, brick.y + brick.h / 2 + 1);
      }
    }

    ctx.restore();
  });
}

const brickRowColors = ["#a855f7", "#8b5cf6", "#6366f1", "#38bdf8", "#22d3ee"];

function getBrickColor(brick) {
  if (brick.type === "strong") return "#fbbf24";
  if (brick.type === "explosive") return "#f43f5e";
  if (brick.type === "speed") return "#38bdf8";
  if (brick.type === "solid") return "#8a8a8a";
  return brickRowColors[(brick.row || 0) % brickRowColors.length];
}

function drawPaddle() {
  ctx.save();
  ctx.shadowBlur = powerState.wide ? 30 : 22;
  ctx.shadowColor = powerState.wide ? "#38bdf8" : "#a855f7";
  ctx.fillStyle = powerState.wide ? "#38bdf8" : "#a855f7";
  roundedRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
  ctx.fill();
  ctx.restore();
}

function drawBalls() {
  balls.forEach(ball => {
    ctx.save();
    ctx.shadowBlur = powerState.slow ? 24 : 20;
    ctx.shadowColor = powerState.slow ? "#fbbf24" : "#f4f4f8";
    ctx.fillStyle = powerState.slow ? "#fbbf24" : "#f4f4f8";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.shadowBlur = 16;
    ctx.shadowColor = p.type.color;
    ctx.fillStyle = p.type.color;
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    roundedRect(-p.w / 2, -p.h / 2, p.w, p.h, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#0c0c17";
    ctx.font = "bold 12px 'Space Grotesk', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.type.name, 0, 1);
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / 24;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fillRect(p.x, p.y, 3, 3);
    ctx.restore();
  });
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function updateHud() {
  if (score > best) {
    best = score;
    localStorage.setItem("fractureBest", String(best));
  }
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  levelEl.textContent = level;
  ballsEl.textContent = balls.length;

  const active = [];
  if (powerState.wide) active.push("Wide");
  if (powerState.slow) active.push("Slow");
  if (powerState.multi) active.push("Multi");

  powerEl.textContent = active.length ? active.join("+") : "None";
}

draw();
updateHud();
</script>
</body>
