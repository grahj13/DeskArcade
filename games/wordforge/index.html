<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">
  <script src="common-words.js"></script>
  <style>
    :root {
      --accent: #eab308;
      --accent-2: #facc15;
      --green: var(--accent);
      --green-dim: color-mix(in srgb, var(--accent) 45%, transparent);
      --muted: var(--text-dim);
      --danger: #ef4444;
      --gold: #facc15;
    }

    body {
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .screen {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
      padding: 24px;
    }

    .hidden { display: none !important; }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-text);
      text-align: center;
    }

    .logo {
      display: block;
      height: 56px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
    }

    .game .logo {
      height: 48px;
      margin: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
    }

    .menu {
      display: grid;
      place-items: center;
      gap: 22px;
      min-height: 620px;
    }

    .menu-card-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      width: min(720px, 100%);
    }

    .mode-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      width: 100%;
      color: var(--text);
      font-family: var(--font-ui);
    }

    .mode-card:hover {
      transform: translateY(-1px);
      border-color: var(--accent-border);
      background: var(--accent-soft);
      box-shadow: 0 8px 22px var(--accent-glow);
    }

    .mode-card h2 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 1.6rem;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .mode-best {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--gold);
    }

    .timer-wrap {
      margin-bottom: 4px;
    }

    .timer-bar {
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-top: 6px;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 99px;
      transition: width 0.95s linear;
    }

    .timer-bar-fill.urgent {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    .stat strong.warn {
      color: #f59e0b;
    }

    .stat strong.danger-stat {
      color: #ef4444;
    }

    .entry {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      align-items: stretch;
    }

    .entry-input-wrap {
      flex: 1;
      position: relative;
    }

    .entry-input-wrap input {
      width: 100%;
      box-sizing: border-box;
    }

    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 10px;
      font-size: 11px;
      min-height: 0;
      opacity: 0.7;
    }

    .milestone-flash {
      position: fixed;
      top: 18%;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      background: rgba(14, 14, 24, 0.92);
      border: 1px solid var(--accent-border);
      color: var(--gold);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.06em;
      pointer-events: none;
      opacity: 0;
      z-index: 50;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .milestone-flash.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .game-leaderboard {
      margin-top: 8px;
    }

    .credit {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .game header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    .game h1 {
      text-align: left;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .game .subtitle {
      text-align: left;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 10px;
      min-width: 310px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .stat strong {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-text);
    }

    .control-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 14px;
      letter-spacing: 0.03em;
      border-radius: var(--radius-sm);
      padding: 11px 18px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    button:active { transform: scale(0.97); }

    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      color: #1c1605;
      box-shadow: 0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    button.primary:hover {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      filter: brightness(1.08);
    }

    button.danger {
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }

    button.danger:hover {
      border-color: rgba(239, 68, 68, 0.75);
      background: rgba(239, 68, 68, 0.14);
    }

    .main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    .panel {
      max-width: 720px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      background: var(--surface);
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(8, 56px);
      justify-content: center;
      gap: 10px;
      margin: 10px auto 14px;
      width: 100%;
    }

    .tile {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      position: relative;
      overflow: hidden;
      font-family: var(--font-display);
      color: #f4f4f8;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #0b0b15, #07070f);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.55);
      line-height: 1;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    .tile .tile-letter {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform: translateY(-1px);
    }

    .tile.used {
      opacity: 1;
      transform: scale(0.96);
      border-color: var(--accent-border);
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), transparent 24%),
        linear-gradient(145deg, rgba(234, 179, 8, 0.3), rgba(234, 179, 8, 0.08));
      color: var(--accent-2);
      box-shadow:
        inset 0 0 18px rgba(234, 179, 8, 0.16),
        0 8px 22px rgba(234, 179, 8, 0.2);
    }

    .tile.flash {
      transform: scale(1.08);
      border-color: var(--accent-border);
      box-shadow: 0 8px 22px rgba(234, 179, 8, 0.38);
    }

    .tile.full-forge {
      transform: scale(1.12);
      border-color: var(--accent-2);
      box-shadow: 0 8px 22px rgba(234, 179, 8, 0.5);
    }

    .entry {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: rgba(10, 10, 20, 0.7);
      color: var(--text);
      padding: 14px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input.shake {
      animation: shake 0.22s ease-in-out;
      border-color: var(--danger);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .message {
      min-height: 28px;
      color: var(--muted);
      font-weight: 700;
    }

    .message.good { color: var(--accent-text); }
    .message.bad { color: var(--danger); }
    .message.gold { color: var(--gold); }

    .found-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.82rem;
    }

    .found-list {
      min-height: 300px;
      max-height: 380px;
      overflow: auto;
      display: flex;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      padding: 2px;
    }

    .word-chip {
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      background: var(--accent-soft);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .word-chip.long {
      border-color: rgba(250, 204, 21, 0.55);
      background: rgba(250, 204, 21, 0.12);
      color: var(--gold);
    }

    .word-chip.full {
      border-color: rgba(250, 204, 21, 0.75);
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.22), rgba(234, 179, 8, 0.1));
      box-shadow: 0 6px 18px rgba(234, 179, 8, 0.2);
    }

    .word-chip.pop {
      animation: chipPop 0.22s ease;
    }

    @keyframes chipPop {
      0% { transform: scale(0.88); }
      55% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .found-empty {
      color: var(--text-faint);
      font-size: 0.95rem;
      padding: 12px 4px;
    }

    .rules {
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
      margin-top: 14px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.22s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(520px, 100%);
      border: 1px solid var(--border-strong);
      background: rgba(14, 14, 24, 0.96);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-2);
      text-align: center;
      position: relative;
      z-index: 10000;
      transform: scale(0.92) translateY(10px);
      opacity: 0;
      transition: transform 0.24s ease, opacity 0.24s ease;
    }

    .overlay.show .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal h2 {
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 2rem;
      margin: 0 0 10px;
    }

    .modal p { color: var(--muted); }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }

    .results-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--surface);
      max-height: 190px;
      overflow: auto;
    }

    .results-box h3 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .results-words {
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.55;
      word-break: break-word;
    }

    @media (max-width: 560px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    @media (max-width: 800px) {
      .letters {
        grid-template-columns: repeat(4, 56px);
      }
      .game header, .main { grid-template-columns: 1fr; display: grid; }
      .stats { min-width: 0; grid-template-columns: repeat(2, 1fr); }
      .letters { grid-template-columns: repeat(4, 1fr); max-width: 280px; margin-inline: auto; }
      .entry { flex-direction: column; }
      .menu-card-wrap { grid-template-columns: 1fr; }
      .screen { padding: 16px; }
      .found-list { min-height: 180px; max-height: 220px; }
    }

  </style>
</head>
<body>
  <div id="menuScreen" class="screen menu">
    <div>
      <img class="logo" src="wordforgelogo.png" alt="Word Forge" />
      <div class="subtitle">Forge as many words as you can from 8 letters.</div>
    </div>

    <div class="menu-card-wrap">
      <button id="startChallenge" class="mode-card" type="button">
        <h2>Challenge Mode</h2>
        <p>45 seconds on the clock. Push for the highest score before the forge goes cold.</p>
        <div class="mode-best" id="menuBestChallenge">Best: 0</div>
      </button>
      <button id="startChill" class="mode-card" type="button">
        <h2>Chill Mode</h2>
        <p>No timer. End when you're done — perfect for a relaxed desk break.</p>
        <div class="mode-best" id="menuBestChill">Best: 0</div>
      </button>
    </div>

    <button id="returnArcadeBtn" class="da-back" type="button">Back to Arcade</button>

    <div id="leaderboard"></div>

    <div class="credit">Created by JGDev</div>
  </div>

  <div id="gameScreen" class="screen game hidden">
    <header>
      <div>
        <img class="logo" src="wordforgelogo.png" alt="Word Forge" />
        <div id="gameSubtitle" class="subtitle">Challenge Mode</div>
      </div>
      <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Words</span><strong id="wordCount">0</strong></div>
        <div class="stat"><span>Found</span><strong id="foundPct">0%</strong></div>
        <div class="stat timer-wrap"><span>Time</span><strong id="timer">45</strong><div class="timer-bar" id="timerBar"><div class="timer-bar-fill" id="timerBarFill"></div></div></div>
      </div>
    </header>

    <div class="control-row">
      <button id="newBtn">New Letters</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="endBtn" class="danger">End</button>
    </div>

    <div class="main">
      <section class="panel">
        <div class="letters" id="letters"></div>
        <div class="entry">
          <div class="entry-input-wrap">
            <input id="wordInput" type="text" placeholder="Type a word..." autocomplete="off" maxlength="8" spellcheck="false" />
            <button type="button" class="clear-btn" id="clearBtn">Clear</button>
          </div>
          <button id="submitBtn" class="primary">Forge</button>
        </div>
        <div id="message" class="message">Tap letters or type. Minimum 3 letters. Enter to forge.</div>
        <div class="rules">
          Longer words score more. 8-letter words earn a full-forge bonus.
        </div>
      </section>

      <section class="panel">
        <div class="found-title">
          <span>Forged Words</span>
          <span id="modeLabel">Challenge</span>
        </div>
        <div id="foundList" class="found-list"></div>
      </section>
    </div>
    <div id="gameLeaderboard" class="game-leaderboard hidden"></div>
  </div>

  <div id="milestoneFlash" class="milestone-flash" aria-live="polite"></div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <h2>Round Complete</h2>
      <p id="finalText"></p>
      <div class="modal-actions">
        <button id="playAgainBtn" class="primary">Play Again</button>
        <button id="menuBtn">Main Menu</button>
      </div>
    </div>
  </div>  <script src="../../assets/leaderboard.js?v=6"></script>
  <script>
    const lbPanel = document.getElementById('leaderboard');
    const gameLbPanel = document.getElementById('gameLeaderboard');

    const dictionary = [...new Set((window.forgeWords || []).map(word => String(word).trim().toLowerCase()).filter(word => word.length >= 3 && word.length <= 8 && /^[a-z]+$/.test(word)))];

    const LETTER_SEEDS = [
      'TRIANGLE', 'NOTEBOOK', 'KEYBOARD', 'GAMEPLAY', 'LEARNING', 'PAINTERS', 'CHAMPION',
      'SUNSHINE', 'MOUNTAIN', 'ELEPHANT', 'PLANNING', 'CLEANING', 'GRAPHICS', 'TERMINAL',
      'REACTION', 'TRAINING', 'PORTABLE', 'COOKBOOK', 'MEETINGS', 'MONITORS', 'PRINTERS',
      'WORDGAME', 'READINGS', 'FRIENDLY', 'HOLIDAYS', 'BIRTHDAY', 'SANDWICH',
      'BASEBALL', 'FOOTBALL', 'SWIMMING', 'CREATION', 'DOLPHINS', 'GARDENER', 'MARKETED',
      'TRAILERS', 'GOLDMINE', 'STREAMED', 'WONDERED', 'STANDARD', 'WORDPLAY',
      'BREAKOUT', 'PLAYTIME', 'TEACHING', 'STUDENTS', 'BUILDERS', 'PAINTING',
      'GOLDFISH', 'HANDMADE', 'FORESTED', 'CREATORS', 'ARCADEGO', 'DESKWORK', 'BREAKOUT'
    ].filter((set, i, arr) => set.length === 8 && arr.indexOf(set) === i);

    const vowels = ['A', 'E', 'I', 'O', 'U'];
    const minimumPossibleWords = 18;
    const CHALLENGE_SECONDS = 45;
    let scoreSubmitPending = false;
    let totalPossible = 0;
    let milestonesHit = new Set();

    function lbBlocksInput() {
      return scoreSubmitPending ||
        (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen());
    }

    const state = {
      mode: 'challenge',
      letters: [],
      found: [],
      score: 0,
      time: CHALLENGE_SECONDS,
      timerId: null,
      active: false
    };

    const els = {
      menuScreen: document.getElementById('menuScreen'),
      gameScreen: document.getElementById('gameScreen'),
      startChallenge: document.getElementById('startChallenge'),
      startChill: document.getElementById('startChill'),
      returnArcadeBtn: document.getElementById('returnArcadeBtn'),
      gameSubtitle: document.getElementById('gameSubtitle'),
      score: document.getElementById('score'),
      wordCount: document.getElementById('wordCount'),
      availableCount: document.getElementById('foundPct'),
      timer: document.getElementById('timer'),
      timerBarFill: document.getElementById('timerBarFill'),
      timerBar: document.getElementById('timerBar'),
      letters: document.getElementById('letters'),
      input: document.getElementById('wordInput'),
      clearBtn: document.getElementById('clearBtn'),
      message: document.getElementById('message'),
      foundList: document.getElementById('foundList'),
      newBtn: document.getElementById('newBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      submitBtn: document.getElementById('submitBtn'),
      endBtn: document.getElementById('endBtn'),
      overlay: document.getElementById('overlay'),
      finalText: document.getElementById('finalText'),
      playAgainBtn: document.getElementById('playAgainBtn'),
      menuBtn: document.getElementById('menuBtn'),
      modeLabel: document.getElementById('modeLabel'),
      menuBestChallenge: document.getElementById('menuBestChallenge'),
      menuBestChill: document.getElementById('menuBestChill'),
      milestoneFlash: document.getElementById('milestoneFlash')
    };

    function updateMenuBests() {
      els.menuBestChallenge.textContent = 'Best: ' + getBestScore('challenge');
      els.menuBestChill.textContent = 'Best: ' + getBestScore('chill');
    }

    function showMilestone(text) {
      els.milestoneFlash.textContent = text;
      els.milestoneFlash.classList.add('show');
      clearTimeout(showMilestone._t);
      showMilestone._t = setTimeout(() => els.milestoneFlash.classList.remove('show'), 1400);
    }

    function checkMilestones() {
      const pct = totalPossible ? Math.round((state.found.length / totalPossible) * 100) : 0;
      if (state.found.length >= 5 && !milestonesHit.has('w5')) {
        milestonesHit.add('w5');
        showMilestone('5 words forged');
      }
      if (state.found.length >= 10 && !milestonesHit.has('w10')) {
        milestonesHit.add('w10');
        showMilestone('10 words forged');
      }
      if (pct >= 50 && !milestonesHit.has('p50')) {
        milestonesHit.add('p50');
        showMilestone('50% found');
      }
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function canBuildWord(word) {
      return canBuildFromLetters(word, state.letters);
    }

    function canBuildFromLetters(word, letters) {
      const available = {};
      letters.forEach(letter => available[letter] = (available[letter] || 0) + 1);
      for (const char of word.toUpperCase()) {
        if (!available[char]) return false;
        available[char]--;
      }
      return true;
    }

    function hasEnoughVowels(letters) {
      const count = letters.filter(letter => vowels.includes(letter)).length;
      return count >= 2 && count <= 3;
    }

    function possibleWordsForLetters(letters) {
      return dictionary.filter(word => word.length >= 3 && word.length <= 8 && canBuildFromLetters(word, letters));
    }

    function scoreLetters(letters) {
      const possible = possibleWordsForLetters(letters);
      const longWords = possible.filter(w => w.length >= 5).length;
      const eightLetter = possible.filter(w => w.length === 8).length;
      return possible.length + longWords * 0.6 + eightLetter * 2;
    }

    function pickGoodLetters() {
      const eightLetterWords = dictionary.filter(word => word.length === 8);
      let best = null;
      let bestScore = 0;

      const tryLetters = (letters) => {
        if (!hasEnoughVowels(letters)) return;
        const count = possibleWordsForLetters(letters).length;
        if (count < minimumPossibleWords) return;
        const score = scoreLetters(letters);
        if (score > bestScore) {
          bestScore = score;
          best = letters;
        }
      };

      for (let i = 0; i < 120; i++) {
        const word = eightLetterWords[Math.floor(Math.random() * eightLetterWords.length)];
        if (!word) break;
        tryLetters(shuffleArray(word.toUpperCase().split('')));
      }

      shuffleArray(LETTER_SEEDS).forEach(set => {
        tryLetters(shuffleArray(set.split('')));
      });

      if (best) return best;
      return shuffleArray('TRIANGLE'.split(''));
    }

    function getRemainingWords() {
      const possible = getPossibleWords();
      return possible.filter(word => !state.found.includes(word));
    }

    function scoreWord(word) {
      const len = word.length;
      let points = 0;
      if (len === 3) points = 10;
      else if (len === 4) points = 20;
      else if (len === 5) points = 40;
      else if (len === 6) points = 70;
      else if (len === 7) points = 110;
      else points = 170;
      if (len === 8) points += 80;
      return points;
    }

    function getPossibleWords() {
      return possibleWordsForLetters(state.letters);
    }

    function getBestWord() {
      if (!state.found.length) return 'None';
      return state.found.slice().sort((a, b) => scoreWord(b) - scoreWord(a) || b.length - a.length)[0].toUpperCase();
    }

    function getLongestWord() {
      if (!state.found.length) return 'None';
      return state.found.slice().sort((a, b) => b.length - a.length || a.localeCompare(b))[0].toUpperCase();
    }

    function setMessage(text, type = '') {
      els.message.textContent = text;
      els.message.className = 'message ' + type;
    }

    function shakeInput() {
      els.input.classList.remove('shake');
      void els.input.offsetWidth;
      els.input.classList.add('shake');
    }

    function flashTiles(isFullForge = false) {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      tiles.forEach(tile => tile.classList.add(isFullForge ? 'full-forge' : 'flash'));
      setTimeout(() => {
        tiles.forEach(tile => tile.classList.remove('flash', 'full-forge'));
      }, isFullForge ? 420 : 260);
    }

    function formatWordList(words, limit = 50) {
      if (!words.length) return 'None';
      const sorted = words.slice().sort((a, b) => b.length - a.length || a.localeCompare(b)).map(w => w.toUpperCase());
      const visible = sorted.slice(0, limit).join(', ');
      const remaining = sorted.length - limit;
      return remaining > 0 ? `${visible}<br><br>+ ${remaining} more...` : visible;
    }

    function render(highlightWord = '') {
      els.score.textContent = state.score;
      els.wordCount.textContent = state.found.length;
      const pct = totalPossible ? Math.round((state.found.length / totalPossible) * 100) : 0;
      els.availableCount.textContent = pct + '%';
      els.availableCount.className = pct >= 75 ? 'danger-stat' : pct >= 50 ? 'warn' : '';

      if (state.mode === 'challenge') {
        els.timer.textContent = state.time;
        els.timer.className = state.time <= 10 ? 'danger-stat' : state.time <= 20 ? 'warn' : '';
        const fillPct = (state.time / CHALLENGE_SECONDS) * 100;
        els.timerBarFill.style.width = fillPct + '%';
        els.timerBarFill.classList.toggle('urgent', state.time <= 10);
        els.timerBar.style.display = '';
      } else {
        els.timer.textContent = '∞';
        els.timer.className = '';
        els.timerBar.style.display = 'none';
      }
      els.modeLabel.textContent = state.mode === 'challenge' ? 'Challenge' : 'Chill';
      els.gameSubtitle.textContent = state.mode === 'challenge'
        ? `Challenge — ${CHALLENGE_SECONDS} seconds`
        : 'Chill — no timer';
      els.letters.innerHTML = '';
      state.letters.forEach((letter, index) => {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.innerHTML = `<span class="tile-letter">${letter}</span>`;
        tile.dataset.index = index;
        tile.addEventListener('click', () => {
          if (lbBlocksInput()) return;
          addLetterFromTile(index);
        });
        els.letters.appendChild(tile);
      });
      updateTileUsage();
      els.foundList.innerHTML = '';
      if (!state.found.length) {
        const empty = document.createElement('div');
        empty.className = 'found-empty';
        empty.textContent = 'Forged words appear here.';
        els.foundList.appendChild(empty);
      } else {
        state.found.slice().sort((a, b) => b.length - a.length || a.localeCompare(b)).forEach(word => {
          const chip = document.createElement('div');
          chip.className = 'word-chip';
          if (word.length === 8) chip.classList.add('full');
          else if (word.length >= 6) chip.classList.add('long');
          if (word === highlightWord) chip.classList.add('pop');
          chip.textContent = word;
          els.foundList.appendChild(chip);
        });
      }
    }

    function startTimer() {
      clearInterval(state.timerId);
      if (state.mode !== 'challenge') return;
      state.timerId = setInterval(() => {
        state.time--;
        render();
        if (state.time <= 0) endRound();
      }, 1000);
    }

    function showGame() {
      els.menuScreen.classList.add('hidden');
      els.gameScreen.classList.remove('hidden');
      gameLbPanel.classList.remove('hidden');
      DeskArcadeLeaderboard.mountPanel(gameLbPanel, 'wordforge', state.mode);
    }

    function showMenu() {
      clearInterval(state.timerId);
      state.active = false;
      scoreSubmitPending = false;
      els.overlay.classList.remove('show');
      els.gameScreen.classList.add('hidden');
      gameLbPanel.classList.add('hidden');
      els.menuScreen.classList.remove('hidden');
      updateMenuBests();
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordforge', 'challenge');
    }

    function newRound(keepLetters = false) {
      if (lbBlocksInput()) return;
      if (!keepLetters && state.mode === 'challenge' && state.active && state.score > 0) {
        if (!confirm('Start fresh letters? Your current score will reset.')) return;
      }
      clearInterval(state.timerId);
      if (!keepLetters) {
        state.letters = pickGoodLetters();
      }
      state.found = [];
      state.score = 0;
      state.time = CHALLENGE_SECONDS;
      state.active = true;
      milestonesHit = new Set();
      totalPossible = getPossibleWords().length;
      els.overlay.classList.remove('show');
      els.input.value = '';
      els.input.disabled = false;
      setMessage('Tap letters or type. Minimum 3 letters. Enter to forge.');
      render();
      startTimer();
      els.input.focus();
    }

    function startMode(mode) {
      if (!dictionary.length) {
        alert('Word list failed to load. Check common-words.js is in the same folder as index.html.');
        return;
      }
      state.mode = mode;
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordforge', state.mode);
      showGame();
      newRound(false);
    }

    function addLetterFromTile(index) {
      if (!state.active || lbBlocksInput()) return;
      const letter = state.letters[index];
      const current = els.input.value.toUpperCase();
      const available = {};
      state.letters.forEach(l => available[l] = (available[l] || 0) + 1);
      for (const char of current) {
        if (available[char]) available[char]--;
      }
      if (!available[letter]) {
        shakeInput();
        return;
      }
      els.input.value += letter;
      updateTileUsage();
      els.input.focus();
    }

    function updateTileUsage() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      tiles.forEach(tile => tile.classList.remove('used'));

      const selectedIndexes = new Set();
      const typedLetters = els.input.value.toUpperCase().split('');

      typedLetters.forEach(char => {
        const tileIndex = state.letters.findIndex((letter, index) => {
          return letter === char && !selectedIndexes.has(index);
        });

        if (tileIndex !== -1) {
          selectedIndexes.add(tileIndex);
          if (tiles[tileIndex]) tiles[tileIndex].classList.add('used');
        }
      });
    }

    function submitWord() {
      if (!state.active || lbBlocksInput()) return;
      const word = els.input.value.trim().toLowerCase();
      els.input.value = '';

      if (word.length < 3) {
        setMessage('Too short. Minimum 3 letters.', 'bad');
        shakeInput();
        return;
      }
      if (state.found.includes(word)) {
        setMessage('Already forged. Find another.', 'bad');
        shakeInput();
        return;
      }
      if (!canBuildWord(word)) {
        setMessage('You cannot build that from these letters.', 'bad');
        shakeInput();
        return;
      }
      if (!dictionary.includes(word)) {
        setMessage('Not a recognised word — try another.', 'bad');
        shakeInput();
        return;
      }

      const points = scoreWord(word);
      state.found.push(word);
      state.score += points;
      const pctFound = totalPossible ? Math.round((state.found.length / totalPossible) * 100) : 0;
      setMessage(
        word.length === 8
          ? `FULL FORGE! +${points} · ${pctFound}% found`
          : `${word.toUpperCase()} +${points} · ${pctFound}% found`,
        word.length === 8 ? 'gold' : 'good'
      );
      render(word);
      flashTiles(word.length === 8);
      checkMilestones();
    }

    function getBestScore(mode) {
      return Number(localStorage.getItem('wordforgeBest_' + mode) || 0);
    }

    function saveBestScore(mode, score) {
      const prev = getBestScore(mode);
      if (score > prev) localStorage.setItem('wordforgeBest_' + mode, String(score));
      return Math.max(score, prev);
    }

    async function submitRunScore() {
      scoreSubmitPending = true;
      try {
        if (state.score > 0) {
          await DeskArcadeLeaderboard.trySubmit('wordforge', state.score, { panel: gameLbPanel, boardKey: state.mode });
        }
        await DeskArcadeLeaderboard.refreshPanel(gameLbPanel);
      } catch (_) {
        await DeskArcadeLeaderboard.refreshPanel(gameLbPanel).catch(() => {});
      } finally {
        scoreSubmitPending = false;
      }
    }

    function endRound() {
      if (!state.active && els.overlay.classList.contains('show')) return;
      clearInterval(state.timerId);
      state.active = false;
      els.input.disabled = true;
      const possibleWords = getPossibleWords();
      const foundDisplay = formatWordList(state.found, 12);
      const missed = possibleWords
        .filter(word => !state.found.includes(word))
        .sort((a, b) => scoreWord(b) - scoreWord(a) || b.length - a.length)
        .slice(0, 12);
      const missedDisplay = formatWordList(missed, 12);
      const best = saveBestScore(state.mode, state.score);
      const isRecord = state.score >= best && state.score > 0;
      const pct = possibleWords.length ? Math.round((state.found.length / possibleWords.length) * 100) : 0;
      const left = possibleWords.length - state.found.length;
      els.finalText.innerHTML = `
        You forged <strong>${state.found.length}</strong> words for <strong>${state.score}</strong> points${isRecord ? ' — <strong>new best!</strong>' : ''}.<br>
        Best (${state.mode}): <strong>${best}</strong><br><br>
        Best word: <strong>${getBestWord()}</strong> · Longest: <strong>${getLongestWord()}</strong><br>
        Found <strong>${pct}%</strong> of common words (${left} still on the board)
        <div class="results-grid">
          <div class="results-box">
            <h3>Words Found</h3>
            <div class="results-words">${foundDisplay}</div>
          </div>
          <div class="results-box">
            <h3>Still on the Board</h3>
            <div class="results-words">${missedDisplay}</div>
          </div>
        </div>
        <p style="margin-top:12px;font-size:0.82rem;color:var(--text-faint)">${scoreSubmitPending ? 'Saving score…' : 'Top-10 scores can be entered on the board below.'}</p>
      `;
      els.overlay.classList.add('show');
      updateMenuBests();
      void submitRunScore().then(() => {
        if (!state.active) {
          const note = els.finalText.querySelector('p');
          if (note) note.textContent = 'Top-10 scores can be entered on the board below.';
        }
      });
    }

    els.startChallenge.addEventListener('click', () => startMode('challenge'));
    els.startChill.addEventListener('click', () => startMode('chill'));
    els.returnArcadeBtn.addEventListener('click', () => {
      window.location.href = '../../index.html';
    });
    els.submitBtn.addEventListener('click', submitWord);
    els.input.addEventListener('keydown', e => {
      if (lbBlocksInput()) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        submitWord();
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        setTimeout(updateTileUsage, 0);
      } else if (e.key === 'Escape') {
        els.input.value = '';
        updateTileUsage();
      }
    });
    els.input.addEventListener('input', () => {
      const cleaned = els.input.value.toUpperCase().replace(/[^A-Z]/g, '');
      if (cleaned !== els.input.value) els.input.value = cleaned;
      updateTileUsage();
    });
    els.clearBtn.addEventListener('click', () => {
      if (!state.active || lbBlocksInput()) return;
      els.input.value = '';
      updateTileUsage();
      els.input.focus();
    });
    els.shuffleBtn.addEventListener('click', () => {
      if (!state.active || lbBlocksInput()) return;
      state.letters = shuffleArray(state.letters);
      render();
      els.input.focus();
    });
    els.newBtn.addEventListener('click', () => newRound(false));
    els.endBtn.addEventListener('click', () => {
      if (lbBlocksInput()) return;
      if (state.mode === 'challenge' && state.active && state.time > 5) {
        if (!confirm('End this round early?')) return;
      }
      endRound();
    });
    els.playAgainBtn.addEventListener('click', () => {
      if (lbBlocksInput()) return;
      newRound(false);
    });
    els.menuBtn.addEventListener('click', () => {
      if (lbBlocksInput()) return;
      showMenu();
    });

    updateMenuBests();
    DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordforge', 'challenge');
  </script>
</body>
</html>
