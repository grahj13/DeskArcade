<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">
  <script src="dictionary.js"></script>
  <style>
    :root {
      --accent: #eab308;
      --accent-2: #facc15;
      --green: var(--accent);
      --green-dim: color-mix(in srgb, var(--accent) 45%, transparent);
      --muted: var(--text-dim);
      --danger: #ef4444;
      --gold: #facc15;
    }

    body {
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .screen {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
      padding: 24px;
    }

    .hidden { display: none !important; }

    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--accent-text);
      text-align: center;
    }

    .logo {
      display: block;
      height: 56px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
    }

    .game .logo {
      height: 48px;
      margin: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 1rem;
      text-align: center;
    }

    .menu {
      display: grid;
      place-items: center;
      gap: 22px;
      min-height: 620px;
    }

    .menu-card-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(240px, 1fr));
      gap: 18px;
      width: min(720px, 100%);
    }

    .mode-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      background: var(--surface);
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      width: 100%;
      color: var(--text);
      font-family: var(--font-ui);
    }

    .mode-card:hover {
      transform: translateY(-1px);
      border-color: var(--accent-border);
      background: var(--accent-soft);
      box-shadow: 0 8px 22px var(--accent-glow);
    }

    .mode-card h2 {
      margin: 0 0 10px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 1.6rem;
    }

    .mode-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .credit {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .game header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    .game h1 {
      text-align: left;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .game .subtitle {
      text-align: left;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 10px;
      min-width: 310px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .stat strong {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-text);
    }

    .control-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      justify-content: center;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-display);
      font-size: 14px;
      letter-spacing: 0.03em;
      border-radius: var(--radius-sm);
      padding: 11px 18px;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    button:active { transform: scale(0.97); }

    button.primary {
      border: none;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      color: #1c1605;
      box-shadow: 0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    button.primary:hover {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      filter: brightness(1.08);
    }

    button.danger {
      border-color: rgba(239, 68, 68, 0.55);
      color: #fca5a5;
    }

    button.danger:hover {
      border-color: rgba(239, 68, 68, 0.75);
      background: rgba(239, 68, 68, 0.14);
    }

    .main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
    }

    .panel {
      max-width: 720px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      background: var(--surface);
    }

    .letters {
      display: grid;
      grid-template-columns: repeat(8, 56px);
      justify-content: center;
      gap: 10px;
      margin: 10px auto 14px;
      width: 100%;
    }

    .tile {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      position: relative;
      overflow: hidden;
      font-family: var(--font-display);
      color: #f4f4f8;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #0b0b15, #07070f);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.55);
      line-height: 1;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
    }

    .tile::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 1;
    }

    .tile .tile-letter {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transform: translateY(-1px);
    }

    .tile.used {
      opacity: 1;
      transform: scale(0.96);
      border-color: var(--accent-border);
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), transparent 24%),
        linear-gradient(145deg, rgba(234, 179, 8, 0.3), rgba(234, 179, 8, 0.08));
      color: var(--accent-2);
      box-shadow:
        inset 0 0 18px rgba(234, 179, 8, 0.16),
        0 8px 22px rgba(234, 179, 8, 0.2);
    }

    .tile.flash {
      transform: scale(1.08);
      border-color: var(--accent-border);
      box-shadow: 0 8px 22px rgba(234, 179, 8, 0.38);
    }

    .tile.full-forge {
      transform: scale(1.12);
      border-color: var(--accent-2);
      box-shadow: 0 8px 22px rgba(234, 179, 8, 0.5);
    }

    .entry {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: rgba(10, 10, 20, 0.7);
      color: var(--text);
      padding: 14px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    input.shake {
      animation: shake 0.22s ease-in-out;
      border-color: var(--danger);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    .message {
      min-height: 28px;
      color: var(--muted);
      font-weight: 700;
    }

    .message.good { color: var(--accent-text); }
    .message.bad { color: var(--danger); }
    .message.gold { color: var(--gold); }

    .found-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.82rem;
    }

    .found-list {
      min-height: 280px;
      max-height: 350px;
      overflow: auto;
      display: flex;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-chip {
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-pill);
      padding: 7px 10px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 0.9rem;
    }

    .rules {
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.92rem;
      margin-top: 14px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.22s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: min(520px, 100%);
      border: 1px solid var(--border-strong);
      background: rgba(14, 14, 24, 0.96);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-2);
      text-align: center;
      position: relative;
      z-index: 10000;
      transform: scale(0.92) translateY(10px);
      opacity: 0;
      transition: transform 0.24s ease, opacity 0.24s ease;
    }

    .overlay.show .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal h2 {
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 2rem;
      margin: 0 0 10px;
    }

    .modal p { color: var(--muted); }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      text-align: left;
    }

    .results-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--surface);
      max-height: 190px;
      overflow: auto;
    }

    .results-box h3 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .results-words {
      color: var(--text);
      font-size: 0.85rem;
      line-height: 1.55;
      word-break: break-word;
    }

    @media (max-width: 560px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    @media (max-width: 800px) {
      .letters {
        grid-template-columns: repeat(4, 56px);
      }
      .game header, .main { grid-template-columns: 1fr; display: grid; }
      .stats { min-width: 0; grid-template-columns: repeat(2, 1fr); }
      .letters { grid-template-columns: repeat(4, 1fr); }
      .entry { flex-direction: column; }
      .menu-card-wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="menuScreen" class="screen menu">
    <div>
      <img class="logo" src="wordforgelogo.png" alt="Word Forge" />
      <div class="subtitle">Forge as many words as you can from 8 letters.</div>
    </div>

    <div class="menu-card-wrap">
      <button id="startChallenge" class="mode-card" type="button">
        <h2>Challenge Mode</h2>
        <p>60 seconds while testing. Push for the highest score before the forge goes cold.</p>
      </button>
      <button id="startChill" class="mode-card" type="button">
        <h2>Chill Mode</h2>
        <p>No timer. Take your time and find every word you can.</p>
      </button>
    </div>

    <button id="returnArcadeBtn" class="da-back" type="button">Back to Arcade</button>

    <div id="leaderboard"></div>

    <div class="credit">Created by JGDev</div>
  </div>

  <div id="gameScreen" class="screen game hidden">
    <header>
      <div>
        <img class="logo" src="wordforgelogo.png" alt="Word Forge" />
        <div id="gameSubtitle" class="subtitle">Challenge Mode</div>
      </div>
      <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Words</span><strong id="wordCount">0</strong></div>
        <div class="stat"><span>Available</span><strong id="availableCount">0</strong></div>
        <div class="stat"><span>Time</span><strong id="timer">60</strong></div>
      </div>
    </header>

    <div class="control-row">
      <button id="newBtn">New Letters</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="endBtn" class="danger">End</button>
    </div>

    <div class="main">
      <section class="panel">
        <div class="letters" id="letters"></div>
        <div class="entry">
          <input id="wordInput" type="text" placeholder="Type a word..." autocomplete="off" />
          <button id="submitBtn" class="primary">Forge</button>
        </div>
        <div id="message" class="message">Use only the letters shown. Minimum 3 letters.</div>
        <div class="rules">
          Scoring: 3 letters = 10, 4 = 20, 5 = 40, 6 = 70, 7 = 110, 8 = 170. Use all 8 letters for a bonus.
        </div>
      </section>

      <section class="panel">
        <div class="found-title">
          <span>Forged Words</span>
          <span id="modeLabel">Challenge</span>
        </div>
        <div id="foundList" class="found-list"></div>
      </section>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="modal">
      <h2>Round Complete</h2>
      <p id="finalText"></p>
      <div class="modal-actions">
        <button id="playAgainBtn" class="primary">Play Again</button>
        <button id="menuBtn">Main Menu</button>
      </div>
    </div>
  </div>  <script src="../../assets/leaderboard.js"></script>

    const dictionary = [...new Set((window.dictionary || wordBank).map(word => String(word).trim().toLowerCase()).filter(word => word.length >= 3 && word.length <= 8))];

    const letterSets = [
      'FORGEMAP', 'TRIANGLE', 'NOTECAST', 'SILENTAR', 'STREAMON', 'CRAFTERS',
      'PLANTERS', 'ROASTING', 'REACTING', 'MASTERED', 'WORDPLAY', 'BRIGHTEN',
      'SCOREPAD', 'HOLDINGS', 'TRAINERS', 'SHARPEND', 'CLEANORT', 'PAINTERS',
      'READINGS', 'LISTENER', 'CREATION', 'STORAGED', 'TEACHERS', 'PLAYERS',
      'FARMINGS', 'CARTOONS', 'DEALINGS', 'PARTNERS', 'CLEANERS', 'MARKETED',
      'TRAILERS', 'GARDENER', 'REPAINTS', 'STEAMING', 'LEARNING', 'REACTORS'
    ];

    const vowels = ['A', 'E', 'I', 'O', 'U'];
    const minimumPossibleWords = 12;

    const state = {
      mode: 'challenge',
      letters: [],
      found: [],
      score: 0,
      time: 60,
      timerId: null,
      active: false
    };

    const els = {
      menuScreen: document.getElementById('menuScreen'),
      gameScreen: document.getElementById('gameScreen'),
      startChallenge: document.getElementById('startChallenge'),
      startChill: document.getElementById('startChill'),
      returnArcadeBtn: document.getElementById('returnArcadeBtn'),
      gameSubtitle: document.getElementById('gameSubtitle'),
      score: document.getElementById('score'),
      wordCount: document.getElementById('wordCount'),
      availableCount: document.getElementById('availableCount'),
      timer: document.getElementById('timer'),
      letters: document.getElementById('letters'),
      input: document.getElementById('wordInput'),
      message: document.getElementById('message'),
      foundList: document.getElementById('foundList'),
      restartBtn: document.getElementById('restartBtn'),
      newBtn: document.getElementById('newBtn'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      submitBtn: document.getElementById('submitBtn'),
      endBtn: document.getElementById('endBtn'),
      overlay: document.getElementById('overlay'),
      finalText: document.getElementById('finalText'),
      playAgainBtn: document.getElementById('playAgainBtn'),
      menuBtn: document.getElementById('menuBtn'),
      modeLabel: document.getElementById('modeLabel')
    };

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function canBuildWord(word) {
      return canBuildFromLetters(word, state.letters);
    }

    function canBuildFromLetters(word, letters) {
      const available = {};
      letters.forEach(letter => available[letter] = (available[letter] || 0) + 1);
      for (const char of word.toUpperCase()) {
        if (!available[char]) return false;
        available[char]--;
      }
      return true;
    }

    function hasEnoughVowels(letters) {
      const count = letters.filter(letter => vowels.includes(letter)).length;
      return count >= 2 && count <= 3;
    }

    function possibleWordsForLetters(letters) {
      return dictionary.filter(word => word.length >= 3 && word.length <= 8 && canBuildFromLetters(word, letters));
    }

    function pickGoodLetters() {
      const eightLetterWords = dictionary.filter(word => word.length === 8);

      for (let i = 0; i < 60; i++) {
        const word = eightLetterWords[Math.floor(Math.random() * eightLetterWords.length)];
        if (!word) break;
        const letters = shuffleArray(word.toUpperCase().split(''));
        if (hasEnoughVowels(letters) && possibleWordsForLetters(letters).length >= minimumPossibleWords) {
          return letters;
        }
      }

      const shuffledSets = shuffleArray(letterSets);
      for (const set of shuffledSets) {
        const letters = shuffleArray(set.split(''));
        if (hasEnoughVowels(letters) && possibleWordsForLetters(letters).length >= minimumPossibleWords) {
          return letters;
        }
      }

      return shuffleArray('REACTING'.split(''));
    }

    function scoreWord(word) {
      const len = word.length;
      let points = 0;
      if (len === 3) points = 10;
      else if (len === 4) points = 20;
      else if (len === 5) points = 40;
      else if (len === 6) points = 70;
      else if (len === 7) points = 110;
      else points = 170;
      if (len === 8) points += 80;
      return points;
    }

    function getPossibleWords() {
      return possibleWordsForLetters(state.letters);
    }

    function getBestWord() {
      if (!state.found.length) return 'None';
      return state.found.slice().sort((a, b) => scoreWord(b) - scoreWord(a) || b.length - a.length)[0].toUpperCase();
    }

    function getLongestWord() {
      if (!state.found.length) return 'None';
      return state.found.slice().sort((a, b) => b.length - a.length || a.localeCompare(b))[0].toUpperCase();
    }

    function setMessage(text, type = '') {
      els.message.textContent = text;
      els.message.className = 'message ' + type;
    }

    function shakeInput() {
      els.input.classList.remove('shake');
      void els.input.offsetWidth;
      els.input.classList.add('shake');
    }

    function flashTiles(isFullForge = false) {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      tiles.forEach(tile => tile.classList.add(isFullForge ? 'full-forge' : 'flash'));
      setTimeout(() => {
        tiles.forEach(tile => tile.classList.remove('flash', 'full-forge'));
      }, isFullForge ? 420 : 260);
    }

    function formatWordList(words, limit = 50) {
      if (!words.length) return 'None';
      const sorted = words.slice().sort((a, b) => b.length - a.length || a.localeCompare(b)).map(w => w.toUpperCase());
      const visible = sorted.slice(0, limit).join(', ');
      const remaining = sorted.length - limit;
      return remaining > 0 ? `${visible}<br><br>+ ${remaining} more...` : visible;
    }

    function render() {
      els.score.textContent = state.score;
      els.wordCount.textContent = state.found.length;
      els.availableCount.textContent = getPossibleWords().length;
      els.timer.textContent = state.mode === 'challenge' ? state.time : '∞';
      els.modeLabel.textContent = state.mode === 'challenge' ? 'Challenge' : 'Chill';
      els.gameSubtitle.textContent = state.mode === 'challenge' ? 'Challenge Mode: 60 seconds testing' : 'Chill Mode: no timer';
      els.letters.innerHTML = '';
      state.letters.forEach((letter, index) => {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'tile';
        tile.innerHTML = `<span class="tile-letter">${letter}</span>`;
        tile.dataset.index = index;
        tile.addEventListener('click', () => addLetterFromTile(index));
        els.letters.appendChild(tile);
      });
      updateTileUsage();
      els.foundList.innerHTML = '';
      state.found.slice().sort((a, b) => b.length - a.length || a.localeCompare(b)).forEach(word => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.textContent = word;
        els.foundList.appendChild(chip);
      });
    }

    function startTimer() {
      clearInterval(state.timerId);
      if (state.mode !== 'challenge') return;
      state.timerId = setInterval(() => {
        state.time--;
        render();
        if (state.time <= 0) endRound();
      }, 1000);
    }

    function showGame() {
      els.menuScreen.classList.add('hidden');
      els.gameScreen.classList.remove('hidden');
    }

    function showMenu() {
      clearInterval(state.timerId);
      state.active = false;
      els.overlay.classList.remove('show');
      els.gameScreen.classList.add('hidden');
      els.menuScreen.classList.remove('hidden');
    }

    function newRound(keepLetters = false) {
      clearInterval(state.timerId);
      if (!keepLetters) {
        state.letters = pickGoodLetters();
      }
      state.found = [];
      state.score = 0;
      state.time = 60;
      state.active = true;
      els.overlay.classList.remove('show');
      els.input.value = '';
      els.input.disabled = false;
      setMessage('Use only the letters shown. Minimum 3 letters.');
      render();
      startTimer();
      els.input.focus();
    }

    function startMode(mode) {
      if (!dictionary.length) {
        alert('Dictionary failed to load. Check dictionary.js is in the same folder as index.html and starts with: window.dictionary = [...]');
        return;
      }
      state.mode = mode;
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordforge', state.mode);
      showGame();
      newRound(false);
    }

    function addLetterFromTile(index) {
      if (!state.active) return;
      const letter = state.letters[index];
      const current = els.input.value.toUpperCase();
      const available = {};
      state.letters.forEach(l => available[l] = (available[l] || 0) + 1);
      for (const char of current) {
        if (available[char]) available[char]--;
      }
      if (!available[letter]) {
        shakeInput();
        return;
      }
      els.input.value += letter;
      updateTileUsage();
      els.input.focus();
    }

    function updateTileUsage() {
      const tiles = Array.from(document.querySelectorAll('.tile'));
      tiles.forEach(tile => tile.classList.remove('used'));

      const selectedIndexes = new Set();
      const typedLetters = els.input.value.toUpperCase().split('');

      typedLetters.forEach(char => {
        const tileIndex = state.letters.findIndex((letter, index) => {
          return letter === char && !selectedIndexes.has(index);
        });

        if (tileIndex !== -1) {
          selectedIndexes.add(tileIndex);
          if (tiles[tileIndex]) tiles[tileIndex].classList.add('used');
        }
      });
    }

    function submitWord() {
      if (!state.active) return;
      const word = els.input.value.trim().toLowerCase();
      els.input.value = '';

      if (word.length < 3) {
        setMessage('Too short. Minimum 3 letters.', 'bad');
        shakeInput();
        return;
      }
      if (state.found.includes(word)) {
        setMessage('Already forged. Find another.', 'bad');
        shakeInput();
        return;
      }
      if (!canBuildWord(word)) {
        setMessage('You cannot build that from these letters.', 'bad');
        shakeInput();
        return;
      }
      if (!dictionary.includes(word)) {
        setMessage('Not in the forge dictionary yet.', 'bad');
        shakeInput();
        return;
      }

      const points = scoreWord(word);
      state.found.push(word);
      state.score += points;
      setMessage(word.length === 8 ? `FULL FORGE! +${points}` : `Forged: ${word.toUpperCase()} +${points}`, word.length === 8 ? 'gold' : 'good');
      render();
      flashTiles(word.length === 8);
    }

    function getBestScore(mode) {
      return Number(localStorage.getItem('wordforgeBest_' + mode) || 0);
    }

    function saveBestScore(mode, score) {
      const prev = getBestScore(mode);
      if (score > prev) localStorage.setItem('wordforgeBest_' + mode, String(score));
      return Math.max(score, prev);
    }

    function endRound() {
      clearInterval(state.timerId);
      state.active = false;
      els.input.disabled = true;
      const possibleWords = getPossibleWords();
      const missedWords = possibleWords.filter(word => !state.found.includes(word));
      const foundDisplay = formatWordList(state.found, 50);
      const missedDisplay = formatWordList(missedWords, 50);
      const best = saveBestScore(state.mode, state.score);
      const isRecord = state.score >= best && state.score > 0;
      els.finalText.innerHTML = `
        You forged <strong>${state.found.length}</strong> words and scored <strong>${state.score}</strong> points${isRecord ? ' — <strong>new best!</strong>' : ''}.<br>
        Best (${state.mode}): <strong>${best}</strong><br><br>
        Best word: <strong>${getBestWord()}</strong><br>
        Longest word: <strong>${getLongestWord()}</strong><br>
        Possible words found: <strong>${state.found.length}/${possibleWords.length}</strong><br>
        Missed words: <strong>${missedWords.length}</strong>
        <div class="results-grid">
          <div class="results-box">
            <h3>Words Found</h3>
            <div class="results-words">${foundDisplay}</div>
          </div>
          <div class="results-box">
            <h3>Words Missed</h3>
            <div class="results-words">${missedDisplay}</div>
          </div>
        </div>
      `;
      els.overlay.classList.add('show');

      DeskArcadeLeaderboard.trySubmit('wordforge', state.score, { panel: lbPanel, boardKey: state.mode }).catch(() => {});
    }

    els.startChallenge.addEventListener('click', () => startMode('challenge'));
    els.startChill.addEventListener('click', () => startMode('chill'));
    els.returnArcadeBtn.addEventListener('click', () => {
	window.location.href = '../../index.html';
    });
    els.submitBtn.addEventListener('click', submitWord);
    els.input.addEventListener('keydown', e => {
      if (e.key === 'Enter') submitWord();
      setTimeout(updateTileUsage, 0);
    });
    els.input.addEventListener('input', updateTileUsage);
    els.shuffleBtn.addEventListener('click', () => {
      state.letters = shuffleArray(state.letters);
      render();
      els.input.focus();
    });
    els.newBtn.addEventListener('click', () => newRound(false));
    els.endBtn.addEventListener('click', endRound);
    els.playAgainBtn.addEventListener('click', () => newRound(false));
    els.menuBtn.addEventListener('click', showMenu);

    DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordforge', 'challenge');
  </script>
