<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Trap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">
  <style>
    :root {
      --accent: #f43f5e;
      --accent-2: #fb7185;
      --muted: var(--text-dim);
      --danger: #ef4444;
      --line: var(--border);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .game-shell {
      position: relative;
      width: 100%;
      max-width: 1060px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
      overflow: hidden;
      z-index: 4;
    }

    .game-shell::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-border), transparent);
      pointer-events: none;
    }

    .header {
      position: relative;
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .logo {
      display: block;
      height: 52px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      margin: 0 auto 10px;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--text-dim);
      font-size: 0.95rem;
      letter-spacing: 0.4px;
    }

    .build {
      margin-top: 8px;
      color: var(--text-faint);
      font-size: 0.85rem;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .content {
      position: relative;
      display: grid;
      grid-template-columns: 375px 1fr;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 18px;
      overflow: hidden;
    }

    .panel > * { position: relative; z-index: 1; }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      color: var(--text-dim);
      font-family: var(--font-ui);
      font-size: 0.72rem;
      background: var(--surface);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulseDot 1s ease-in-out infinite alternate;
    }

    .hangman-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 326px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, #0b0b15, #07070f);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    svg {
      width: 100%;
      max-width: 285px;
      height: auto;
      overflow: visible;
    }

    .gallows,
    .part {
      stroke: rgba(255, 255, 255, 0.4);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .gallows { opacity: 0.8; }

    .part {
      transition: opacity 0.18s ease, transform 0.18s ease;
      transform-origin: center;
    }

    .part.hidden {
      opacity: 0.07;
      transform: scale(0.96);
    }

    .danger-mode .part:not(.hidden),
    .danger-mode .gallows {
      stroke: var(--danger);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .stat-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      background: var(--surface);
    }

    .stat-label {
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      color: var(--accent-text);
      font-weight: 700;
    }

    .difficulty-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .session-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .session-btn {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 8px;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .session-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .session-btn.active {
      color: var(--text);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .difficulty-btn {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      background: var(--surface);
      color: var(--text-dim);
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .difficulty-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .difficulty-btn.active {
      color: var(--text);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .word-display {
      min-height: 84px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin: 20px 0 16px;
      padding: 18px 16px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, #0b0b15, #07070f);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .letter-slot {
      width: 42px;
      border-bottom: 3px solid var(--accent);
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      text-transform: uppercase;
      transition: transform 0.16s ease, color 0.16s ease;
    }

    .letter-slot.revealed {
      animation: letterPop 0.22s ease;
    }

    .letter-slot.win-flash {
      color: #34d399;
      border-bottom-color: #34d399;
    }

    .word-meta {
      text-align: center;
      color: var(--text-faint);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: -8px 0 14px;
    }

    @keyframes letterPop {
      0% { transform: scale(0.82); }
      55% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .space-slot {
      width: 18px;
      border-bottom: none;
    }

    .message {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      background: var(--surface);
      margin-bottom: 18px;
    }

    .message.win {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(52, 211, 153, 0.08);
    }

    .message.lose,
    .message.warning {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.45);
      background: rgba(239, 68, 68, 0.08);
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .key {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #11111f, #0a0a14);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 12px 6px;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .key:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.02);
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .key:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      text-decoration: line-through;
    }

    .key.correct:disabled {
      opacity: 1;
      text-decoration: none;
      color: #fff;
      border-color: var(--accent-border);
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
    }

    .key.wrong:disabled {
      color: #62627a;
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      position: relative;
      border: none;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
      color: #fff;
      padding: 13px 22px;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      overflow: hidden;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
      box-shadow: 0 12px 30px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .btn:active { transform: translateY(0); }

    .btn.secondary {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      box-shadow: none;
    }

    .btn.secondary:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      filter: none;
      box-shadow: none;
    }

    .footer-note {
      margin-top: 14px;
      color: var(--text-faint);
      font-size: 0.8rem;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .end-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(4, 4, 10, 0.78);
      backdrop-filter: blur(7px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .end-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .end-card {
      width: min(100%, 590px);
      border-radius: var(--radius-lg);
      padding: 30px 24px;
      border: 1px solid var(--border-strong);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        rgba(14, 14, 26, 0.97);
      box-shadow: var(--shadow-2);
      text-align: center;
      transform: scale(0.96);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .end-overlay.show .end-card { transform: scale(1); }

    .end-card.win {
      border-color: rgba(52, 211, 153, 0.45);
    }

    .end-card.lose {
      border-color: rgba(239, 68, 68, 0.55);
      animation: dangerPulse 1s ease-in-out infinite alternate;
    }

    .end-kicker {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: var(--text-dim);
    }

    .end-card.lose .end-kicker { color: #fca5a5; }

    .end-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .end-card.win .end-title {
      color: #34d399;
    }

    .end-card.lose .end-title {
      color: #f87171;
    }

    .end-text {
      margin: 14px 0 0;
      line-height: 1.6;
      color: var(--text);
    }

    .end-word {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .end-card.lose .end-word {
      border-color: rgba(239, 68, 68, 0.38);
      background: rgba(239, 68, 68, 0.09);
    }

    .end-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .screen-flash { animation: screenFlash 0.55s ease-out; }
    .shake { animation: shake 0.25s linear; }

    @keyframes pulseDot {
      from { opacity: 0.45; transform: scale(0.86); }
      to { opacity: 1; transform: scale(1.12); }
    }

    @keyframes dangerPulse {
      from { box-shadow: 0 0 24px rgba(239, 68, 68, 0.12); }
      to { box-shadow: 0 0 44px rgba(239, 68, 68, 0.26); }
    }

    @keyframes screenFlash {
      0% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
      30% { box-shadow: inset 0 0 140px rgba(239, 68, 68, 0.22); }
      100% { box-shadow: 0 0 0 rgba(239, 68, 68, 0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-2px); }
    }

    @media (max-width: 900px) {
      .content { grid-template-columns: 1fr; }
      .hangman-wrap { min-height: 270px; }
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .header, .content { padding-left: 14px; padding-right: 14px; }
      .keyboard { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
      .letter-slot { width: 34px; font-size: 1.4rem; }
      .difficulty-row { grid-template-columns: 1fr; }
      .btn { width: 100%; }
    }
  </style>
</head>

    <header class="header">
      <img src="wordtraplogo.png" alt="Word Trap" class="logo" />
      <p class="subtitle">Guess the word before the trap closes.</p>

      <div class="top-actions">
        <a class="da-back" href="../../index.html">Back to Arcade</a>
      </div>
    </header>

    <main class="content">
      <section class="panel" id="trap-panel">

        </h2>

        <div class="hangman-wrap">
          <svg viewBox="0 0 220 260" aria-label="Hangman drawing">
            <line class="gallows" x1="30" y1="235" x2="170" y2="235" />
            <line class="gallows" x1="65" y1="235" x2="65" y2="20" />
            <line class="gallows" x1="65" y1="20" x2="145" y2="20" />
            <line class="gallows" x1="145" y1="20" x2="145" y2="48" />

            <circle id="part-1" class="part hidden" cx="145" cy="72" r="24" />
            <line id="part-2" class="part hidden" x1="145" y1="96" x2="145" y2="155" />
            <line id="part-3" class="part hidden" x1="145" y1="112" x2="110" y2="136" />
            <line id="part-4" class="part hidden" x1="145" y1="112" x2="180" y2="136" />
            <line id="part-5" class="part hidden" x1="145" y1="155" x2="116" y2="196" />
            <line id="part-6" class="part hidden" x1="145" y1="155" x2="174" y2="196" />
          </svg>
        </div>

        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">Wrong Guesses</div>
            <div class="stat-value" id="wrong-count">0 / 6</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Lives Left</div>
            <div class="stat-value" id="lives-left">6</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Streak</div>
            <div class="stat-value" id="streak">0</div>
          </div>
        </div>

        <div class="difficulty-row" aria-label="Difficulty selector">
          <button class="difficulty-btn active" data-difficulty="easy">EASY</button>
          <button class="difficulty-btn" data-difficulty="normal">NORMAL</button>
          <button class="difficulty-btn" data-difficulty="hard">HARD</button>
        </div>

        <div class="session-row" aria-label="Session length">
          <button class="session-btn active" data-session="quick">QUICK · 3 WORDS</button>
          <button class="session-btn" data-session="open">OPEN SESSION</button>
        </div>
      </section>

      <section class="panel">
        <h2 class="panel-title">
          <span>GUESS THE WORD</span>
          <span class="status-pill" id="difficulty-label">EASY MODE</span>
        </h2>

        <div class="word-display" id="word-display"></div>
        <div class="word-meta" id="word-meta"></div>

        <div class="message" id="message">Pick a letter to start.</div>

        <div class="keyboard" id="keyboard"></div>

        <div class="actions">
          <button class="btn" id="new-game-btn">Reload Word Trap</button>
          <a class="da-back" id="return-btn" href="../../index.html">Back to Arcade</a>
        </div>

        <div class="footer-note">Keyboard or click · 6 wrong guesses · Quick mode: 3 words per run</div>

        <div id="leaderboard"></div>
      </section>
    </main>
  </div>

  <div class="end-overlay" id="end-overlay" aria-hidden="true">
    <div class="end-card" id="end-card">
      <div class="end-kicker" id="end-kicker"></div>
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-text" id="end-text"></p>
      <div class="end-word" id="end-word"></div>
      <div class="end-actions">
        <button class="btn" id="overlay-new-game-btn">Play Again</button>
        <a class="da-back" href="../../index.html">Back to Arcade</a>
      </div>
    </div>

      hard: [

        'sympathy', 'symphony', 'technical', 'telephone', 'temporary', 'territory', 'testimony', 'textbook',
        'therapist', 'thickness', 'thousand', 'threshold', 'throughout', 'tolerance', 'touchdown', 'tradition',
        'transform', 'translate', 'transport', 'treasurer', 'treatment', 'tremendous', 'triangle', 'ultimate',
        'umbrella', 'undertake', 'universal', 'universe', 'unusual', 'upstairs', 'vacation', 'valuable', 'variable',
        'vegetable', 'velocity', 'vertical', 'viewpoint', 'virtually', 'visibility', 'visiting', 'vitamin',
        'vocabulary', 'wandering', 'warehouse', 'warrior', 'weather', 'wedding', 'welcome', 'wonderful', 'woodland',
        'workforce', 'workshop', 'worldwide', 'wireless', 'typewriter', 'backstage', 'clockwork', 'crossword',
        'doorframe', 'earthworm', 'fireplace', 'goldfinch', 'handshake', 'headphone', 'inkstand', 'jellyfish',
        'kilobyte', 'lamplight', 'moonlight', 'nameplate', 'outfield', 'playtime', 'quicksand', 'roadsign',
        'seashore', 'tabletop', 'underdog', 'vineyard', 'windmill', 'yearbook', 'zebrafish'
      ]
    };

    Object.keys(WORD_BANKS).forEach(key => {
      WORD_BANKS[key] = [...new Set(WORD_BANKS[key])];
    });

    const MAX_WRONG = 6;
    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    const gameShell = document.getElementById('game-shell');
    const trapPanel = document.getElementById('trap-panel');
    const wordDisplay = document.getElementById('word-display');
    const wordMeta = document.getElementById('word-meta');
    const keyboard = document.getElementById('keyboard');
    const message = document.getElementById('message');
    const wrongCount = document.getElementById('wrong-count');
    const livesLeft = document.getElementById('lives-left');
    const scoreEl = document.getElementById('score');
    const streakEl = document.getElementById('streak');
    const statusText = document.getElementById('status-text');
    const difficultyLabel = document.getElementById('difficulty-label');
    const newGameBtn = document.getElementById('new-game-btn');
    const overlayNewGameBtn = document.getElementById('overlay-new-game-btn');
    const endOverlay = document.getElementById('end-overlay');
    const endCard = document.getElementById('end-card');
    const endKicker = document.getElementById('end-kicker');
    const endTitle = document.getElementById('end-title');
    const endText = document.getElementById('end-text');
    const endWord = document.getElementById('end-word');
    const difficultyButtons = Array.from(document.querySelectorAll('.difficulty-btn'));
    const sessionButtons = Array.from(document.querySelectorAll('.session-btn'));
    const parts = Array.from({ length: 6 }, (_, i) => document.getElementById(`part-${i + 1}`));

    const SESSION_QUICK_WORDS = 3;

    let selectedWord = '';
    let guessedLetters = new Set();
    let wrongLetters = new Set();
    let usedWords = new Set();
    let gameOver = false;
    let difficulty = 'easy';
    let sessionMode = 'quick';
    let score = 0;
    DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordtrap', difficulty);
    let streak = 0;
    let roundsPlayed = 0;
    let sessionWordsPlayed = 0;
    let lastRevealed = new Set();
    let bestScore = Number(localStorage.getItem('wordtrapBestScore') || 0);
    let bestStreak = Number(localStorage.getItem('wordtrapBestStreak') || 0);

    function bestKey(suffix) {
      return `wordtrapBest_${suffix}_${difficulty}`;
    }

    function loadDifficultyBests() {
      bestScore = Number(localStorage.getItem(bestKey('score')) || 0);
      bestStreak = Number(localStorage.getItem(bestKey('streak')) || 0);
    }

    function pickWord() {
      const pool = WORD_BANKS[difficulty];
      if (usedWords.size >= pool.length) usedWords.clear();

      let candidates = pool.filter(w => !usedWords.has(w.toUpperCase()));

      if (roundsPlayed < 3 && difficulty === 'easy') {
        const short = candidates.filter(w => w.length <= 5);
        if (short.length) candidates = short;
      }

      if (!candidates.length) {
        usedWords.clear();
        candidates = [...pool];
      }

      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      const word = pick.toUpperCase();
      usedWords.add(word);
      return word;
    }

    function createKeyboard() {
      keyboard.innerHTML = '';
      ALPHABET.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'key';
        btn.textContent = letter;
        btn.setAttribute('data-letter', letter);
        btn.addEventListener('click', () => {
          if (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen()) return;
          handleGuess(letter);
        });
        keyboard.appendChild(btn);
      });
    }

    function renderWord() {
      wordDisplay.innerHTML = '';
      const revealAll = gameOver && wrongLetters.size >= MAX_WRONG;
      const letterCount = selectedWord.replace(/\s/g, '').length;
      wordMeta.textContent = sessionMode === 'quick'
        ? `${letterCount} letters · ${getUniqueLetters().length} unique · Word ${sessionWordsPlayed}/${SESSION_QUICK_WORDS}`
        : `${letterCount} letters · ${getUniqueLetters().length} unique`;

      selectedWord.split('').forEach(char => {
        const slot = document.createElement('div');

        if (char === ' ') {
          slot.className = 'space-slot';
          wordDisplay.appendChild(slot);
          return;
        }

        const show = guessedLetters.has(char) || revealAll;
        slot.className = 'letter-slot';
        if (show) {
          slot.textContent = char;
          if (guessedLetters.has(char) && !lastRevealed.has(char)) {
            slot.classList.add('revealed');
          }
          if (gameOver && checkWin()) slot.classList.add('win-flash');
        } else {
          slot.textContent = '';
        }
        wordDisplay.appendChild(slot);
      });

      lastRevealed = new Set(guessedLetters);
    }

    function updateStats() {
      const wrong = wrongLetters.size;
      const lives = Math.max(0, MAX_WRONG - wrong);
      wrongCount.textContent = `${wrong} / ${MAX_WRONG}`;
      livesLeft.textContent = lives;
      scoreEl.textContent = score;
      streakEl.textContent = streak;

      parts.forEach((part, index) => {
        part.classList.toggle('hidden', index >= wrong);
      });

      trapPanel.classList.toggle('danger-mode', lives <= 2 && !gameOver);
      statusText.textContent = gameOver ? 'LOCKED' : lives <= 2 ? 'DANGER' : 'ACTIVE';
    }

    function updateKeyboard(letter, isCorrect) {
      const btn = keyboard.querySelector(`[data-letter="${letter}"]`);
      if (!btn) return;
      btn.disabled = true;
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }

    function getUniqueLetters() {
      return [...new Set(selectedWord.replace(/\s/g, '').split(''))];
    }

    function checkWin() {
      return getUniqueLetters().every(letter => guessedLetters.has(letter));
    }

    function calculateWinScore() {
      const difficultyBonus = difficulty === 'hard' ? 300 : difficulty === 'normal' ? 200 : 100;
      const livesBonus = (MAX_WRONG - wrongLetters.size) * 50;
      const wordBonus = selectedWord.length * 10;
      return difficultyBonus + livesBonus + wordBonus;
    }

    function shakeGame() {
      gameShell.classList.remove('shake');
      void gameShell.offsetWidth;
      gameShell.classList.add('shake');
    }

    function applyWinScore() {
      const roundScore = calculateWinScore();
      score += roundScore;
      streak += 1;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(bestKey('score'), String(bestScore));
        localStorage.setItem('wordtrapBestScore', String(bestScore));
      }
      if (streak > bestStreak) {
        bestStreak = streak;
        localStorage.setItem(bestKey('streak'), String(bestStreak));
        localStorage.setItem('wordtrapBestStreak', String(bestStreak));
      }
      return roundScore;
    }

    function showEndOverlay(won) {
      endOverlay.classList.add('show');
      endOverlay.setAttribute('aria-hidden', 'false');
      endCard.className = `end-card ${won ? 'win' : 'lose'}`;

      const sessionComplete = sessionMode === 'quick' && sessionWordsPlayed >= SESSION_QUICK_WORDS;

      if (won) {
        const roundScore = applyWinScore();
        updateStats();
        endKicker.textContent = sessionComplete ? 'Session complete' : 'Word cracked';
        endTitle.textContent = sessionComplete ? 'Quick Run Done' : 'You Escaped';
        endText.textContent = sessionComplete
          ? `${SESSION_QUICK_WORDS} words played · Streak ${streak} · Total ${score} · Best ${bestScore}`
          : `+${roundScore} points · Streak ${streak} · Total ${score} · Best ${bestScore}`;
        endWord.textContent = selectedWord;

        if (sessionComplete || sessionMode !== 'quick') {
          DeskArcadeLeaderboard.trySubmit('wordtrap', score, { panel: lbPanel, boardKey: difficulty }).catch(() => {});
        }
      } else {
        streak = 0;
        updateStats();
        document.body.classList.remove('screen-flash');
        void document.body.offsetWidth;
        document.body.classList.add('screen-flash');
        endKicker.textContent = sessionComplete ? 'Session complete' : 'Out of guesses';
        endTitle.textContent = sessionComplete ? 'Quick Run Done' : 'Trap Sprung';
        endText.textContent = sessionComplete
          ? `${SESSION_QUICK_WORDS} words played · Score ${score} · Streak reset`
          : `Streak reset. Score stays at ${score}.`;
        endWord.textContent = selectedWord;
      }

      overlayNewGameBtn.textContent = sessionComplete ? 'New Session' : 'Play Again';
    }

    function hideEndOverlay() {
      endOverlay.classList.remove('show');
      endOverlay.setAttribute('aria-hidden', 'true');
    }

    function endGame(won) {
      gameOver = true;
      Array.from(keyboard.querySelectorAll('.key')).forEach(btn => {
        btn.disabled = true;
      });

      renderWord();

      if (won) {
        if (sessionMode === 'quick' && sessionWordsPlayed < SESSION_QUICK_WORDS) {
          const roundScore = applyWinScore();
          message.textContent = `+${roundScore} points · Word ${sessionWordsPlayed}/${SESSION_QUICK_WORDS} done`;
          message.className = 'message win';
          updateStats();
          setTimeout(() => startGame(false), 480);
          return;
        }
        message.textContent = 'You Escaped!';
        message.className = 'message win';
        showEndOverlay(true);
      } else {
        message.textContent = `Trap Sprung! The word was ${selectedWord}.`;
        message.className = 'message lose';
        setTimeout(() => showEndOverlay(false), 420);
      }

      updateStats();
    }

    function handleGuess(letter) {
      if (gameOver || guessedLetters.has(letter) || wrongLetters.has(letter)) return;

      if (selectedWord.includes(letter)) {
        guessedLetters.add(letter);
        updateKeyboard(letter, true);
        renderWord();

        if (checkWin()) {
          endGame(true);
        } else {
          const hidden = getUniqueLetters().filter(l => !guessedLetters.has(l)).length;
          message.textContent = `${letter} hit · ${hidden} letter${hidden === 1 ? '' : 's'} left`;
          message.className = 'message';
        }
      } else {
        wrongLetters.add(letter);
        updateKeyboard(letter, false);
        updateStats();
        shakeGame();

        if (wrongLetters.size >= MAX_WRONG) {
          endGame(false);
        } else {
          const lives = MAX_WRONG - wrongLetters.size;
          message.textContent = lives <= 2
            ? `${letter} missed · ${lives} guess${lives === 1 ? '' : 'es'} left`
            : `${letter} not in word`;
          message.className = lives <= 2 ? 'message warning' : 'message';
        }
      }
    }

    function setDifficulty(nextDifficulty) {
      difficulty = nextDifficulty;
      difficultyButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
      });
      difficultyLabel.textContent = `${difficulty.toUpperCase()} MODE`;
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'wordtrap', difficulty);
      loadDifficultyBests();
      usedWords.clear();
      startGame();
    }

    function setSessionMode(nextMode) {
      if (sessionMode === nextMode) return;
      sessionMode = nextMode;
      sessionButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.session === sessionMode);
      });
      sessionWordsPlayed = 0;
      score = 0;
      streak = 0;
      roundsPlayed = 0;
      usedWords.clear();
      startGame();
    }

    function startGame(resetSession = false) {
      if (resetSession) {
        sessionWordsPlayed = 0;
        score = 0;
        streak = 0;
        roundsPlayed = 0;
        usedWords.clear();
      }

      selectedWord = pickWord();
      roundsPlayed += 1;
      sessionWordsPlayed += 1;
      guessedLetters = new Set();
      wrongLetters = new Set();
      lastRevealed = new Set();
      gameOver = false;
      hideEndOverlay();
      trapPanel.classList.remove('danger-mode');
      message.textContent = 'Pick a letter to start.';
      message.className = 'message';
      createKeyboard();
      renderWord();
      updateStats();
    }

    document.addEventListener('keydown', (event) => {
      if (typeof DeskArcadeLeaderboard !== 'undefined' && DeskArcadeLeaderboard.isModalOpen()) return;
      if (gameOver || event.repeat) return;
      const letter = event.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) {
        event.preventDefault();
        handleGuess(letter);
      }
    });

    difficultyButtons.forEach(btn => {
      btn.addEventListener('click', () => setDifficulty(btn.dataset.difficulty));
    });

    sessionButtons.forEach(btn => {
      btn.addEventListener('click', () => setSessionMode(btn.dataset.session));
    });

    newGameBtn.addEventListener('click', () => startGame(true));
    overlayNewGameBtn.addEventListener('click', () => {
      if (sessionMode === 'quick' && sessionWordsPlayed >= SESSION_QUICK_WORDS) {
        startGame(true);
      } else {
        startGame(false);
      }
    });

    loadDifficultyBests();
    startGame();
  </script>
