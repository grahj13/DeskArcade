
<!-- Perfect 10 | DeskArcade -->
<!-- Save as: games/perfect10/index.html -->
<!-- Logo must be: perfect10logo.png -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfect 10 | DeskArcade</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/theme.css">
<link rel="stylesheet" href="../../assets/leaderboard.css">

<style>
:root {
  --accent:#06b6d4;
  --accent-2:#22d3ee;
  --red:#ef4444;
  --yellow:#f59e0b;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.game-shell{
  position:relative;
  z-index:1;
  width:100%;
  max-width:720px;
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
    var(--surface-strong);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow-2);
  padding:24px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.reset-btn{
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text);
  padding:10px 18px;
  border-radius:var(--radius-sm);
  font-family:var(--font-display);
  font-size:13px;
  font-weight:600;
  letter-spacing:0.03em;
  cursor:pointer;
  transition:border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

.reset-btn:hover{
  border-color:var(--accent-border);
  background:var(--accent-soft);
  transform:translateY(-1px);
}

.logo-wrap{
  text-align:center;
  margin:10px 0 20px;
}

.logo{
  height:52px;
  width:auto;
  max-width:min(420px, 55vw);
  object-fit:contain;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.55));
}

.display-panel{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:24px;
  text-align:center;
  background:var(--surface);
  margin-bottom:18px;
}

.status{
  color:var(--text-dim);
  margin-bottom:10px;
}

.result-time{
  font-family:var(--font-mono);
  font-size:3.8rem;
  font-weight:700;
  color:var(--accent-text);
  margin-bottom:6px;
}

.result-detail{
  min-height:22px;
  font-weight:700;
}

.new-best{
  min-height:24px;
  margin-top:8px;
  font-family:var(--font-display);
  font-weight:700;
  color:var(--yellow);
}

.main-button{
  width:100%;
  border:0;
  border-radius:var(--radius-sm);
  padding:22px;
  font-family:var(--font-display);
  font-size:2rem;
  font-weight:600;
  letter-spacing:0.04em;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--accent-2)));
  box-shadow:0 8px 22px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22);
  margin-bottom:16px;
  transition:transform 0.18s ease, filter 0.18s ease;
}

.main-button:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.main-button.stop{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  box-shadow:0 8px 22px rgba(239,68,68,0.22), inset 0 1px 0 rgba(255,255,255,0.22);
}

.main-button:disabled{
  opacity:0.65;
  cursor:not-allowed;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat-card{
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--surface);
  padding:14px;
  text-align:center;
}

.stat-label{
  color:var(--text-faint);
  font-size:10px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-bottom:4px;
}

.stat-value{
  font-family:var(--font-mono);
  font-size:1.2rem;
  font-weight:700;
  color:var(--accent-text);
}

.history{
  margin-top:18px;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  background:var(--surface);
  padding:14px;
}

.history-title{
  color:var(--text-faint);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  margin-bottom:10px;
}

.history-list{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.history-pill{
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  background:rgba(10,10,20,0.5);
  color:var(--text-dim);
  font-family:var(--font-mono);
  padding:6px 10px;
  font-size:0.85rem;
}

.good { color:#22d3ee; }
.ok { color:var(--yellow); }
.bad { color:var(--red); }

.perfect-hit {
  animation: perfectHit 0.75s ease;
}

@keyframes perfectHit {
  0% { transform:scale(1); }
  35% {
    transform:scale(1.12);
    text-shadow:
      0 0 18px rgba(34,211,238,0.7),
      0 0 34px rgba(34,211,238,0.4);
  }
  100% { transform:scale(1); }
}

.footer{
  text-align:center;
  margin-top:18px;
  font-size:0.8rem;
  color:var(--text-faint);
}
</style>
</head>

<body>

<main class="game-shell">

  <div class="top-bar">
    <a href="../../index.html" class="da-back arcade-btn">Return to Arcade</a>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

  <div class="logo-wrap">
    <img src="perfect10logo.png" alt="Perfect 10 Logo" class="logo">
  </div>

  <section class="display-panel">
    <div class="status" id="status">Ready when you are</div>
    <div class="result-time" id="time">10.00</div>
    <div class="result-detail" id="detail">Target</div>
    <div class="new-best" id="newBest"></div>
  </section>

  <button class="main-button" id="btn">START</button>

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Best</div>
      <div class="stat-value" id="best">--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Streak</div>
      <div class="stat-value" id="streak">0</div>
    </div>
  </section>

  <section class="history">
    <div class="history-title">Last 5</div>
    <div class="history-list" id="history"></div>
  </section>

  <div id="leaderboard"></div>

  <div class="footer">Created by JGDev</div>

</main><script src="../../assets/leaderboard.js?v=4"></script>
<script>
const lbPanel = document.getElementById('leaderboard');
DeskArcadeLeaderboard.mountPanel(lbPanel, 'perfect10', 'default');

const STORAGE_KEY = "perfect10";

let running = false;
let locked = false;
let start = 0;
let tickId = null;
let bestDiff = null;
let bestTime = null;
let streak = 0;
let history = [];

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    bestDiff = data.bestDiff ?? null;
    bestTime = data.bestTime ?? null;
    streak = data.streak ?? 0;
    history = Array.isArray(data.history) ? data.history : [];
    if (bestTime !== null) bestEl.textContent = bestTime.toFixed(2) + "s";
    streakEl.textContent = streak;
    updateHistory();
  } catch (_) {}
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    bestDiff,
    bestTime,
    streak,
    history
  }));
}

const btn = document.getElementById("btn");
const resetBtn = document.getElementById("resetBtn");
const status = document.getElementById("status");
const timeEl = document.getElementById("time");
const detail = document.getElementById("detail");
const newBest = document.getElementById("newBest");
const bestEl = document.getElementById("best");
const streakEl = document.getElementById("streak");
const historyEl = document.getElementById("history");

btn.addEventListener("click", handleButton);
resetBtn.addEventListener("click", resetGame);

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    handleButton();
  }
});

function handleButton() {
  if (locked) return;

  if (!running) {
    startGame();
  } else {
    stopGame();
  }
}

function startGame() {
  running = true;
  start = performance.now();

  btn.textContent = "STOP";
  btn.classList.add("stop");

  status.textContent = "Counting...";
  timeEl.textContent = "0.00";
  detail.textContent = "";
  newBest.textContent = "";

  if (tickId) cancelAnimationFrame(tickId);
  const tick = () => {
    if (!running) return;
    const elapsed = (performance.now() - start) / 1000;
    timeEl.textContent = elapsed.toFixed(2);
    tickId = requestAnimationFrame(tick);
  };
  tickId = requestAnimationFrame(tick);
}

function stopGame() {
  if (tickId) {
    cancelAnimationFrame(tickId);
    tickId = null;
  }

  const t = (performance.now() - start) / 1000;
  const diff = Math.abs(t - 10);
  const earlyLate = t < 10 ? "E" : "L";

  running = false;
  locked = true;
  btn.disabled = true;

  setTimeout(() => {
    locked = false;
    btn.disabled = false;
  }, 400);

  btn.textContent = "START";
  btn.classList.remove("stop");

  timeEl.textContent = t.toFixed(2) + "s";

  let cls = "bad";
  let message = "";

  if (diff <= 0.005) {
    cls = "good";
    message = "PERFECT 10";
    streak++;
  } else if (diff <= 0.10) {
    cls = "good";
    message = "Elite";
    streak++;
  } else if (diff <= 0.30) {
    cls = "ok";
    message = "Close";
    streak = 0;
  } else if (diff <= 0.75) {
    cls = "bad";
    message = "Rough";
    streak = 0;
  } else {
    cls = "bad";
    message = "Shocking";
    streak = 0;
  }

  detail.className = "result-detail " + cls;
  detail.textContent = `${message} — ${diff.toFixed(2)}s ${t < 10 ? "early" : "late"}`;

  let isNewBest = false;

  if (bestDiff === null || diff < bestDiff) {
    bestDiff = diff;
    bestTime = t;
    isNewBest = true;
  }

  bestEl.textContent = bestTime.toFixed(2) + "s";
  streakEl.textContent = streak;

  newBest.textContent = isNewBest ? "NEW BEST!" : "";

  history.unshift({
    time: t.toFixed(2),
    marker: earlyLate
  });

  history = history.slice(0, 5);
  updateHistory();

  timeEl.classList.remove("perfect-hit");
  void timeEl.offsetWidth;

  if (diff <= 0.10) {
    timeEl.classList.add("perfect-hit");
  }

  saveProgress();

  DeskArcadeLeaderboard.trySubmit('perfect10', Math.round(diff * 1000), { panel: lbPanel, boardKey: 'default' }).catch(() => {});
}

function updateHistory() {
  historyEl.innerHTML = "";

  if (history.length === 0) {
    historyEl.innerHTML = '<span class="history-pill">No attempts yet</span>';
    return;
  }

  history.forEach(item => {
    const el = document.createElement("span");
    el.className = "history-pill";
    el.textContent = `${item.time}s ${item.marker}`;
    historyEl.appendChild(el);
  });
}

function resetGame() {
  if (tickId) {
    cancelAnimationFrame(tickId);
    tickId = null;
  }

  running = false;
  locked = false;
  start = 0;
  bestDiff = null;
  bestTime = null;
  streak = 0;
  history = [];
  localStorage.removeItem(STORAGE_KEY);

  btn.disabled = false;
  btn.textContent = "START";
  btn.classList.remove("stop");

  status.textContent = "Ready when you are";
  timeEl.textContent = "10.00";
  detail.textContent = "Target";
  detail.className = "result-detail";
  newBest.textContent = "";
  bestEl.textContent = "--";
  streakEl.textContent = "0";

  updateHistory();
}

loadProgress();
</script>

</body>
</html>
