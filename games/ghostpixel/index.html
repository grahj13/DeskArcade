<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Pixel | DeskArcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/theme.css">
  <link rel="stylesheet" href="../../assets/leaderboard.css">
  <style>
    :root {
      --accent: #d946ef;
      --accent-2: #e879f9;
      --info: #22d3ee;
      --danger: #ef4444;
      --yellow: #f59e0b;
      --purple: #a78bfa;
      --muted: var(--text-dim);
    }

    * {
      user-select: none;
    }

    body {
      overflow: hidden;
    }

    /* Legacy ambient pixel layer — retired in the premium dark theme */
    .fx-layer {
      display: none;
    }

    .app {
      position: relative;
      height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        var(--surface-strong);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-2);
    }

    header {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      z-index: 2;
      position: relative;
      overflow: hidden;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .game-logo {
      display: block;
      height: clamp(44px, 6vw, 56px);
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
    }

    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(26px, 4vw, 46px);
      letter-spacing: 2px;
      color: var(--accent-text);
      line-height: 1;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--text-dim);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(82px, 1fr));
      gap: 10px;
      width: min(680px, 100%);
    }

    .stat {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      text-align: center;
    }

    .stat span {
      display: block;
      color: var(--text-faint);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .stat strong {
      font-family: var(--font-mono);
      color: var(--accent-text);
      font-size: 16px;
    }

    main {
      position: relative;
      flex: 1;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background:
        radial-gradient(circle at 30% 20%, rgba(217, 70, 239, 0.06), transparent 32%),
        radial-gradient(circle at 70% 80%, rgba(34, 211, 238, 0.04), transparent 30%),
        linear-gradient(180deg, #0c0c17, #08080f);
      box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      z-index: 1;
    }

    #playfield {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    #playfield.input-locked {
      cursor: none;
      pointer-events: none;
    }

    body.cursor-hidden,
    body.cursor-hidden * {
      cursor: none !important;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, rgba(6, 6, 12, 0.55), rgba(6, 6, 12, 0.9));
      z-index: 10;
    }

    .menu {
      width: min(820px, 100%);
      padding: 32px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012) 38%),
        rgba(16, 16, 28, 0.97);
      box-shadow: var(--shadow-2);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .menu::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-border), transparent);
      pointer-events: none;
    }

    .menu > * {
      position: relative;
      z-index: 1;
    }

    .menu h2 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: clamp(28px, 6vw, 66px);
      color: var(--accent-text);
      letter-spacing: 3px;
    }

    .menu-logo {
      height: 56px;
      width: auto;
      max-width: min(420px, 55vw);
      object-fit: contain;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.55));
    }

    .menu .tagline {
      margin: 0 0 22px;
      color: var(--text-dim);
      font-size: 15px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    button {
      border: 1px solid var(--border-strong);
      color: var(--text);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0.03em;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent-border);
      background: var(--accent-soft);
      box-shadow: 0 8px 22px var(--accent-glow);
    }

    button:active {
      transform: translateY(0);
    }

    .mode-card {
      min-height: 170px;
      text-align: left;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .mode-card::after {
      content: '●';
      position: absolute;
      right: 16px;
      bottom: 8px;
      color: var(--accent-border);
      font-size: 46px;
      transition: transform 160ms ease, color 160ms ease;
    }

    .mode-card:hover::after {
      transform: scale(1.35);
      color: var(--accent);
    }

    .mode-card strong {
      display: block;
      font-family: var(--font-display);
      color: var(--accent-text);
      font-size: 20px;
      margin-bottom: 10px;
    }

    .mode-card small {
      display: block;
      color: var(--text-dim);
      font-family: var(--font-ui);
      line-height: 1.45;
      font-weight: 400;
      letter-spacing: 0;
    }

    .top-actions, .nav-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .nav-actions {
      margin-top: 0;
      min-width: 160px;
    }

    .nav-actions button {
      padding: 10px 12px;
      font-size: 12px;
    }

    .nav-actions .da-back,
    .top-actions .da-back {
      padding: 9px 16px;
      font-size: 12px;
      border-radius: var(--radius-pill);
    }

    .dot {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--dot-color, var(--accent));
      box-shadow: 0 0 18px var(--dot-color, var(--accent)), 0 0 38px var(--dot-color, var(--accent));
      animation: pulse 0.75s ease-in-out infinite alternate;
    }

    .grid-dot {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(217, 70, 239, 0.55), 0 0 22px rgba(217, 70, 239, 0.18);
      transition: background 220ms ease, box-shadow 220ms ease, transform 120ms ease;
    }

    .grid-dot.target-visible {
      background: var(--danger);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.85), 0 0 36px rgba(239, 68, 68, 0.45);
      animation: dangerPulse 0.52s ease-in-out infinite alternate;
    }

    .grid-dot.selected {
      transform: translate(-50%, -50%) scale(1.42);
      background: var(--info);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.85), 0 0 28px rgba(34, 211, 238, 0.4);
    }

    .marker {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 2px solid var(--info);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: ring 520ms ease-out forwards;
    }

    .target-ring {
      position: absolute;
      width: 38px;
      height: 38px;
      border: 2px solid var(--danger);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 12px var(--particle-color), 0 0 28px var(--particle-color);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: particleBurst 620ms ease-out forwards;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      padding: 10px 18px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      background: rgba(12, 12, 23, 0.92);
      color: var(--text);
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: var(--shadow-1);
      z-index: 5;
      text-align: center;
      max-width: calc(100% - 32px);
    }

    .danger {
      color: var(--danger) !important;
    }

    .success {
      color: var(--accent-text) !important;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--text-faint);
      font-size: 12px;
    }

    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(0.94); opacity: 0.8; }
      to { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }

    @keyframes ring {
      from { opacity: 1; transform: translate(-50%, -50%) scale(0.65); }
      to { opacity: 0; transform: translate(-50%, -50%) scale(2.1); }
    }

    @keyframes particleBurst {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to {
        opacity: 0;
        transform: translate(
          calc(-50% + cos(var(--angle)) * 54px),
          calc(-50% + sin(var(--angle)) * 54px)
        ) scale(0.15);
      }
    }

    @keyframes dangerPulse {
      from { transform: translate(-50%, -50%) scale(0.96); }
      to { transform: translate(-50%, -50%) scale(1.14); }
    }

    @media (max-width: 860px) {
      .app { padding: 10px; }
      header { flex-direction: column; align-items: stretch; min-height: auto; }
      .stats { grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .stat { padding: 7px 5px; }
      .stat span { font-size: 9px; }
      .stat strong { font-size: 13px; }
      .mode-grid { grid-template-columns: 1fr; }
      .mode-card { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="fx-layer" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo-wrap">
          <img src="ghostpixellogo.png" alt="Ghost Pixel" class="game-logo" />
        </div>
        <p>Trust Your Memory. / Created by JGDev</p>
      </div>
      <div class="stats">
        <div class="stat"><span>MODE</span><strong id="modeStat">MENU</strong></div>
        <div class="stat"><span>SCORE</span><strong id="scoreStat">0</strong></div>
        <div class="stat"><span>ROUND</span><strong id="roundStat">0</strong></div>
        <div class="stat"><span>LIVES</span><strong id="livesStat">3</strong></div>
        <div class="stat"><span>COMBO</span><strong id="comboStat">0</strong></div>
      </div>
      <div class="nav-actions">
        <button onclick="showMenu()">Menu</button>
        <button class="da-back" onclick="returnToArcade()">Back to Arcade</button>
      </div>
    </header>

    <main>
      <div id="playfield"></div>
      <div id="message" class="message hidden">Ready</div>

      <div id="overlay" class="overlay">
        <section class="menu">
          <img src="ghostpixellogo.png" alt="Ghost Pixel" class="menu-logo" />
          <p class="tagline">Trust Your Memory.</p>
          <div class="mode-grid">
            <button class="mode-card" onclick="startGame('classic')">
              <strong>Classic</strong>
              <small>One pixel flashes. Remember the position and click where it vanished.</small>
            </button>
            <button class="mode-card" onclick="startGame('sequence')">
              <strong>Sequence</strong>
              <small>Pixels flash in order. Repeat the pattern without losing your nerve.</small>
            </button>
            <button class="mode-card" onclick="startGame('grid')">
              <strong>Grid Mode</strong>
              <small>Find the odd pixels before they blend into the grid. Then pick the right ones.</small>
            </button>
          </div>
          <div class="top-actions">
            <button onclick="showMenu()">Reset</button>
            <button class="da-back" onclick="returnToArcade()">Back to Arcade</button>
          </div>
          <p class="footer-note">Tip: accuracy matters. Random clicking will punish you. Focus properly.</p>
          <div id="leaderboard"></div>
        </section>
      </div>
    </main>
  </div>  <script src="../../assets/leaderboard.js?v=3"></script>
  <script>
    const lbPanel = document.getElementById('leaderboard');
    DeskArcadeLeaderboard.mountPanel(lbPanel, 'ghostpixel', 'classic');

    const playfield = document.getElementById('playfield');
    const overlay = document.getElementById('overlay');
    const message = document.getElementById('message');

    const stats = {
      mode: document.getElementById('modeStat'),
      score: document.getElementById('scoreStat'),
      round: document.getElementById('roundStat'),
      lives: document.getElementById('livesStat'),
      combo: document.getElementById('comboStat')
    };

    let state = {
      mode: 'menu',
      score: 0,
      round: 0,
      lives: 3,
      combo: 0,
      active: false,
      phase: 'idle',
      inputReady: false,
      answerArmed: false,
      armStart: null,
      target: null,
      sequence: [],
      sequenceInput: 0,
      gridTargets: [],
      gridSelected: new Set(),
      timer: null
    };

    function updateStats() {
      stats.mode.textContent = state.mode.toUpperCase();
      stats.score.textContent = state.score;
      stats.round.textContent = state.round;
      stats.lives.textContent = state.lives;
      stats.combo.textContent = state.combo;
    }

    function clearTimers() {
      if (state.timer) clearTimeout(state.timer);
      state.timer = null;
    }

    function clearField() {
      playfield.innerHTML = '';
      clearTimers();
    }

    function setInputReady(isReady) {
      state.inputReady = isReady;
      playfield.classList.toggle('input-locked', !isReady);
      document.body.classList.toggle('cursor-hidden', !isReady);
    }

    function returnToArcade() {
      window.location.href = '../../index.html';
    }

    const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
    const ARM_DISTANCE = isCoarsePointer ? 8 : 60;

    function armSelectionAfterMovement() {
      state.answerArmed = false;
      state.armStart = null;
      if (isCoarsePointer) {
        state.answerArmed = true;
        showMessage(state.mode === 'grid' ? 'TAP THE HIDDEN PIXELS' : 'TAP NOW');
        return;
      }
      showMessage('MOVE MOUSE, THEN SELECT');
    }

    function saveBest(mode, score) {
      const key = 'ghostpixelBest_' + mode;
      const prev = Number(localStorage.getItem(key) || 0);
      if (score > prev) localStorage.setItem(key, String(score));
    }

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = 'message';
      if (type) message.classList.add(type);
      message.classList.remove('hidden');
    }

    function hideMessage() {
      message.classList.add('hidden');
    }

    function showMenu() {
      state = {
        mode: 'menu', score: 0, round: 0, lives: 3, combo: 0, active: false,
        phase: 'idle', inputReady: true, answerArmed: true, armStart: null, target: null, sequence: [], sequenceInput: 0,
        gridTargets: [], gridSelected: new Set(), timer: null
      };
      clearField();
      hideMessage();
      setInputReady(true);
      overlay.classList.remove('hidden');
      updateStats();
    }

    function startGame(mode) {
      clearField();
      overlay.classList.add('hidden');
      state.mode = mode;
      DeskArcadeLeaderboard.mountPanel(lbPanel, 'ghostpixel', state.mode);
      state.score = 0;
      state.round = 0;
      state.lives = 3;
      state.combo = 0;
      state.active = true;
      state.phase = 'idle';
      updateStats();
      nextRound();
    }

    function nextRound() {
      if (!state.active) return;
      state.round++;
      state.phase = 'show';
      setInputReady(false);
      clearField();
      updateStats();

      if (state.mode === 'classic') runClassicRound();
      if (state.mode === 'sequence') runSequenceRound();
      if (state.mode === 'grid') runGridRound();
    }

    function fieldRect() {
      return playfield.getBoundingClientRect();
    }

    function randomPoint(margin = 50) {
      const rect = fieldRect();
      return {
        x: margin + Math.random() * Math.max(20, rect.width - margin * 2),
        y: margin + Math.random() * Math.max(20, rect.height - margin * 2)
      };
    }

    function makeDot(x, y, size = 22, color = 'var(--accent)', className = 'dot') {
      const dot = document.createElement('div');
      dot.className = className;
      dot.style.setProperty('--x', x + 'px');
      dot.style.setProperty('--y', y + 'px');
      dot.style.setProperty('--size', size + 'px');
      dot.style.setProperty('--dot-color', color);
      playfield.appendChild(dot);
      return dot;
    }

    function addRing(x, y, className = 'marker') {
      const ring = document.createElement('div');
      ring.className = className;
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      playfield.appendChild(ring);
      setTimeout(() => ring.remove(), 650);
    }

    function burst(x, y, type = 'success') {
      const color = type === 'danger' ? 'var(--danger)' : 'var(--info)';
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.setProperty('--angle', (Math.PI * 2 * i / 16) + 'rad');
        p.style.setProperty('--particle-color', color);
        playfield.appendChild(p);
        setTimeout(() => p.remove(), 650);
      }
    }

    function revealTime(base = 1100, min = 360) {
      return Math.max(min, base - state.round * 42);
    }

    function loseLife(reason = 'MISS') {
      state.lives--;
      state.combo = 0;
      showMessage(reason, 'danger');
      updateStats();
      if (state.lives <= 0) {
        gameOver();
      } else {
        state.timer = setTimeout(nextRound, 900);
      }
    }

    function award(points, text = 'PERFECT') {
      state.combo++;
      state.score += points + (state.combo * 10);
      showMessage(text, 'success');
      updateStats();
      state.timer = setTimeout(nextRound, 750);
    }

    function gameOver() {
      state.active = false;
      clearTimers();
      saveBest(state.mode, state.score);
      const bestKey = 'ghostpixelBest_' + state.mode;
      const best = Number(localStorage.getItem(bestKey) || 0);
      const isRecord = state.score >= best;
      showMessage('GAME OVER — Score: ' + state.score, 'danger');
      overlay.classList.remove('hidden');
      const menu = overlay.querySelector('.menu');
      menu.querySelector('.tagline').textContent =
        'Score: ' + state.score + ' · Round ' + state.round +
        (isRecord ? ' · New best!' : ' · Best: ' + best);

      DeskArcadeLeaderboard.trySubmit('ghostpixel', state.score, { panel: lbPanel, boardKey: state.mode }).catch(() => {});
    }

    function runClassicRound() {
      showMessage('MEMORISE THE PIXEL');
      const size = Math.max(10, 26 - state.round * 0.55);
      const p = randomPoint(58);
      state.target = p;
      makeDot(p.x, p.y, size, 'var(--accent)');

      state.timer = setTimeout(() => {
        clearField();
        showMessage('CLICK WHERE IT WAS');
        state.phase = 'answer';
        setInputReady(true);
        armSelectionAfterMovement();
      }, revealTime(1150, 330));
    }

    function handleClassicClick(x, y) {
      if (state.phase !== 'answer' || !state.target || !state.answerArmed) return;
      const dist = Math.hypot(x - state.target.x, y - state.target.y);
      addRing(x, y);
      addRing(state.target.x, state.target.y, 'target-ring');
      state.phase = 'locked';

      const perfect = Math.max(18, 42 - state.round * 0.7);
      const close = perfect * 2.2;

      if (dist <= perfect) {
        burst(state.target.x, state.target.y, 'success');
        award(120, 'PERFECT');
      } else if (dist <= close) {
        burst(state.target.x, state.target.y, 'success');
        award(55, 'CLOSE');
      } else {
        burst(state.target.x, state.target.y, 'danger');
        loseLife('MISS');
      }
    }

    function runSequenceRound() {
      const length = Math.min(8, 2 + Math.floor(state.round / 2));
      const size = Math.max(11, 25 - state.round * 0.4);
      state.sequence = Array.from({ length }, () => randomPoint(58));
      state.sequenceInput = 0;
      showMessage('WATCH THE SEQUENCE');

      let i = 0;
      const flash = () => {
        clearField();
        if (i >= state.sequence.length) {
          clearField();
          showMessage('REPEAT THE SEQUENCE');
          state.phase = 'answer';
        setInputReady(true);
        armSelectionAfterMovement();
          return;
        }
        const p = state.sequence[i];
        makeDot(p.x, p.y, size, i % 2 ? 'var(--info)' : 'var(--accent)');
        i++;
        state.timer = setTimeout(flash, Math.max(270, 620 - state.round * 18));
      };
      flash();
    }

    function handleSequenceClick(x, y) {
      if (state.phase !== 'answer' || !state.answerArmed) return;
      const target = state.sequence[state.sequenceInput];
      const dist = Math.hypot(x - target.x, y - target.y);
      const tolerance = Math.max(20, 46 - state.round * 0.55);
      addRing(x, y);

      if (dist <= tolerance) {
        state.sequenceInput++;
        state.score += 35 + state.combo * 4;
        showMessage('GOOD / ' + state.sequenceInput + ' OF ' + state.sequence.length, 'success');
        updateStats();
        if (state.sequenceInput >= state.sequence.length) {
          state.phase = 'locked';
          burst(x, y, 'success');
          award(140 + state.sequence.length * 25, 'SEQUENCE COMPLETE');
        }
      } else {
        addRing(target.x, target.y, 'target-ring');
        state.phase = 'locked';
        loseLife('WRONG PIXEL');
      }
    }

    function runGridRound() {
      showMessage('FIND THE RED PIXELS');
      state.gridTargets = [];
      state.gridSelected = new Set();
      const rect = fieldRect();
      const cols = 10;
      const rows = 10;
      const total = cols * rows;
      const targetCount = Math.min(12, state.round);
      const size = Math.max(11, Math.min(rect.width / 32, rect.height / 22));
      const gapX = rect.width / (cols + 1);
      const gapY = rect.height / (rows + 1);
      const targetIndexes = new Set();

      while (targetIndexes.size < targetCount) {
        targetIndexes.add(Math.floor(Math.random() * total));
      }

      let index = 0;
      for (let r = 1; r <= rows; r++) {
        for (let c = 1; c <= cols; c++) {
          const x = c * gapX;
          const y = r * gapY;
          const dot = makeDot(x, y, size, 'var(--accent)', 'grid-dot');
          dot.dataset.index = index;
          dot.dataset.x = x;
          dot.dataset.y = y;
          if (targetIndexes.has(index)) {
            dot.classList.add('target-visible');
            state.gridTargets.push(index);
          }
          index++;
        }
      }

      state.timer = setTimeout(() => {
        document.querySelectorAll('.grid-dot').forEach(dot => dot.classList.remove('target-visible'));
        showMessage('SELECT ' + targetCount + ' HIDDEN PIXEL' + (targetCount > 1 ? 'S' : ''));
        state.phase = 'answer';
        setInputReady(true);
        armSelectionAfterMovement();
      }, revealTime(1700, 520));
    }

    function handleGridClick(target) {
      if (state.phase !== 'answer' || !state.answerArmed || !target.classList.contains('grid-dot')) return;
      const index = Number(target.dataset.index);
      if (state.gridSelected.has(index)) return;

      state.gridSelected.add(index);
      target.classList.add('selected');

      const correct = state.gridTargets.includes(index);
      if (!correct) {
        state.phase = 'locked';
        revealGridTargets();
        loseLife('WRONG DOT');
        return;
      }

      state.score += 70 + state.combo * 5;
      updateStats();

      const correctSelected = [...state.gridSelected].filter(i => state.gridTargets.includes(i)).length;
      if (correctSelected >= state.gridTargets.length) {
        state.phase = 'locked';
        revealGridTargets();
        burst(Number(target.dataset.x), Number(target.dataset.y), 'success');
        award(180 + state.gridTargets.length * 35, 'GRID CLEARED');
      } else {
        showMessage('GOOD / ' + correctSelected + ' OF ' + state.gridTargets.length, 'success');
      }
    }

    function revealGridTargets() {
      document.querySelectorAll('.grid-dot').forEach(dot => {
        if (state.gridTargets.includes(Number(dot.dataset.index))) {
          dot.classList.add('target-visible');
        }
      });
    }

    function armFromPointer(clientX, clientY) {
      if (!state.active || state.phase !== 'answer' || state.answerArmed) return;
      const rect = fieldRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      if (!state.armStart) {
        state.armStart = { x, y };
        return;
      }

      const moved = Math.hypot(x - state.armStart.x, y - state.armStart.y);
      if (moved >= ARM_DISTANCE) {
        state.answerArmed = true;
        showMessage(state.mode === 'grid' ? 'SELECT THE HIDDEN PIXELS' : 'SELECT NOW');
      }
    }

    playfield.addEventListener('pointermove', (event) => {
      armFromPointer(event.clientX, event.clientY);
    });

    playfield.addEventListener('pointerdown', (event) => {
      if (!state.active || state.phase !== 'answer' || state.answerArmed) return;
      if (isCoarsePointer) {
        state.answerArmed = true;
        showMessage(state.mode === 'grid' ? 'TAP THE HIDDEN PIXELS' : 'TAP NOW');
      }
    });

    playfield.addEventListener('click', (event) => {
      if (!state.active || !state.inputReady) return;
      const rect = fieldRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      if (state.mode === 'classic') handleClassicClick(x, y);
      if (state.mode === 'sequence') handleSequenceClick(x, y);
      if (state.mode === 'grid') handleGridClick(event.target);
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') showMenu();
    });

    updateStats();
  </script>
</body>
</html>
